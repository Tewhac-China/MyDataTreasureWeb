"img":"projects/bilibili-kb/kepu/raw/BV16jzaYfELF_f2.jpg","t":"~9:18","desc":"低角度跟拍：红色重载卡车拖着蓝色塔筒在泥泞山路上艰难爬坡，车轮扬起尘土；字幕提到后续雨水会影响吊装进度。<br>![](..\\raw\\BV16jzaYfELF_f2.jpg)","note":"山地运输难题：近 30 米的塔筒需由装载机串联牵引才能爬上陡坡，路况直接决定吊装节奏。","id":"BV16jzaYfELF","title":"风机吊装全过程记录！全国唯一的LG1750起重机！","upper":"HansPhotos工程机械摄影","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV16jzaYfELF_f3.jpg","t":"~13:57","desc":"仰拍：白色圆柱形塔筒被红色起重机吊至竖直状态，背景是灰蒙蒙的天空，多根吊索从塔筒顶部延伸向起重机臂。<br>![](..\\raw\\BV16jzaYfELF_f3.jpg)","note":"塔筒安装：LG1750 吊起塔筒上部，中联重科汽车吊协同吊尾部，防止触地，然后旋转对准基础并固定螺栓。","id":"BV16jzaYfELF","title":"风机吊装全过程记录！全国唯一的LG1750起重机！","upper":"HansPhotos工程机械摄影","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV16jzaYfELF_f4.jpg","t":"~18:36","desc":"近景：一台国产徐工 700 吨级全地面起重机停在公路旁，车身多轴轮胎与黄色吊臂清晰可见。<br>![](..\\raw\\BV16jzaYfELF_f4.jpg)","note":"周边配套：同一风电场还有其他大吨位起重机在临时待命，反映风电吊装对重型装备的庞大需求。","id":"BV16jzaYfELF","title":"风机吊装全过程记录！全国唯一的LG1750起重机！","upper":"HansPhotos工程机械摄影","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV16jzaYfELF_f5.jpg","t":"~23:15","desc":"高空航拍：三只 93.5 米白色叶片已与轮毂组接成叶轮，正被红色 LG1750 从地面吊向百米高空，山体与远处塔筒构成背景。<br>![](..\\raw\\BV16jzaYfELF_f5.jpg)","note":"叶轮吊装：三只叶片扫风面积约 27450 平方米，体积庞大但重量较轻，需将叶片仰至 90° 以减小风载。","id":"BV16jzaYfELF","title":"风机吊装全过程记录！全国唯一的LG1750起重机！","upper":"HansPhotos工程机械摄影","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV16jzaYfELF_f6.jpg","t":"~27:54","desc":"夕阳下：LG1750 起重机侧面全景，超起配重托盘清晰可见，旁边是已竖立完成的风机塔筒；画面左侧白色字幕解释起重机拉起和放倒时需要最多配重。<br>![](..\\raw\\BV16jzaYfELF_f6.jpg)","note":"工程收尾：通过调节超起配重半径与悬浮状态实现起重机回转平衡，吊装完成后即拆解转场，奔赴下一基位。","id":"BV16jzaYfELF","title":"风机吊装全过程记录！全国唯一的LG1750起重机！","upper":"HansPhotos工程机械摄影","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1MSx4e1Eu5_f1.jpg","t":"~1:04","desc":"开场提出疑问：为何90年代240P游戏在显像管电视上更清晰自然，并简述显像管原理——电子束在偏转线圈磁场控制下逐行扫描、轰击荧光粉发光，每行点亮处即一条扫描线；扫描线越细分辨率越高，而低级游戏机只输出两百多行，行间便留下黑色间隙。<br>![](..\\raw\\BV1MSx4e1Eu5_f1.jpg)","note":"显像管靠逐行扫描形成扫描线，低分辨率游戏机在行间留下黑间隙。","id":"BV1MSx4e1Eu5","title":"【独家解析】为何CRT显示老游戏清晰又自然？","upper":"脑浆油条","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1MSx4e1Eu5_f2.jpg","t":"~2:09","desc":"解释扫描线间隙不仅提升清晰度，还能借人眼的马赫带效应弱化老游戏发色数不足导致的色阶；水平方向则靠模拟信号传输与放大中的高频衰减、以及电子束弥散源相互叠加造成的像素融合来柔化色彩断层——标清的阶梯状信号经电路后波形变平滑，且标清管电子束较粗，即便保留高频也会被弥散叠加抹平。<br>![](..\\raw\\BV1MSx4e1Eu5_f2.jpg)","note":"黑间隙抗色阶靠马赫带效应，水平色阶靠模拟信号高频衰减与电子束弥散融合。","id":"BV1MSx4e1Eu5","title":"【独家解析】为何CRT显示老游戏清晰又自然？","upper":"脑浆油条","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1MSx4e1Eu5_f3.jpg","t":"~3:13","desc":"对比高清与标清显像管对低解游戏的柔化差异，指出高清管像透过百叶窗看马赛克、柔化很少；普通平滑差值虽减色阶锯齿却误伤清晰边缘、令人头晕，而方块像素的伪影反而让大脑确认视线聚焦良好。进一步说明显像管扫描线随亮度变粗、在亮暗边缘处粗细突变，从而抗模糊、强化边缘。<br>![](..\\raw\\BV1MSx4e1Eu5_f3.jpg)","note":"显像管靠扫描线随亮度变粗实现抗模糊，方块像素伪影反而利于聚焦。","id":"BV1MSx4e1Eu5","title":"【独家解析】为何CRT显示老游戏清晰又自然？","upper":"脑浆油条","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1MSx4e1Eu5_f4.jpg","t":"~4:18","desc":"讲解扫描线粗细变化带来的虚实观感：越亮的物体扫描线越粗、视觉越实，越暗越虚，类似绘画摄影的虚实结合以增强立体与层次；优秀游戏会针对这一动态像素宽度做微调，例如把人物鼻头用更亮颜色使其突出、调节字体笔画粗细与瞳孔占比，并点出等宽方块像素相对失真的本质。<br>![](..\\raw\\BV1MSx4e1Eu5_f4.jpg)","note":"扫描线粗细制造虚实层次，好游戏据此微调像素；方块像素等宽失真。","id":"BV1MSx4e1Eu5","title":"【独家解析】为何CRT显示老游戏清晰又自然？","upper":"脑浆油条","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1MSx4e1Eu5_f5.jpg","t":"~5:22","desc":"说明显像管的泛光特性：前面板玻璃厚达1.5厘米，每个像素发出的光有一部分在玻璃内多次反射、传播到远处，效果类似空气中的散射，使画面更真实柔和；2000年后液晶取代显像管、屏幕不再自带泛光，于是大量游戏改用GPU计算来模拟这种效果。<br>![](..\\raw\\BV1MSx4e1Eu5_f5.jpg)","note":"厚玻璃多次反射产生泛光，液晶时代改由GPU模拟。","id":"BV1MSx4e1Eu5","title":"【独家解析】为何CRT显示老游戏清晰又自然？","upper":"脑浆油条","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1MSx4e1Eu5_f6.jpg","t":"~6:27","desc":"收尾给出五点总结：扫描线间隙与阴照点提升清晰度并弱化色阶、模拟信号与扫描线融合使画面柔和、扫描线动态粗细抗模糊增强层次、老游戏针对动态像素宽度适配、泛光使画面自然；提醒这些特性基本都可用现代GPU在高分屏模拟（如作者开发的荧光系列着色器），唯独低帧率下显像管的超高动态清晰度目前平板难以达到，将另出视频解析。<br>![](..\\raw\\BV1MSx4e1Eu5_f6.jpg)","note":"五大特性可用GPU模拟，唯独低帧率动态清晰度平板尚难企及。","id":"BV1MSx4e1Eu5","title":"【独家解析】为何CRT显示老游戏清晰又自然？","upper":"脑浆油条","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1oW421X7Ni_f1.jpg","t":"~0:51","desc":"以产房分娩开场，回溯受孕起点：胚胎着床激活母体免疫（似感冒），两天后 hCG（人绒毛膜促性腺激素）飙升使验孕棒出现两道杠；hCG 既保护胎儿免遭免疫攻击，也可能引发孕吐以避食不洁物。<br>![](..\\raw\\BV1oW421X7Ni_f1.jpg)","note":"怀孕最早的化学信号是 hCG，它同时解释“两道杠”与早孕呕吐。","id":"BV1oW421X7Ni","title":"幻痛体验，怀孕会怎样改造你的身体？-【冷却报告】","upper":"冷却报告","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1oW421X7Ni_f2.jpg","t":"~1:41","desc":"孕中期起胎盘分泌孕激素、雌激素使乳房变大、乳晕变深；母体分泌“松弛素”让腹直肌从中间撕裂、腹部出现黑线，并随循环使肠道（便秘）、胃部（反酸）、韧带（牙齿松动、骨头散架）全面松弛，坐下时子宫韧带牵拉作痛。<br>![](..\\raw\\BV1oW421X7Ni_f2.jpg)","note":"松弛素是孕中身体松弛的“总开关”，牵一发而动全身。","id":"BV1oW421X7Ni","title":"幻痛体验，怀孕会怎样改造你的身体？-【冷却报告】","upper":"冷却报告","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1oW421X7Ni_f3.jpg","t":"~2:32","desc":"孕晚期子宫已达西瓜大小，把胃挤到胸口、肠道变形、便秘加重；压迫静脉致久站头晕，压迫坐骨神经致酸痛背痛，压迫膈肌致呼吸急促，压迫膀胱致尿频起夜。<br>![](..\\raw\\BV1oW421X7Ni_f3.jpg)","note":"子宫膨胀以“物理挤压”方式重新排布内脏，带来一系列不适。","id":"BV1oW421X7Ni","title":"幻痛体验，怀孕会怎样改造你的身体？-【冷却报告】","upper":"冷却报告","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1oW421X7Ni_f4.jpg","t":"~3:23","desc":"为保证胎儿供血，心脏更努力泵血、血容量猛增40%–45%，过高心率血压或引发并发症；至41周催产素升高引发宫缩，松弛的骨盆关节被撑大，最终分娩、母子平安，未消退的催产素带来巨大慰藉。<br>![](..\\raw\\BV1oW421X7Ni_f4.jpg)","note":"血容量剧增与催产素宫缩是分娩前后最关键的两道生理关卡。","id":"BV1oW421X7Ni","title":"幻痛体验，怀孕会怎样改造你的身体？-【冷却报告】","upper":"冷却报告","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1oW421X7Ni_f5.jpg","t":"~4:14","desc":"产后进入约六周产褥期，排出约500毫升恶露、子宫与器官自行归位、荷尔蒙回归；但产后雌激素骤降致大规模脱发、色斑，腹直肌分离发生率约15%，15%–30%产妇经历（生理性的）产后抑郁。<br>![](..\\raw\\BV1oW421X7Ni_f5.jpg)","note":"产褥期是身体的“二次复位”，脱发与抑郁皆为生理而非矫情。","id":"BV1oW421X7Ni","title":"幻痛体验，怀孕会怎样改造你的身体？-【冷却报告】","upper":"冷却报告","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1oW421X7Ni_f6.jpg","t":"~5:04","desc":"哺乳期乳房重达平时3–4倍、表面爬满血管，六个月约被吮吸四十多万次，不少女性经历乳头皲裂、堵奶如铅球般硬痛；而长辈“月子不能洗澡下床”的迷信反而致病，叠加“一孕傻三年”偏见与陪产假缺失带来的职场歧视。<br>![](..\\raw\\BV1oW421X7Ni_f6.jpg)","note":"哺乳痛与陈旧月子迷信、职场歧视，构成产后被长期忽视的现实负担。","id":"BV1oW421X7Ni","title":"幻痛体验，怀孕会怎样改造你的身体？-【冷却报告】","upper":"冷却报告","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1M142117EC_f1.jpg","t":"~2:59","desc":"以24bit与16bit的区别切入：二者差别不在“更响”，而在动态范围（24bit可表达到-144dB，16bit只能到-96dB）；用厘米和毫米尺子、切蛋糕等比喻说明“精度更高即动态范围更大”，并准备做反向相消实验。画面可能展示位深与动态范围的对比图表及相消实验示意。<br>![](..\\raw\\BV1M142117EC_f1.jpg)","note":"采样精度（位深）决定动态范围而非音量；16bit与24bit在-96dB内无差别，超出部分16bit只剩量化噪声。","id":"BV1M142117EC","title":"【读评论】爆锤老烧，我不懂采样定理？详细解答采样率和采样精度的几大误读","upper":"捣鼓音符的小胖","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1M142117EC_f2.jpg","t":"~5:58","desc":"展示反向相消实验结果（16bit与24bit在范围内完美相消、超出后剩噪声），证明精度差异即动态范围差异；接着指出评论把“采样率”误当成“采样上限”，引出“采样率越高越好”的流行观点并准备用实验检验。画面可能展示相消实验波形对比。<br>![](..\\raw\\BV1M142117EC_f2.jpg)","note":"实验证明采样精度差异等同于动态范围差异；而采样率提升的是采样密度/波形平滑度，并非频率上限。","id":"BV1M142117EC","title":"【读评论】爆锤老烧，我不懂采样定理？详细解答采样率和采样精度的几大误读","upper":"捣鼓音符的小胖","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1M142117EC_f3.jpg","t":"~8:57","desc":"逐一反驳“采样率越高越好”：用单正弦波做相消实验两段音频毫无区别；引用傅里叶指出复杂波皆由正弦波叠加，并用全频段白噪声做48k与22050采样率对比实验。画面可能展示正弦波不同采样率波形与白噪声频谱图。<br>![](..\\raw\\BV1M142117EC_f3.jpg)","note":"无论波形简单或复杂，高采样率并未带来可闻差异；白噪声实验显示差异仅在11K–24K频段，即提升的是上限而非整体更顺滑。","id":"BV1M142117EC","title":"【读评论】爆锤老烧，我不懂采样定理？详细解答采样率和采样精度的几大误读","upper":"捣鼓音符的小胖","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1M142117EC_f4.jpg","t":"~11:55","desc":"通过实验指出提高采样率实际提高的是可采样频率的上限（B的上限11K、A的上限24K）；引用奈奎斯特采样定理“大于等于两倍最高频率即可无损失还原”，批评“越高越好”正是误解乃至否定采样定理。画面可能展示奈奎斯特采样定理公式与频谱示意。<br>![](..\\raw\\BV1M142117EC_f4.jpg)","note":"奈奎斯特采样定理明确：采样率≥2倍最高频率即可无损失，超出部分只是提高上限，并非“越高越好”。","id":"BV1M142117EC","title":"【读评论】爆锤老烧，我不懂采样定理？详细解答采样率和采样精度的几大误读","upper":"捣鼓音符的小胖","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1M142117EC_f5.jpg","t":"~14:54","desc":"澄清采样定理是数学结论（≥2倍即“行”），工程上因抗混叠滚降、过采样等需留频率冗余，但绝非越高越好；并点评部分评论者逻辑不通、恼羞成怒、出口伤人的表现。画面可能展示工程实现中的抗混叠滤波器示意图。<br>![](..\\raw\\BV1M142117EC_f5.jpg)","note":"工程实现需在两倍的基准上留一定冗余，但“越高越好”没有依据；理解采样定理应先讲逻辑而非直觉。","id":"BV1M142117EC","title":"【读评论】爆锤老烧，我不懂采样定理？详细解答采样率和采样精度的几大误读","upper":"捣鼓音符的小胖","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1M142117EC_f6.jpg","t":"~17:53","desc":"应评论挑战，生成经高阶滤波滤除3K以上白噪，再用8K与48K采样并做相消实验，结果完全相同；最后回击把“采样率是精度还是范围”都搞混、到处删评论带节奏的网友，将其评论置顶交由观众评判。画面可能展示滤波前后频谱与相消实验结果。<br>![](..\\raw\\BV1M142117EC_f6.jpg)","note":"经滤波限定频段后，8K与48K采样结果毫无差异；视频以实验与置顶评论收尾，强调应尊重采样定理而非人云亦云。","id":"BV1M142117EC","title":"【读评论】爆锤老烧，我不懂采样定理？详细解答采样率和采样精度的几大误读","upper":"捣鼓音符的小胖","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1P1421k7BN_f1.jpg","t":"~1:35","desc":"回顾新疆生产建设兵团的历史渊源：1949年陶峙岳通电起义、新疆和平解放，王震率部进驻；1950年毛主席命令驻疆部队拿起生产武器，同年10月集体转业组建新疆军区生产建设兵团，并澄清“为何让解放军扎根不毛之地”的认知误区。画面可能展示新疆和平解放与早期垦荒的历史照片。<br>![](..\\raw\\BV1P1421k7BN_f1.jpg)","note":"兵团源于1949年新疆和平解放后的驻疆部队集体转业，党中央从一开始就高度重视新疆建设事业。","id":"BV1P1421k7BN","title":"新疆生产建设兵团对新疆有多重要？","upper":"世界见闻录","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1P1421k7BN_f2.jpg","t":"~3:09","desc":"解释成立兵团的现实原因：新疆刚解放时经济困难，农村人均粮食仅195公斤、每三户才有一头耕畜，从关内运粮运价等于粮价七倍，且匪帮肆虐；解放军驻疆部队成为维护和平安宁的“定海神针”。画面可能展示当时新疆农村破败与土匪为患的历史影像。<br>![](..\\raw\\BV1P1421k7BN_f2.jpg)","note":"新疆解放时生态与社会秩序双重崩溃、物资运输极难，驻疆部队一手拿枪平匪、一手生产自救。","id":"BV1P1421k7BN","title":"新疆生产建设兵团对新疆有多重要？","upper":"世界见闻录","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1P1421k7BN_f3.jpg","t":"~4:44","desc":"讲述兵团发展节点：1953年新疆工业总产值达1949年的36倍，1954年新疆军区生产建设兵团正式组建、1981年恢复建制；介绍其“世界最大兵团（超300万人）”的特殊性，以及“是军队没军费，是政府要纳税，是企业管社会，是农民入工会”的职能定位。画面可能展示兵团行政区划与师市合一体制图示。<br>![](..\\raw\\BV1P1421k7BN_f3.jpg)","note":"兵团是实行计划单列的特殊省级单位，兼具军队、政府、企业、农民等多重职能，规模最大。","id":"BV1P1421k7BN","title":"新疆生产建设兵团对新疆有多重要？","upper":"世界见闻录","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1P1421k7BN_f4.jpg","t":"~6:19","desc":"用数据说明兵团实力：2023年实现国民生产总值约3700亿元（约占全疆五分之一），国有控股企业资产总额7263.98亿元；拥有627所各级各类学校；并驳斥西方“占据好地方才壮大”的谣言——兵团起步于不毛之地。画面可能展示兵团经济数据与学校分布图。<br>![](..\\raw\\BV1P1421k7BN_f4.jpg)","note":"兵团凭强悍实力成为与省区并列的单位，其发展壮大靠的是在恶劣环境中扎根垦荒，而非占据良田。","id":"BV1P1421k7BN","title":"新疆生产建设兵团对新疆有多重要？","upper":"世界见闻录","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1P1421k7BN_f5.jpg","t":"~7:54","desc":"以新疆棉为例展现兵团落地能力：与苏联专家迪托夫签订石河子棉花丰产协议，1952年起在玛纳斯河流域推广植棉、1953年首次大丰收；还在戈壁种西瓜、在盐碱水养罗非鱼，并在阿拉尔市建成纺织、印染与光伏产业基地及天康生物兽用疫苗生产线。画面可能展示新疆棉田、戈壁光伏与工厂实景。<br>![](..\\raw\\BV1P1421k7BN_f5.jpg)","note":"兵团靠组织纪律迅速落实新技术，培育出享誉世界的新疆棉，并在农业与工业上创造巨大价值。","id":"BV1P1421k7BN","title":"新疆生产建设兵团对新疆有多重要？","upper":"世界见闻录","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1P1421k7BN_f6.jpg","t":"~9:28","desc":"总结兵团对新疆基建的重大贡献：开垦耕地、兴修水利（沿数十条河修建105座水库、4470余条渠道）、造林12万余公顷防风固沙；2023年9月成立中新建电力集团发展绿色清洁能源，70年建设史如同一首忠诚赞歌。画面可能展示水库、防护林与风光电基地全景。<br>![](..\\raw\\BV1P1421k7BN_f6.jpg)","note":"兵团在垦荒、水利、造林与绿色能源上贡献卓著，70年来是维护新疆稳定与发展的中流砥柱。","id":"BV1P1421k7BN","title":"新疆生产建设兵团对新疆有多重要？","upper":"世界见闻录","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1ey411h7i7_f1.jpg","t":"~4:39","desc":"讲解大疆如何发现农业无人机需求，并以东北一季稻为例说明人工打药之辛苦（背30-60斤药箱、三伏天作业、易中暑中毒、一天最多五亩地）<br>![](..\\raw\\BV1ey411h7i7_f1.jpg)","note":"人工打药既苦又危险且效率极低，催生了无人机打药的需求。","id":"BV1ey411h7i7","title":"播种、施肥、拉渣土，只需34999？大疆种地无人机了解一下","upper":"海狸汽车台","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1ey411h7i7_f2.jpg","t":"~9:17","desc":"介绍农业无人机相对人工的四大优势（效率顶40人、避免农药毒害、桨叶气流使喷施更均匀、可全程监控），并引出真实农田作业的难题：作业验证周期长、工作环境恶劣<br>![](..\\raw\\BV1ey411h7i7_f2.jpg)","note":"农业无人机理论优势明显，但真实作业面临验证周期长、环境恶劣等挑战。","id":"BV1ey411h7i7","title":"播种、施肥、拉渣土，只需34999？大疆种地无人机了解一下","upper":"海狸汽车台","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1ey411h7i7_f3.jpg","t":"~13:56","desc":"讲述在国家政策支持下，大疆于2015年底推出中国首款商用植保无人机MG1（八旋翼、翼展超2米、可载药20斤、半自动作业、辅助雷达定高），售价52999元<br>![](..\\raw\\BV1ey411h7i7_f3.jpg)","note":"大疆MG1以低价和高性价比切入市场，奠定了农业植保无人机的商用基础。","id":"BV1ey411h7i7","title":"播种、施肥、拉渣土，只需34999？大疆种地无人机了解一下","upper":"海狸汽车台","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1ey411h7i7_f4.jpg","t":"~18:35","de g":"projects/bilibili-kb/kepu/raw/BV16Z421n7fi_f4.jpg","t":"~10:52","desc":"画面展示一张小图被拆成红、绿、蓝三个通道的像素矩阵，每个通道都是色彩块；字幕“图片的本质是一串数字”。<br>![](..\\raw\\BV16Z421n7fi_f4.jpg)","note":"把图像映射到像素空间：每个像素 RGB 值构成高维向量，真实图片只占据这个空间中极小的“流形”区域。","id":"BV16Z421n7fi","title":"【硬核科普】清华AI博士教你AI是怎么生成图片和视频的","upper":"漫士沉思录","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV16Z421n7fi_f5.jpg","t":"~13:35","desc":"二维散点图：黑色网格上分布着灰色和橙色小点，形成某种曲线/流形结构；四周有三张彩色噪声小图用线连接到流形上的点。<br>![](..\\raw\\BV16Z421n7fi_f5.jpg)","note":"流形假设（Manifold Hypothesis）：真实图片在像素空间中形成低维流形，生成图片就是从噪声出发“走到”这条流形上。","id":"BV16Z421n7fi","title":"【硬核科普】清华AI博士教你AI是怎么生成图片和视频的","upper":"漫士沉思录","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV16Z421n7fi_f6.jpg","t":"~16:18","desc":"Sora 生成的视频帧网格：多个相似的小猫画面，部分帧被黄色框选中，画面上方有 RGB 数值标注；字幕说明视频还需满足时间维度的连贯性。<br>![](..\\raw\\BV16Z421n7fi_f6.jpg)","note":"Sora 的扩展：视频是带时间维度的图像序列，核心难点是长程依赖与物理一致性（如遮挡、物体持久性）。","id":"BV16Z421n7fi","title":"【硬核科普】清华AI博士教你AI是怎么生成图片和视频的","upper":"漫士沉思录","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV11z4y1b7EB_f1.jpg","t":"~1:51","desc":"画面中央文字卡片：公元前150-前100年「安蒂基西拉机器」，说明其为世界上最早的计算机、用于天文计算；背景为锈蚀青铜机械残片特写。<br>![](..\\raw\\BV11z4y1b7EB_f1.jpg)","note":"古希腊/希腊化时期的天文仪器；齿轮机械可预测天体位置，是人类最早的模拟计算机之一。","id":"BV11z4y1b7EB","title":"从史前壁画到飞向星辰！22分钟看完人类天文史！（天文学史年表）","upper":"追星者阿响","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV11z4y1b7EB_f2.jpg","t":"~5:33","desc":"3D 太阳系模型：中央太阳、环绕的行星与卫星以金色连杆连接；文字标注公元1609年「木星系」及伽利略首次发现木星多颗卫星。<br>![](..\\raw\\BV11z4y1b7EB_f2.jpg)","note":"伽利略用望远镜观测木星卫星，开创实证天文学，动摇地心说。","id":"BV11z4y1b7EB","title":"从史前壁画到飞向星辰！22分钟看完人类天文史！（天文学史年表）","upper":"追星者阿响","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV11z4y1b7EB_f3.jpg","t":"~9:16","desc":"望远镜目镜视角：深蓝天体光点，文字标注公元1782年「伴星掩食」及英国天文学家古德里克提出伴星掩食理论。<br>![](..\\raw\\BV11z4y1b7EB_f3.jpg)","note":"通过分析变星亮度变化首次用几何解释食双星，奠定恒星测光基础。","id":"BV11z4y1b7EB","title":"从史前壁画到飞向星辰！22分钟看完人类天文史！（天文学史年表）","upper":"追星者阿响","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV11z4y1b7EB_f4.jpg","t":"~12:58","desc":"银河全景：繁星背景中可见暗色尘埃带，文字标注公元1895年「银河系暗条」及沃尔夫提出暗区为不透明尘埃云。<br>![](..\\raw\\BV11z4y1b7EB_f4.jpg)","note":"确认银河系中存在大量星际尘埃，遮挡背后星光，形成银河暗带。","id":"BV11z4y1b7EB","title":"从史前壁画到飞向星辰！22分钟看完人类天文史！（天文学史年表）","upper":"追星者阿响","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV11z4y1b7EB_f5.jpg","t":"~16:40","desc":"黑白影像：火箭夜间发射的尾焰光柱，画面有强烈动态模糊，象征人类进入航天时代。<br>![](..\\raw\\BV11z4y1b7EB_f5.jpg)","note":"运载火箭将探测器/望远镜送入太空，人类从地面观测迈向\"飞向星辰\"。","id":"BV11z4y1b7EB","title":"从史前壁画到飞向星辰！22分钟看完人类天文史！（天文学史年表）","upper":"追星者阿响","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV11z4y1b7EB_f6.jpg","t":"~20:22","desc":"火箭发射火光冲天，文字标注公元2003年「斯皮策空间望远镜」及其发射升空。<br>![](..\\raw\\BV11z4y1b7EB_f6.jpg)","note":"斯皮策空间望远镜进入太空开展红外巡天，代表现代空间天文观测的重要里程碑。","id":"BV11z4y1b7EB","title":"从史前壁画到飞向星辰！22分钟看完人类天文史！（天文学史年表）","upper":"追星者阿响","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1TA4m1A7TY_f1.jpg","t":"~2:56","desc":"讲师讲解“色阶”概念，屏幕展示从黑到白、把256个色阶分成十个等级的分布示意图，字幕/画外音说明0为纯黑、255为纯白、128为中性灰。<br>![](..\\raw\\BV1TA4m1A7TY_f1.jpg)","note":"理解直方图先要建立“色阶”概念：色阶只表示明暗，0到255依次对应纯黑到纯白。","id":"BV1TA4m1A7TY","title":"12讲-直方图在摄影前后期的重要性","upper":"安瑞光影","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1TA4m1A7TY_f2.jpg","t":"~5:51","desc":"画面演示直方图与相机测光系统的关系，讲师把宽容度比喻成“一口锅”，并强调前期把格式设为RAW以发挥相机最大性能，号召拍摄时忽略色彩、只看黑白明暗。<br>![](..\\raw\\BV1TA4m1A7TY_f2.jpg)","note":"前期拍摄应练“黑白思维”只关注光线明暗，RAW格式能保留最大后期空间。","id":"BV1TA4m1A7TY","title":"12讲-直方图在摄影前后期的重要性","upper":"安瑞光影","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1TA4m1A7TY_f3.jpg","t":"~8:47","desc":"屏幕把直方图一分为五（黑色、阴影、中间调、高光、白色），用竖向像素多与少示意分布；说明像素扎堆左侧为欠曝、右侧为过曝、顶端溢出则像素丢失不可挽回。<br>![](..\\raw\\BV1TA4m1A7TY_f3.jpg)","note":"直方图五区判读：像素偏左欠曝、偏右过曝、溢出顶端即像素永久丢失。","id":"BV1TA4m1A7TY","title":"12讲-直方图在摄影前后期的重要性","upper":"安瑞光影","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1TA4m1A7TY_f4.jpg","t":"~11:42","desc":"进入后期部分，画面以绘画的高光/阴影/中间调引出照片的正常调、高调、低调三种调性，并提示修图前先确定这张片子的调性。<br>![](..\\raw\\BV1TA4m1A7TY_f4.jpg)","note":"后期先用直方图判断调性（正常/高调/低调），再依调性下手修图。","id":"BV1TA4m1A7TY","title":"12讲-直方图在摄影前后期的重要性","upper":"安瑞光影","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1TA4m1A7TY_f5.jpg","t":"~14:38","desc":"展示一张“发灰”照片及其LR直方图，五个等级（黑色色阶、阴影、曝光度、高光、白色色阶）里大量像素挤在中间调；直接拉高对比度后中间灰区像素减少、向阴影与高光分散。<br>![](..\\raw\\BV1TA4m1A7TY_f5.jpg)","note":"发灰照片用“对比度”把堆积的中间调像素分离到暗部与亮部即可去灰。","id":"BV1TA4m1A7TY","title":"12讲-直方图在摄影前后期的重要性","upper":"安瑞光影","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1TA4m1A7TY_f6.jpg","t":"~17:33","desc":"演示一张过暗、暗部溢出的照片：先提“阴影”再提“黑色色阶”把暗部溢出的像素拉回，画面变亮后又偏灰，最后再加对比度使画面既亮且正常。<br>![](..\\raw\\BV1TA4m1A7TY_f6.jpg)","note":"过暗照片先提阴影/黑色回收溢出像素，再用对比度去灰，对症下药而非盲目调曝光。","id":"BV1TA4m1A7TY","title":"12讲-直方图在摄影前后期的重要性","upper":"安瑞光影","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV156421F7mV_f1.jpg","t":"~7:05","desc":"讲解弗拉基米尔·普洛普1928年发表的《故事形态学》，并引出好莱坞常用的“英雄之旅”模型——源自约瑟夫·坎贝尔1949年的《千面英雄》。画面可能展示相关书籍封面与英雄之旅结构示意图。<br>![](..\\raw\\BV156421F7mV_f1.jpg)","note":"编剧工作存在大量可被程序化的部分，故事结构理论（从古希腊到英雄之旅）历史悠久。","id":"BV156421F7mV","title":"AI写作史，或人类编剧时代的终结","upper":"七叶电波","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV156421F7mV_f2.jpg","t":"~14:11","desc":"回顾电子计算机时代的早期写作程序：1966年最早的聊天机器人伊莱泽（ELIZA）、1950年代的计算机诗歌、1973年Novel Writer、1977年Tailspin故事生成器，以及1984年第一本由电脑程序编写出版的书。<br>![](..\\raw\\BV156421F7mV_f2.jpg)","note":"电子计算机出现后，情书生成器、故事生成器、聊天机器人等程序写作雏形相继诞生。","id":"BV156421F7mV","title":"AI写作史，或人类编剧时代的终结","upper":"七叶电波","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV156421F7mV_f3.jpg","t":"~21:16","desc":"转向新闻领域的自动化写作：2007年统计表（美联社首家AI编辑）、2010年Narrative Science、腾讯Dreamwriter与新华社快笔小新；并谈及2013年网飞《纸牌屋》开创大数据立项时代。<br>![](..\\raw\\BV156421F7mV_f3.jpg)","note":"新闻业最早大规模采用AI写稿，同时大数据（如《纸牌屋》）开始重塑影视创作逻辑。","id":"BV156421F7mV","title":"AI写作史，或人类编剧时代的终结","upper":"七叶电波","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV156421F7mV_f4.jpg","t":"~28:22","desc":"讲述2017年罗斯·古德温驾车横跨美国、用AI实时生成小说《One Road》；同年谷歌推出Transformer模型，奠定后来GPT的基础；并提及2018年剑桥分析数据丑闻。<br>![](..\\raw\\BV156421F7mV_f4.jpg)","note":"Transformer模型取代LSTM成为NLP主流，AI写作进入新阶段，同时数据滥用风险浮出水面。","id":"BV156421F7mV","title":"AI写作史，或人类编剧时代的终结","upper":"七叶电波","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV156421F7mV_f5.jpg","t":"~35:27","desc":"讲述2022年11月30日ChatGPT发布成为里程碑，同期DeepMind推出编剧AI模型Dreamer Strong；2023年3月GPT-4发布，作者借此意识到完全依靠人力编剧的时代已经终结。<br>![](..\\raw\\BV156421F7mV_f5.jpg)","note":"ChatGPT与GPT-4让AI理解自然语言设定的编剧模型，人机协作编剧成为现实。","id":"BV156421F7mV","title":"AI写作史，或人类编剧时代的终结","upper":"七叶电波","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV156421F7mV_f6.jpg","t":"~42:33","desc":"回顾2023年美国编剧工会与演员工会大罢工（围绕AI条款），以及2024年2月OpenAI发布Sora文生视频模型；指出传统编剧格式将让位于提示词，创作门槛大幅降低。<br>![](..\\raw\\BV156421F7mV_f6.jpg)","note":"AI渗透创作全链路，Sora等工具降低电影创作门槛，剧本从写给人的格式转向写给机器的提示词。","id":"BV156421F7mV","title":"AI写作史，或人类编剧时代的终结","upper":"七叶电波","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1zC41147vZ_f1.jpg","t":"~1:48","desc":"先解释“地铁预留结构”定义（为未来线路提前修筑接口或土建），并指出规划时效性与不稳定性常使预留遭废弃；首个案例是一号线西朗站给广佛轻轨的高架预留——当年只预留了修建条件、三楼车站及上盖未建，站前广场花坛正是预留给轻轨支撑柱的位置，后因广佛线改为全地下、走向由南北改东西而废弃。<br>![](..\\raw\\BV1zC41147vZ_f1.jpg)","note":"西朗站的广佛轻轨预留因线路改地下、改走向而彻底废弃，站房拆除后将彻底消失。","id":"BV1zC41147vZ","title":"【广州地铁那些事Ⅶ】那些或鲜为人知或广为流传的废弃预留你又知多少？挖掘广州地铁1、2、8号线的废弃预留","upper":"Grafeugen","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1zC41147vZ_f2.jpg","t":"~3:35","desc":"一号线另两处预留：体育中心站曾为三号线换乘而向西侧让出位置，后三号线改走体育西路致其预留废弃；体育西路站则在连续墙上预留了多处宽5米的黄埔轻轨换乘接口，最终只留下墙洞，受当时资金严重不足的制约未再扩建。<br>![](..\\raw\\BV1zC41147vZ_f2.jpg)","note":"体育中心、体育西路站的预留多因线路改线与资金所限，只留下肉眼可寻的墙洞痕迹。","id":"BV1zC41147vZ","title":"【广州地铁那些事Ⅶ】那些或鲜为人知或广为流传的废弃预留你又知多少？挖掘广州地铁1、2、8号线的废弃预留","upper":"Grafeugen","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1zC41147vZ_f3.jpg","t":"~5:23","desc":"二号线白云公园站（原白云新城站）为与天河北线（今十四号线）做岛侧十字节点换乘而预留，可借“过轨通道破例布置在轨道上方”来识别；因2016年十二号线为配合白云站改向北走、换乘站改到白云文化广场，该预留被废弃（未来佛山六号线或仍有望启用）。<br>![](..\\raw\\BV1zC41147vZ_f3.jpg)","note":"白云公园站的换乘预留因十二号线改线而废，但线位空白或留给佛山六号线填补。","id":"BV1zC41147vZ","title":"【广州地铁那些事Ⅶ】那些或鲜为人知或广为流传的废弃预留你又知多少？挖掘广州地铁1、2、8号线的废弃预留","upper":"Grafeugen","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1zC41147vZ_f4.jpg","t":"~7:10","desc":"广州南站高铁底下预留了七号线、佛山三号线（今佛山二号线）与十二号线；给佛山三号线的预留位于七号线南端轨行区与原B出口处，原设计“头对头”站前折返，后因七号线由四L改六B并延伸顺德，该预留被七号线自身占用以满足扩建需求。<br>![](..\\raw\\BV1zC41147vZ_f4.jpg)","note":"广州南站佛山三号线预留并非完全废弃，而是被改六B后的七号线占用。","id":"BV1zC41147vZ","title":"【广州地铁那些事Ⅶ】那些或鲜为人知或广为流传的废弃预留你又知多少？挖掘广州地铁1、2、8号线的废弃预留","upper":"Grafeugen","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1zC41147vZ_f5.jpg","t":"~8:58","desc":"广州南站那处预留并未彻底消失——原节点栏杆被拆除、铺砖装售票机，佛山车站改设西广场，近期佛山二号线付费区改造又令售票机移位，昔日的预留节点如今成了南站付费区与非付费区的边界，路过乘客难以察觉。<br>![](..\\raw\\BV1zC41147vZ_f5.jpg)","note":"规划小变动让广州南站预留以“付费区边界”的形式被另一种方式使用。","id":"BV1zC41147vZ","title":"【广州地铁那些事Ⅶ】那些或鲜为人知或广为流传的废弃预留你又知多少？挖掘广州地铁1、2、8号线的废弃预留","upper":"Grafeugen","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1zC41147vZ_f6.jpg","t":"~10:45","desc":"八号线同福西站原为与十九号线做“门型”换乘而修改设计（站台北侧端头节点），后因二十八号线市域快线接管海珠段、站距偏大取消设站，预留或废弃；如今可见万胜围方向站台预留成了智能仓库、滘心方向成了卫生间，东西站厅背后仍藏着通旧十九号线的预留接口。<br>![](..\\raw\\BV1zC41147vZ_f6.jpg)","note":"同福西站十九号线换乘预留因二十八号线取代而大概率废弃，现多被改作仓库与卫生间。","id":"BV1zC41147vZ","title":"【广州地铁那些事Ⅶ】那些或鲜为人知或广为流传的废弃预留你又知多少？挖掘广州地铁1、2、8号线的废弃预留","upper":"Grafeugen","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Lt411t7Lh_f1.jpg","t":"~2:50","desc":"开场说明光的偏振在众多技术乃至量子力学实验中至关重要；把光看作由电场与磁场构成的电磁波，演示两列同方向电磁波在某点矢量相加使振幅增大，方向不同时合成波方向改变，若其中一列超前则合成波随空间与时间连续旋转。<br>![](..\\raw\\BV1Lt411t7Lh_f1.jpg)","note":"光可视为电磁波，偏振源于电场矢量的叠加方式。","id":"BV1Lt411t7Lh","title":"【直观解释】光的偏振：圆偏振，线偏振，非偏振光","upper":"Laplaceの拌饭酱","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Lt411t7Lh_f2.jpg","t":"~5:40","desc":"进一步区分偏振类型：若一列波相对另一列超前的方向不同，合成波会反向连续旋转；所有波同向者为线偏振光，同向连续旋转者为圆偏振光，而灯泡、蜡烛、太阳等各方向混杂者为非偏振光。并说明每个电磁波含相互垂直90度的电场与磁场，为便于可视化只画电场，且任一波都可拆成沿两个方向的两列波。<br>![](..\\raw\\BV1Lt411t7Lh_f2.jpg)","note":"圆偏振、线偏振、非偏振的区别在于电场矢量的方向与旋转方式。","id":"BV1Lt411t7Lh","title":"【直观解释】光的偏振：圆偏振，线偏振，非偏振光","upper":"Laplaceの拌饭酱","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Lt411t7Lh_f3.jpg","t":"~8:30","desc":"讲解线性偏振片：某些材料阻挡某一方向的电磁波、放行与之垂直的另一方向，因此无论入射是圆偏振、线偏振还是非偏振，出射都只剩线偏振光；若入射的线偏振方向正对阻挡方向则光被全部挡住，旋转偏振片则可透光；非偏振光穿过后变为线偏振光，故称为线性偏振器。<br>![](..\\raw\\BV1Lt411t7Lh_f3.jpg)","note":"线性偏振片只放行某一方向的电场，把光转换为线偏振。","id":"BV1Lt411t7Lh","title":"【直观解释】光的偏振：圆偏振，线偏振，非偏振光","upper":"Laplaceの拌饭酱","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Lt411t7Lh_f4.jpg","t":"~11:21","desc":"演示两片线偏振片：当二者相互旋转90度时完全不透光；在中间插入第三片并旋转到0到90度之间，竟又有光透过，且透过量取决于第三片的角度。其原理是线偏振光可分解为沿偏振片两轴的两列波，仅一轴放行，使出射波方向被旋转，从而能穿过最后一片。<br>![](..\\raw\\BV1Lt411t7Lh_f4.jpg)","note":"中间插入第三片偏振片可让本应不透光的组合重新透光。","id":"BV1Lt411t7Lh","title":"【直观解释】光的偏振：圆偏振，线偏振，非偏振光","upper":"Laplaceの拌饭酱","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Lt411t7Lh_f5.jpg","t":"~14:11","desc":"引入四分之一波片：真空中光速恒定，但穿过材料会因电磁波方向不同而减速不同；若两方向减速差恰为四分之一波长即为四分之一波片。线偏振光以45度入射时可拆成两列波、一列比另一列慢四分之一波长，矢量相加后变为圆偏振光；圆偏振光再经四分之一波片则还原为线偏振光。<br>![](..\\raw\\BV1Lt411t7Lh_f5.jpg)","note":"四分之一波片能把线偏振与圆偏振相互转换。","id":"BV1Lt411t7Lh","title":"【直观解释】光的偏振：圆偏振，线偏振，非偏振光","upper":"Laplaceの拌饭酱","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Lt411t7Lh_f6.jpg","t":"~17:01","desc":"收尾重申光的偏振现象在众多技术与量子力学实验中意义重大，这些现象挑战着我们对现实本质的预设，并预告频道将有更多相关视频。<br>![](..\\raw\\BV1Lt411t7Lh_f6.jpg)","note":"偏振现象兼具技术价值与量子力学意义，视频以预告更多内容收尾。","id":"BV1Lt411t7Lh","title":"【直观解释】光的偏振：圆偏振，线偏振，非偏振光","upper":"Laplaceの拌饭酱","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1q84y1m7be_f1.jpg","t":"~2:51","desc":"以孔雀蛱蝶翅膀为例对比光学与电子显微镜：光学镜只看到重叠的鳞片，电子镜能看清每片鳞的精细结构；进而引出两类电镜——扫描电镜（SEM，观察表面，分辨率约1纳米）与透射电镜（TEM，观察材料内部，如同给物体拍“X光”）。<br>![](..\\raw\\BV1q84y1m7be_f1.jpg)","note":"电子显微镜让人类得以观察纳米乃至原子尺度，分“看表面”的SEM与“看内部”的TEM两类。","id":"BV1q84y1m7be","title":"天工开物:电子显微镜(2023)水山汉化","upper":"altabili","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1q84y1m7be_f2.jpg","t":"~5:41","desc":"讲解透射电镜（TEM）原理：电子被加速到约70%光速，经磁透镜聚焦后穿透仅约100纳米厚的样品，因内部密度与材料不同被散射而“印”出内部影像，再由物镜放大40倍、投射镜放大5万倍，由显微镜底部的高清相机记录。<br>![](..\\raw\\BV1q84y1m7be_f2.jpg)","note":"TEM 通过“电子穿透+散射成像”揭示样品内部结构，放大倍率远超光学极限。","id":"BV1q84y1m7be","title":"天工开物:电子显微镜(2023)水山汉化","upper":"altabili","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1q84y1m7be_f3.jpg","t":"~8:32","desc":"解释为何用电子而非光：受磁透镜物理限制，TEM 实际分辨率约50皮米（足以看到单个原子）；并介绍“场发射源”——尖端仅几纳米宽的钨晶针，在+5000伏提取环的正电场下把自由电子“拉”出来。<br>![](..\\raw\\BV1q84y1m7be_f3.jpg)","note":"场发射源靠强电场从钨针尖释放电子，是整台电镜的电子起点。","id":"BV1q84y1m7be","title":"天工开物:电子显微镜(2023)水山汉化","upper":"altabili","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1q84y1m7be_f4.jpg","t":"~11:22","desc":"介绍磁透镜的三组分工：聚光镜把电子束聚焦到微米至数纳米的样品区域，光阑滤除非轴向电子使其更平行；样品台可在 x、y、z 平移并绕轴旋转以获取垂直视角；物镜（电镜之心）放大40倍且其像差决定最终分辨率，投射镜再放大5万倍。<br>![](..\\raw\\BV1q84y1m7be_f4.jpg)","note":"物镜的像差上限决定了电镜亚纳米级分辨率的极限，是工程攻关重点。","id":"BV1q84y1m7be","title":"天工开物:电子显微镜(2023)水山汉化","upper":"altabili","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1q84y1m7be_f5.jpg","t":"~14:13","desc":"揭示磁透镜运作原理：铜线圈通电产生磁场、经铁壳导向极靴汇聚到光轴，依洛伦兹力 F=q(v×B) 像凸透镜般把电子会聚到焦点，越过焦点后扩散成放大像；并提醒需正确调焦，否则失焦电子束可能损伤敏感的SEM相机。<br>![](..\\raw\\BV1q84y1m7be_f5.jpg)","note":"磁透镜靠洛伦兹力实现电子的会聚与放大，形态虽异于玻璃透镜本质相同。","id":"BV1q84y1m7be","title":"天工开物:电子显微镜(2023)水山汉化","upper":"altabili","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1q84y1m7be_f6.jpg","t":"~17:03","desc":"列举电镜的配套系统——X射线探测器、能量过滤器、相位板、单色器、像差校正器、磁透镜水冷与真空泵等，整台仪器置于气垫上以隔绝外部振动；并致谢赞助方赛默飞（Thermo Fisher）及 Branch Education 的制作理念，结尾提及兼具扫描与元素分析的 STEM 变体。<br>![](..\\raw\\BV1q84y1m7be_f6.jpg)","note":"一台电镜是磁、电、真空、隔振系统的综合体，STEM 更可切换模式做元素分析。","id":"BV1q84y1m7be","title":"天工开物:电子显微镜(2023)水山汉化","upper":"altabili","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1vw411w7Bp_f1.jpg","t":"~1:52","desc":"以韩国为例展开：1950年韩国约2000万人、2023年约5200万、预计2100年回落至约2400万，但人口结构恶化（中位年龄从18岁升至45岁、2100年将达59岁）；并提及中国因工业化与独生子女政策出现史上最陡的人口反转<br>![](..\\raw\\BV1vw411w7Bp_f1.jpg)","note":"韩国人口数量将回落，但老龄化（中位年龄飙升）才是真正难题，中国亦面临类似反转。","id":"BV1vw411w7Bp","title":"Kurzgesagt科普：为什么韩国正在消亡（中英字幕）","upper":"Kurzgesagt-科普","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1vw411w7Bp_f2.jpg","t":"~3:44","desc":"指出中东与撒哈拉以南非洲生育率仍高、曾引发人口过剩担忧，但联合国已大幅下调非洲预测（如尼日利亚从7.33亿降至5.46亿）；随着发展，非洲生育率下降快于预期，或将重演东亚故事<br>![](..\\raw\\BV1vw411w7Bp_f2.jpg)","note":"即便非洲生育率目前偏高，其下降速度也快于预期，本世纪末多数地区可能也低于更替水平。","id":"BV1vw411w7Bp","title":"Kurzgesagt科普：为什么韩国正在消亡（中英字幕）","upper":"Kurzgesagt-科普","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1vw411w7Bp_f3.jpg","t":"~5:36","desc":"说明中国劳动年龄人口到2050年预计减少20%（约2亿人，相当于美国全部劳动人口）；并以德国东部等人口萎缩城镇为例，指出基础设施崩溃是人口下降的普遍后果（设施靠规模运营，用户减少则难以为继）<br>![](..\\raw\\BV1vw411w7Bp_f3.jpg)","note":"劳动人口锐减叠加基础设施依赖规模效应，使人口下降地区面临设施难以维持的困境。","id":"BV1vw411w7Bp","title":"Kurzgesagt科普：为什么韩国正在消亡（中英字幕）","upper":"Kurzgesagt-科普","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1vw411w7Bp_f4.jpg","t":"~7:29","desc":"讨论移民这一最简单解法：但移民后代出生率会在三代内降至当地水平，需持续涌入；若靠维持他国贫困以输出青壮年移民，则在道德上站不住脚<br>![](..\\raw\\BV1vw411w7Bp_f4.jpg)","note":"移民只能短期缓解，且移民后代生育率会趋同，长期不可持续。","id":"BV1vw411w7Bp","title":"Kurzgesagt科普：为什么韩国正在消亡（中英字幕）","upper":"Kurzgesagt-科普","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1vw411w7Bp_f5.jpg","t":"~9:21","desc":"从欧洲视角看待低生育率：它反映世界变得不那么糟——女性更少但更受教育、更富裕；但存在想生数量与实际的差距（欧洲女性平均想要2.3个，实际更少），紧密社区与家庭结构的瓦解是代价<br>![](..\\raw\\BV1vw411w7Bp_f5.jpg)","note":"生育率下降一方面意味着女性更受教育独立，另一方面也伴随社群纽带弱化与想生未必能生的落差。","id":"BV1vw411w7Bp","title":"Kurzgesagt科普：为什么韩国正在消亡（中英字幕）","upper":"Kurzgesagt-科普","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1vw411w7Bp_f6.jpg","t":"~11:13","desc":"提出应对方向：提供免费充足的育儿支持、育儿补贴、更多更便宜的住房，让育儿不再成为职业障碍、社会文化对家庭更友好；并强调人类不会因少子而灭绝，但需尽早应对人口年龄结构的快速变化<br>![](..\\raw\\BV1vw411w7Bp_f6.jpg)","note":"通过降低育儿成本、改善住房与文化氛围可提升生育意愿，人口结构挑战虽严峻但并非无解。","id":"BV1vw411w7Bp","title":"Kurzgesagt科普：为什么韩国正在消亡（中英字幕）","upper":"Kurzgesagt-科普","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1Eu4y1d7Ae_f1.jpg","t":"~1:36","desc":"开场说明无论电视、平板、手机还是笔记本，屏幕几乎都是LCD或OLED，靠柔性排线与机身相连；但玻璃无法直接焊接，于是用一种只在厚度方向（z轴）导电的异向导电胶带——电流只穿过胶带厚度，不在表面（x/y轴）扩散，并预告将用显微镜观察其原理。<br>![](..\\raw\\BV1Eu4y1d7Ae_f1.jpg)","note":"屏幕靠柔性排线连接，难点在玻璃不可焊，故用仅z轴导电的异向导电胶带。","id":"BV1Eu4y1d7Ae","title":"显示屏排线连接的秘密：使用涂有金属的小塑料微球体来建立电连接","upper":"奇点迫近","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Eu4y1d7Ae_f2.jpg","t":"~3:11","desc":"展开问题细节：柔性排线用常规焊锡连到电路板，含数十条铜走线需对接玻璃上极薄的金属膜走线（最厚约几百纳米）；走线太薄且多为铝，难以直接焊接，导电银浆也因线窄、缝更小而难以施涂。<br>![](..\\raw\\BV1Eu4y1d7Ae_f2.jpg)","note":"玻璃走线仅数百纳米且多为铝，太薄太窄，无法常规焊接或点银浆。","id":"BV1Eu4y1d7Ae","title":"显示屏排线连接的秘密：使用涂有金属的小塑料微球体来建立电连接","upper":"奇点迫近","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Eu4y1d7Ae_f3.jpg","t":"~4:47","desc":"对比普通导电胶带在x/y/z三维皆导通、会把所有走线短路，引出异向导电膜（ACF）：在绝缘胶里嵌入金属涂层微球体；用演示模型（底部玻璃焊盘、上部排线焊盘、填入凝胶与滚珠）按压后，滚珠在对应焊盘间形成导电桥，缝隙中的滚珠则孤立不连。<br>![](..\\raw\\BV1Eu4y1d7Ae_f3.jpg)","note":"异向导电膜以绝缘胶中的金属微球只桥接对应焊盘，缝隙处隔离防短路。","id":"BV1Eu4y1d7Ae","title":"显示屏排线连接的秘密：使用涂有金属的小塑料微球体来建立电连接","upper":"奇点迫近","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Eu4y1d7Ae_f4.jpg","t":"~6:22","desc":"展示真实OLED的扫描电镜（SEM）截面：柔性排线在上、玻璃在下，侧边散布空心球，铜焊盘下被压扁的球体才是真正导通处；元素探测发现铜垫镀有镍磷（防腐蚀）、玻璃走线为铝、微球为镍，且ACF微球被设计压扁以增大接触、更可靠。<br>![](..\\raw\\BV1Eu4y1d7Ae_f4.jpg)","note":"真实器件靠压扁的镍微球导通，铜垫镀镍磷、玻璃走线为铝。","id":"BV1Eu4y1d7Ae","title":"显示屏排线连接的秘密：使用涂有金属的小塑料微球体来建立电连接","upper":"奇点迫近","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Eu4y1d7Ae_f5.jpg","t":"~7:58","desc":"进一步切穿硅芯片做截面，公差更严：硅在上、玻璃在下，焊盘与缝隙更小，每处连接仅有少数微球桥接、其余圆形微球保持孤立；ACF还能确保所有焊盘都被压接连通，并兼作把芯片粘到玻璃的粘接层。<br>![](..\\raw\\BV1Eu4y1d7Ae_f5.jpg)","note":"硅芯片连接公差更严，每点仅少数微球桥接，ACF兼作粘接层。","id":"BV1Eu4y1d7Ae","title":"显示屏排线连接的秘密：使用涂有金属的小塑料微球体来建立电连接","upper":"奇点迫近","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Eu4y1d7Ae_f6.jpg","t":"~9:33","desc":"视频尾声转到幕后分享：作者称运营YouTube频道如同经营一家小生意，需身兼拍摄、剪辑、灯光、CGI、平面设计乃至财务等多职，并借此推荐Skillshare平台，用以快速学习这些技能。<br>![](..\\raw\\BV1Eu4y1d7Ae_f6.jpg)","note":"结尾聊频道运营如小生意、身兼多职，并推广Skillshare学习技能。","id":"BV1Eu4y1d7Ae","title":"显示屏排线连接的秘密：使用涂有金属的小塑料微球体来建立电连接","upper":"奇点迫近","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1ch411P7HV_f1.jpg","t":"~4:31","desc":"画面回到2011年第五届 PF（PF5）：少女前线美术总监令佳受邀组队，成立“十三实验军团”——一支全员白毛红瞳的注魔改造人军团，其角色福克西莱特成为日后 AR-15 的人物原型；PF5 红蓝大战以双方近乎全灭告终，由此开启角色转生传统。<br>![](..\\raw\\BV1ch411P7HV_f1.jpg)","note":"PF5 催生十三实验军团与福克西莱特，并确立了角色可转生、故事可继承的规则。","id":"BV1ch411P7HV","title":"为你讲述近一部近十五年的绘画传奇——PIXIV FANTASY","upper":"西普西欧","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1ch411P7HV_f2.jpg","t":"~9:02","desc":"展示 PF 角色转生机制带来的衍生创作生态：2016年国人曲师卢娜为十三实验军团创作专辑《福克西莱特》，2019年十周年 PFLS 主题曲，以及立夏据活动资料润色的小说《苍崎他的死》，画师圈吸引了曲师与小说家共同参与。<br>![](..\\raw\\BV1ch411P7HV_f2.jpg)","note":"PF 不只聚画师，还吸引曲师、小说家围绕同一世界观共创，形成跨媒介创作。","id":"BV1ch411P7HV","title":"为你讲述近一部近十五年的绘画传奇——PIXIV FANTASY","upper":"西普西欧","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1ch411P7HV_f3.jpg","t":"~13:33","desc":"讲述福克西莱特在设定中跨越数百年（1374→2050年），从为战争制造的注魔改造人成长为亭亭玉立的少女；注魔改造人本应短命，她却活了数百年，并引出画师 SWD三一二（随文帝）早在2008年便开始画画。<br>![](..\\raw\\BV1ch411P7HV_f3.jpg)","note":"福克西莱特的长寿传奇象征 PF 角色超越单届企划的生命力，也带出新一代画师。","id":"BV1ch411P7HV","title":"为你讲述近一部近十五年的绘画传奇——PIXIV FANTASY","upper":"西普西欧","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1ch411P7HV_f4.jpg","t":"~18:03","desc":"聚焦2014年最黑暗也最巅峰的“四王”篇（PFK）：主办者改规则使败方在阶段结算后失去将领，剧情转向复仇；SWD三一二携角色“天国”在迷雾酒馆寻找已改名的福克西莱特，最终福克西莱特牺牲、空中战舰科隆号陨落。<br>![](..\\raw\\BV1ch411P7HV_f4.jpg)","note":"PFK 以“败方失将”的残酷规则把对决推向复仇高潮，福克西莱特迎来传奇终点。","id":"BV1ch411P7HV","title":"为你讲述近一部近十五年的绘画传奇——PIXIV FANTASY","upper":"西普西欧","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1ch411P7HV_f5.jpg","t":"~22:34","desc":"转入2015年新团体“求知者旅团”，海猫在“战地救助团”的角色正是明日方舟的凯尔希（M5为抄袭风波始作俑者），千叶在旅团暗部；旅团探索新世界，千年后解散转为“掌书人”，并寻回坠毁的科隆号、获得开启新宇宙的“世界链”。<br>![](..\\raw\\BV1ch411P7HV_f5.jpg)","note":"求知者旅团与战地救助团的设定，正是后来《明日方舟》凯尔希等角色与世界观的源头。","id":"BV1ch411P7HV","title":"为你讲述近一部近十五年的绘画传奇——PIXIV FANTASY","upper":"西普西欧","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1ch411P7HV_f6.jpg","t":"~27:05","desc":"总结 PF 精神的外溢：海猫受旅团启发创立《明日方舟》（企鹅物流等七组织）；画师瑞与 A社长以 PF 为蓝本打造《十之歌》Project，完成歌/绘/小说/漫画/动画，却临门一脚倒在资本架空主创上；友人又发起《假旗》等新企划。<br>![](..\\raw\\BV1ch411P7HV_f6.jpg)","note":"PF 的竞争共创模式深刻影响了《明日方舟》等后世作品，其 replicated 精神延续至今。","id":"BV1ch411P7HV","title":"为你讲述近一部近十五年的绘画传奇——PIXIV FANTASY","upper":"西普西欧","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1BC4y1s72r_f1.jpg","t":"~0:47","desc":"开场抛出CCD、CMOS、Line MOS三大名词，逐一解释全称——CCD为电耦合器件、CMOS为互补金属氧化物半导体，并点明二者本质都用光电二极管感光，Line MOS则是P型光电二极管架构。<br>![](..\\raw\\BV1BC4y1s72r_f1.jpg)","note":"视频以三种图像传感器的概念辨析开篇，强调它们底层都依赖光电二极管感光。","id":"BV1BC4y1s72r","title":"【CCD】CCD和CMOS差异何在？LiveMos是个啥？","upper":"PoorPlayers穷玩组","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1BC4y1s72r_f2.jpg","t":"~1:34","desc":"对比CCD与CMOS的工作方式：CCD像素无独立读出端，需像接力一样把整列电荷逐像素转移到边缘读出端；CMOS每个像素自带电荷转换器，独立完成光电转换。<br>![](..\\raw\\BV1BC4y1s72r_f2.jpg)","note":"CCD靠整列电荷接力读出，CMOS每像素各自完成光电转换。","id":"BV1BC4y1s72r","title":"【CCD】CCD和CMOS差异何在？LiveMos是个啥？","upper":"PoorPlayers穷玩组","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1BC4y1s72r_f3.jpg","t":"~2:21","desc":"说明二者差异主要在周边电路：CCD把一列像素统一传递到读出端，输出均匀性远优于CMOS，读出噪声也更低；而CMOS胜在集成度高，可把放大器、数字电路等直接做进传感器。<br>![](..\\raw\\BV1BC4y1s72r_f3.jpg)","note":"CCD输出均匀性与低读出噪声占优，CMOS则以高度集成为长。","id":"BV1BC4y1s72r","title":"【CCD】CCD和CMOS差异何在？LiveMos是个啥？","upper":"PoorPlayers穷玩组","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1BC4y1s72r_f4.jpg","t":"~3:08","desc":"指出早期CMOS因周边电路挤占面积导致光电二极管开口率低、信噪比差；CCD更容易实现全局快门，而CMOS视频普遍采用逐行感光的卷帘快门，容易产生果冻效应。<br>![](..\\raw\\BV1BC4y1s72r_f4.jpg)","note":"早期CMOS开口率低且易现果冻效应，CCD天然利于全局快门。","id":"BV1BC4y1s72r","title":"【CCD】CCD和CMOS差异何在？LiveMos是个啥？","upper":"PoorPlayers穷玩组","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1BC4y1s72r_f5.jpg","t":"~3:55","desc":"转折揭示CCD致命短板：功耗大、成本高、良品率低——整列统一放大带来高驱动电压与高功耗，且一个像素损坏会导致整列失效，因此逐步退出民用相机市场。<br>![](..\\raw\\BV1BC4y1s72r_f5.jpg)","note":"CCD因功耗、成本与良品率劣势被民用市场淘汰。","id":"BV1BC4y1s72r","title":"【CCD】CCD和CMOS差异何在？LiveMos是个啥？","upper":"PoorPlayers穷玩组","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1BC4y1s72r_f6.jpg","t":"~4:42","desc":"收尾补充CCD在实时取景拍亮物时会出现垂直条纹；背照式CMOS、内置ADC、PIN/PPD像素结构等新技术让优势反转。最后交代Line MOS是松下/奥林巴斯的传感器架构，其总结者Eric Fossum正是CMOS图像传感器发明人。<br>![](..\\raw\\BV1BC4y1s72r_f6.jpg)","note":"背照式等新工艺逆转格局，Line MOS源于松下/奥林巴斯，由CMOS发明人Fossum总结。","id":"BV1BC4y1s72r","title":"【CCD】CCD和CMOS差异何在？LiveMos是个啥？","upper":"PoorPlayers穷玩组","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1CW4y1S7G2_f1.jpg","t":"~1:02","desc":"开场点出大家都在聊大模型、却听不懂prompt/token/embedding等英文黑话的痛点，把大模型比作一个对语言有出色理解力的人，强调使用大模型的过程本质上就是向它提问的过程。<br>![](..\\raw\\BV1CW4y1S7G2_f1.jpg)","note":"视频以大模型黑话令人头大切入，提出用好大模型就是学会提问。","id":"BV1CW4y1S7G2","title":"揭秘AI大模型行业黑话，窥探ChatGPT/星火/文心不在话下，迅速搞懂提示工程(prompt)、向量工程(embedding)、模型微调finetune)","upper":"聆思AI芯片","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1CW4y1S7G2_f2.jpg","t":"~2:03","desc":"详解prompt：它是输入给大模型的文本，用来提示、引导模型给出符合预期的输出，是人与模型交互的媒介；类比产品经理写给研发工程师的需求文档，需在需求里包含背景、需求、版本、方案等。<br>![](..\\raw\\BV1CW4y1S7G2_f2.jpg)","note":"prompt即提示词，相当于给大模型提需求的需求文档。","id":"BV1CW4y1S7G2","title":"揭秘AI大模型行业黑话，窥探ChatGPT/星火/文心不在话下，迅速搞懂提示工程(prompt)、向量工程(embedding)、模型微调finetune)","upper":"聆思AI芯片","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1CW4y1S7G2_f3.jpg","t":"~3:05","desc":"解释token：常出现在GPT说明里，是大模型处理的最小单元（如英文单词或汉字）；用言简意赅与啰嗦两种表达对比，说明表达越啰嗦，描述同一件事消耗的token越多。<br>![](..\\raw\\BV1CW4y1S7G2_f3.jpg)","note":"token是模型处理的最小单元，文本越长消耗token越多。","id":"BV1CW4y1S7G2","title":"揭秘AI大模型行业黑话，窥探ChatGPT/星火/文心不在话下，迅速搞懂提示工程(prompt)、向量工程(embedding)、模型微调finetune)","upper":"聆思AI芯片","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1CW4y1S7G2_f4.jpg","t":"~4:06","desc":"讲解embedding：把段落文本编码成固定维度的向量，便于做语义相似度比较，相当于把知识数据向量化成一个可检索的数据库；类比项目经理把完成需求所需的参考资料先整理进附件交给工程师。<br>![](..\\raw\\BV1CW4y1S7G2_f4.jpg)","note":"embedding把文本向量化，便于按语义检索相关材料。","id":"BV1CW4y1S7G2","title":"揭秘AI大模型行业黑话，窥探ChatGPT/星火/文心不在话下，迅速搞懂提示工程(prompt)、向量工程(embedding)、模型微调finetune)","upper":"聆思AI芯片","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1CW4y1S7G2_f5.jpg","t":"~5:08","desc":"讲解Fine-tuning（微调）：在已训练好的模型基础上，用高质量数据进一步调整模型参数，使其更匹配特定任务；类比为入职导师对研发人员做代码规范等培训，把规则直接记在脑子里。<br>![](..\\raw\\BV1CW4y1S7G2_f5.jpg)","note":"Fine-tuning是用高质量数据微调模型参数以贴合特定任务。","id":"BV1CW4y1S7G2","title":"揭秘AI大模型行业黑话，窥探ChatGPT/星火/文心不在话下，迅速搞懂提示工程(prompt)、向量工程(embedding)、模型微调finetune)","upper":"聆思AI芯片","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1CW4y1S7G2_f6.jpg","t":"~6:09","desc":"用一个设备说明书问答应用串起全部概念：先用Embedding把说明书向量化并检索相关内容，再拼成prompt提交大模型，最后用Fine-tuning让回答贴合排查格式，并说明微调还能减少token消耗、降本提速；结尾引导扫码领高清脑图、求三连。<br>![](..\\raw\\BV1CW4y1S7G2_f6.jpg)","note":"以说明书问答应用串联各技术，并指出微调可省token、降本提速。","id":"BV1CW4y1S7G2","title":"揭秘AI大模型行业黑话，窥探ChatGPT/星火/文心不在话下，迅速搞懂提示工程(prompt)、向量工程(embedding)、模型微调finetune)","upper":"聆思AI芯片","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Ek4y1u7GD_f1.jpg","t":"~0:21","desc":"开场指出考古学家向下挖掘时常发现古代地面比今天低很多，引出问题：古代文明之上究竟堆积了什么？并说明古人同今人一样，每一个行为、每一件购置的物品都会留下痕迹。<br>![](..\\raw\\BV1Ek4y1u7GD_f1.jpg)","note":"考古向下挖掘可见古代地面更低，一切人类活动都会留下层积痕迹。","id":"BV1Ek4y1u7GD","title":"Rome wasn't built in a day","upper":"艺术与设计史","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Ek4y1u7GD_f2.jpg","t":"~0:42","desc":"解释罗马人高效务实的重建方式：火灾后把建筑推平，把首层改为地下室，或将瓦砾铺平作为后续建筑的地基，而非像今人经历卡特里娜飓风后那样把废墟清运走。<br>![](..\\raw\\BV1Ek4y1u7GD_f2.jpg)","note":"罗马人灾后不清理废墟，而是就地推平、以瓦砾作新地基抬高城市。","id":"BV1Ek4y1u7GD","title":"Rome wasn't built in a day","upper":"艺术与设计史","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Ek4y1u7GD_f3.jpg","t":"~1:03","desc":"站在罗马广场向下走入、抬头看见周边街道，说明当前正处于古代地面层，其下还叠压着多层古罗马堆积，再向下约20英尺才到王政时期（archaic）地层；强调每座纪念碑都有其前身。<br>![](..\\raw\\BV1Ek4y1u7GD_f3.jpg)","note":"罗马广场位于古地面层，其下叠压多层更早的地层。","id":"BV1Ek4y1u7GD","title":"Rome wasn't built in a day","upper":"艺术与设计史","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Ek4y1u7GD_f4.jpg","t":"~1:25","desc":"以尤利娅巴西利卡（Basilica Julia）为例说明建筑层层因袭：公元23年火灾后所建者，取代了恺撒始建、奥古斯都完工却被焚毁的前身，其下又是公元前2世纪的巴西利卡，再往前则是共和早期民居。<br>![](..\\raw\\BV1Ek4y1u7GD_f4.jpg)","note":"尤利娅巴西利卡本身叠压着更早的巴西利卡与共和时期民居。","id":"BV1Ek4y1u7GD","title":"Rome wasn't built in a day","upper":"艺术与设计史","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Ek4y1u7GD_f5.jpg","t":"~1:46","desc":"讨论考古学家如何决定停止挖掘——看似可以无限向更早历史追溯，实际靠寻找下探契机（如地面被切开之处）才能进入更早层位，并多满足于现状层。<br>![](..\\raw\\BV1Ek4y1u7GD_f5.jpg)","note":"考古靠地面切口等契机向更早层位下探，并据此决定止步处。","id":"BV1Ek4y1u7GD","title":"Rome wasn't built in a day","upper":"艺术与设计史","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Ek4y1u7GD_f6.jpg","t":"~2:07","desc":"收尾说明今日罗马广场所见主要为奥古斯都至公元2世纪的地层，但区域内仍有许多可下探更早层位之处，关键在于找到不破坏现有遗存的下挖点；以对话致谢结束。<br>![](..\\raw\\BV1Ek4y1u7GD_f6.jpg)","note":"今日广场多为奥古斯都至2世纪地层，下探契机在于不损现存遗存的选址。","id":"BV1Ek4y1u7GD","title":"Rome wasn't built in a day","upper":"艺术与设计史","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1XP411i7gS_f1.jpg","t":"~2:28","desc":"画面展示早期碳丝白炽灯泡，讲解爱迪生的观察：受热灯丝不仅发光发热，还会“煮”出电子（热电子发射），电子被正极导线吸引、只把玻璃一侧熏黄，由此证明当时用的是直流电。<br>![](..\\raw\\BV1XP411i7gS_f1.jpg)","note":"爱迪生效应：热灯丝发射电子，揭示了真空管能够控制电子流动的物理基础。","id":"BV1XP411i7gS","title":"人们最早的电脑是由灯泡制成的","upper":"Veritasium真理元素","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1XP411i7gS_f2.jpg","t":"~4:55","desc":"转入“放大”这一早期电子学难题：无线电与电话因信号太弱受距离限制；1906年德福雷斯特在三极管中加入稀疏的金属网栅极，置于灯丝（阴极）与板极之间来控制电子流。<br>![](..\\raw\\BV1XP411i7gS_f2.jpg)","note":"三极管的关键突破是栅极——用很小电压即可控制大电流，实现信号放大。","id":"BV1XP411i7gS","title":"人们最早的电脑是由灯泡制成的","upper":"Veritasium真理元素","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1XP411i7gS_f3.jpg","t":"~7:23","desc":"实操演示三极管放大：栅极小幅度2伏变化换来输出5/10/15伏的变化；画面提到借助真空管，1915年1月25日首次实现纽约到旧金山的跨大陆通话。<br>![](..\\raw\\BV1XP411i7gS_f3.jpg)","note":"三极管让远程放大成为可能，直接促成了首次跨大陆电话等里程碑。","id":"BV1XP411i7gS","title":"人们最早的电脑是由灯泡制成的","upper":"Veritasium真理元素","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1XP411i7gS_f4.jpg","t":"~9:50","desc":"展示斯提比茨1937年在厨房餐桌上用电池、灯泡和继电器搭出的“Model K”一位加法器，说明它通过异或门（XOR）和与门（AND）把布尔运算变成了会发光的电路。<br>![](..\\raw\\BV1XP411i7gS_f4.jpg)","note":"香农的视角下，半加器本质是一对逻辑门，电子开始“替你做数学”。","id":"BV1XP411i7gS","title":"人们最早的电脑是由灯泡制成的","upper":"Veritasium真理元素","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1XP411i7gS_f5.jpg","t":"~12:18","desc":"介绍贝尔实验室两年后的“Model One”：用400多个继电器，能在十分之一秒里相加两个八位数，也可做八位数乘法；多个半加器串接即可完成更复杂的运算。<br>![](..\\raw\\BV1XP411i7gS_f5.jpg)","note":"继电器计算机通过堆叠半加器实现复杂运算，但机械开关注定不是未来。","id":"BV1XP411i7gS","title":"人们最早的电脑是由灯泡制成的","upper":"Veritasium真理元素","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1XP411i7gS_f6.jpg","t":"~14:45","desc":"指出继电器的机械开合太慢、易磨损且噪音巨大，不适合办公环境；于是需要“电子开关”——真空管三极管仅靠电压、无需运动部件即可控制电流通断。<br>![](..\\raw\\BV1XP411i7gS_f6.jpg)","note":"电子开关的需求把计算机引向真空管三极管，为全电子计算机铺路。","id":"BV1XP411i7gS","title":"人们最早的电脑是由灯泡制成的","upper":"Veritasium真理元素","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1vc41137Tg_f1.jpg","t":"~1:44","desc":"讲解电磁波的起源：加速运动的带电粒子会在电磁场中以光速产生并向外传播的电磁波，并按振荡频率分为可见光、红外、紫外、微波、X射线、无线电波、伽马射线等<br>![](..\\raw\\BV1vc41137Tg_f1.jpg)","note":"电磁波源于加速运动的电荷，按频率可划分为从无线电到伽马射线的不同波段。","id":"BV1vc41137Tg","title":"【中字】电磁波的起源以及它们为什么会表现出这样的行为【ScienceClic】","upper":"SciHolic","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1vc41137Tg_f2.jpg","t":"~3:27","desc":"解释温度对应原子热运动，原子振动其电子云（如橡皮筋连接）不断加速变向而辐射电磁波，温度越高辐射能量越强；并以人体（约37℃）持续发出红外辐射为例<br>![](..\\raw\\BV1vc41137Tg_f2.jpg)","note":"物体的温度是原子热运动的体现，受热物体会辐射电磁波（如人体发出红外）。","id":"BV1vc41137Tg","title":"【中字】电磁波的起源以及它们为什么会表现出这样的行为【ScienceClic】","upper":"SciHolic","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1vc41137Tg_f3.jpg","t":"~5:11","desc":"讲解可受控地让原子振动：电子云相对原子核的振动方式有三种（借用桌上弹珠被橡皮筋拴住的类比，轨迹呈椭圆、直线或圆），对应原子内电子云受核吸引的三种振动模式<br>![](..\\raw\\BV1vc41137Tg_f3.jpg)","note":"原子内电子云相对原子核的受控振动有特定模式，是物质与电磁波相互作用的基础。","id":"BV1vc41137Tg","title":"【中字】电磁波的起源以及它们为什么会表现出这样的行为【ScienceClic】","upper":"SciHolic","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1vc41137Tg_f4.jpg","t":"~6:55","desc":"介绍偏振现象与偏振片（只让某一偏振方向通过），用于3D电影等技术；并说明电磁波作为波遵循叠加原理：波峰叠加变高、反相波相互抵消（干涉）<br>![](..\\raw\\BV1vc41137Tg_f4.jpg)","note":"偏振片筛选特定偏振方向（用于3D影院），而波的叠加原理导致相长与相消干涉。","id":"BV1vc41137Tg","title":"【中字】电磁波的起源以及它们为什么会表现出这样的行为【ScienceClic】","upper":"SciHolic","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1vc41137Tg_f5.jpg","t":"~8:39","desc":"解释天空为何是蓝色：太阳发出的白光（含各色光）经过空气时使原子振动并散射，蓝光能量更高、使电子振动最剧烈而散射最强；并引出电磁波与物质（如水）相互作用时部分被反射或透射<br>![](..\\raw\\BV1vc41137Tg_f5.jpg)","note":"蓝光因能量较高被空气强烈散射，使天空呈现蓝色；电磁波与物质作用会发生反射与透射。","id":"BV1vc41137Tg","title":"【中字】电磁波的起源以及它们为什么会表现出这样的行为【ScienceClic】","upper":"SciHolic","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1vc41137Tg_f6.jpg","t":"~10:22","desc":"讲解反射：镜中看到的是金属中电流产生的反射波；入射波与反射波相干抵消；并介绍折射——透入水面下的波传播方向改变且变慢的现象，同样源于波的叠加<br>![](..\\raw\\BV1vc41137Tg_f6.jpg)","note":"反射与折射都是电磁波与物质作用的体现，分别表现为方向反射和进入介质后偏折、减速。","id":"BV1vc41137Tg","title":"【中字】电磁波的起源以及它们为什么会表现出这样的行为【ScienceClic】","upper":"SciHolic","coll":"kepu","type":"text"}]};window.__COLS__=[{"k":"opinion","n":"有意思的想法et观点","color":"#6366f1","cnt":176},{"k":"kepu","n":"好的科普","color":"#10b981","cnt":58},{"k":"archive","n":"主动归档","color":"#f59e0b","cnt":3},{"k":"zhichang","n":"职场成长 UP 主","color":"#0ea5e9","cnt":0},{"k":"fazheng","n":"法政讲坛","color":"#8b5cf6","cnt":0}];</script>
<script>
/* ===== 工具 ===== */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function debounce(fn,ms){var t;return function(){var a=arguments,c=this;clearTimeout(t);t=setTimeout(function(){fn.apply(c,a)},ms||160)}}
function kv(obj){return Object.keys(obj).map(function(k){return k+'='+encodeURIComponent(obj[k])}).join('&')}
function parseHash(){var h=location.hash.replace(/^#/,'');var o={};if(!h)return o;
  h.split('&').forEach(function(p){var i=p.indexOf('=');if(i<0)return;
    try{o[p.slice(0,i)]=decodeURIComponent(p.slice(i+1))}catch(e){o[p.slice(0,i)]=p.slice(i+1)}});return o}

/* ===== 极简 Markdown 渲染器（无依赖，够用于本库文稿） ===== */
var MD_STASH=[];
function mdInline(t){
  t=esc(t);
  /* 图片 */
  t=t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,function(m,a,p){
    return '\u0001I'+ (MD_STASH.push('<img class="mdimg" loading="lazy" src="'+p+'" alt="'+a+'">')-1) +'\u0001';});
  /* 链接（先抽出，避免正文裸链重复包裹） */
  t=t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(m,a,h){
    return '\u0001L'+(MD_STASH.push('<a href="'+h+'" target="_blank" rel="noopener">'+a+'</a>')-1)+'\u0001';});
  /* 裸链接 */
  t=t.replace(/(https?:\/\/[^\s<)）】]+)/g,function(u){
    return '\u0001U'+(MD_STASH.push('<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>')-1)+'\u0001';});
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t=t.replace(/&lt;br\s*\/?&gt;/gi,'<br>');
  t=t.replace(/&lt;(\/?(?:em|strong|code|sub|sup|b|i|br))\s*\/?&gt;/gi,'<$1>');
  t=t.replace(/\u0001([ILU])(\d+)\u0001/g,function(m,k,i){return MD_STASH[+i]});
  return t;
}
function isBlockStart(l){
  return /^\s*$/.test(l)||/^#{1,6}\s/.test(l)||/^\s*>\s?/.test(l)||/^\s*[-*+]\s+/.test(l)
    ||/^\s*\d+[.)]\s+/.test(l)||/^\s*\|/.test(l)||/^\s*([-*_])\s*\1\s*\1/.test(l);
}
function md2html(md){
  MD_STASH=[];
  var L=String(md||'').split(/\r?\n/),out=[],i=0,m;
  while(i<L.length){
    var l=L[i];
    if(/^\s*$/.test(l)){i++;continue}
    /* 表格：表头 + 分隔行 */
    if(/^\s*\|/.test(l)&&i+1<L.length&&/^\s*\|?[\s:|-]*-[\s:|-]*\|/.test(L[i+1])){
      var cells=function(s){return s.trim().replace(/^\||\|$/g,'').split('|').map(function(x){return mdInline(x.trim())})};
      var head=cells(l); i+=2; var rows=[];
      while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(cells(L[i]));i++}
      out.push('<div class="tblwrap"><table><thead><tr>'+head.map(function(c){return '<th>'+c+'</th>'}).join('')
        +'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')
        +'</tbody></table></div>');
      continue;
    }
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){var lv=m[1].length;out.push('<h'+lv+'>'+mdInline(m[2])+'</h'+lv+'>');i++;continue}
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)){out.push('<hr>');i++;continue}
    if(/^\s*>\s?/.test(l)){var q=[];while(i<L.length&&/^\s*>\s?/.test(L[i])){q.push(L[i].replace(/^\s*>\s?/,''));i++}
      out.push('<blockquote>'+q.map(mdInline).join('<br>')+'</blockquote>');continue}
    if(/^\s*[-*+]\s+/.test(l)){var ul=[];while(i<L.length&&/^\s*[-*+]\s+/.test(L[i])){ul.push(L[i].replace(/^\s*[-*+]\s+/,''));i++}
      out.push('<ul>'+ul.map(function(x){return '<li>'+mdInline(x)+'</li>'}).join('')+'</ul>');continue}
    if(/^\s*\d+[.)]\s+/.test(l)){var ol=[];while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i])){ol.push(L[i].replace(/^\s*\d+[.)]\s+/,''));i++}
      out.push('<ol>'+ol.map(function(x){return '<li>'+mdInline(x)+'</li>'}).join('')+'</ol>');continue}
    var para=[];while(i<L.length&&!isBlockStart(L[i])){para.push(L[i]);i++}
    if(para.length)out.push('<p>'+para.map(mdInline).join('<br>')+'</p>'); else i++;
  }
  return out.join('\n');
}

var __toastT=null;
function toast(html,ms){
  var el=$('#toast');
  if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}
  el.innerHTML=html; el.classList.add('on');
  clearTimeout(__toastT); __toastT=setTimeout(function(){el.classList.remove('on')},ms||6200);
}

/* ===== 灯箱（含 ←/→ 翻页、Esc 关闭） ===== */
var LB={items:[],idx:0};
function lbInit(){
  if($('#lb'))return;
  var d=document.createElement('div');d.id='lb';d.className='lb';
  d.innerHTML='<div class="lbtop"><span id="lbTitle"></span><span class="spacer"></span>'
    +'<button class="nav" id="lbPrev">← 上一张</button><button class="nav" id="lbNext">下一张 →</button>'
    +'<span id="lbIdx" class="mono" style="opacity:.7"></span><button class="x" id="lbX">关闭 Esc</button></div>'
    +'<img id="lbImg" alt=""><div class="cap" id="lbCap"></div>';
  document.body.appendChild(d);
  $('#lbX').onclick=lbClose;
  $('#lbPrev').onclick=function(){lbGo(LB.idx-1)};
  $('#lbNext').onclick=function(){lbGo(LB.idx+1)};
  d.addEventListener('click',function(e){if(e.target===d)lbClose()});
  document.addEventListener('keydown',function(e){
    if(!$('#lb').classList.contains('on'))return;
    if(e.key==='Escape')lbClose(); else if(e.key==='ArrowLeft')lbGo(LB.idx-1); else if(e.key==='ArrowRight')lbGo(LB.idx+1);
  });
}
function lbOpen(items,idx,title){LB.items=items;lbInit();lbGo(idx,title)}
function lbGo(i,title){
  if(!LB.items.length)return;
  i=(i+LB.items.length)%LB.items.length;LB.idx=i;
  var it=LB.items[i];
  $('#lbImg').src=it.img; $('#lbTitle').textContent=title||it.title||'';
  $('#lbCap').innerHTML=(it.cap||''); $('#lbIdx').textContent=(i+1)+' / '+LB.items.length;
  $('#lbPrev').disabled=false; $('#lbNext').disabled=LB.items.length<2;
  $('#lb').classList.add('on');
}
function lbClose(){var d=$('#lb');if(d){d.classList.remove('on');$('#lbImg').src=''}}
function bindZoom(root,getItems,getTitle){
  (root||document).addEventListener('click',function(e){
    var im=e.target.closest('.mdimg, img[data-zoom]'); if(!im)return;
    var items=getItems(im); if(!items||!items.length)return;
    var idx=0; for(var i=0;i<items.length;i++){if(items[i].img===im.getAttribute('src')){idx=i;break}}
    lbOpen(items,idx,typeof getTitle==='function'?getTitle(im):'');
  },false);
}

var G=window.__GAL__||{items:[],stats:{}};
var TYPE_CN={text:'文本型',hybrid:'混合型',visual:'画面型'};
var FILT=[],SHOWN=0,BATCH=240,FC='all',FT='all',FV='all',FQ='';
function tagType(t){return '<span class="tag t-'+t+'">'+(TYPE_CN[t]||t)+'</span>'}
function apply(){
  var q=FQ.trim().toLowerCase();
  FILT=G.items.filter(function(x){
    if(FC!=='all'&&x.coll!==FC)return false;
    if(FT!=='all'&&x.type!==FT)return false;
    if(FV!=='all'&&x.id!==FV)return false;
    if(!q)return true;
    return (x.title+' '+x.upper+' '+(x.desc||'')+' '+(x.note||'')+' '+x.t).toLowerCase().indexOf(q)>=0;
  });
  SHOWN=0; $('#mason').innerHTML=''; $('#cnt').textContent=FILT.length+' / '+G.items.length+' 张';
  $('#empty').style.display=FILT.length?'none':'block';
  more();
}
function card(x,i){
  return '<figure class="kf" data-i="'+i+'">'
    +'<img loading="lazy" src="'+x.img+'" alt="" decoding="async">'
    +'<div class="ov">'+(x.t?'<span class="mono">'+esc(x.t)+'</span>':'')+'<span class="b">'+esc(x.coll==='kepu'?'科普':'观点')+'</span></div>'
    +'<figcaption class="c"><div class="d">'+esc(x.desc||'（无图说）')+'</div>'
    +'<div class="n">'+esc(x.title)+'</div></figcaption></figure>';
}
function more(){
  var box=$('#mason');
  if(SHOWN>=FILT.length){$('#sent').textContent=FILT.length?('已到底部 · 共 '+FILT.length+' 张'):'';return}
  var end=Math.min(SHOWN+BATCH,FILT.length),html='';
  for(var i=SHOWN;i<end;i++)html+=card(FILT[i],i);
  box.insertAdjacentHTML('beforeend',html);
  SHOWN=end;
  $('#sent').textContent=SHOWN<FILT.length?('继续下滑加载剩余 '+(FILT.length-SHOWN)+' 张…'):('已到底部 · 共 '+FILT.length+' 张');
}
function boot(){
  var cols=Object.keys(G.stats.cols||{});
  $('#fColl').innerHTML='<span class="chip on" data-c="all">全部库</span>'
    +(window.__COLS__||[]).map(function(c){return '<span class="chip" data-c="'+c.k+'">'+esc(c.n)+'</span>'}).join('');
  $('#fType').innerHTML='<span class="chip on" data-t="all">全部</span>'+['text','hybrid','visual'].map(function(t){
    return '<span class="chip" data-t="'+t+'">'+TYPE_CN[t]+'</span>'}).join('');
  var vids={},order=[];
  G.items.forEach(function(x){if(!vids[x.id]){vids[x.id]={t:x.title,u:x.upper,n:0};order.push(x.id)}vids[x.id].n++});
  $('#fVid').innerHTML='<option value="all">全部视频（'+order.length+'）</option>'
    +order.map(function(k){return '<option value="'+k+'">'+esc(vids[k].t)+'（'+vids[k].n+'）</option>'}).join('');
  $('#fColl').onclick=function(e){var c=e.target.closest('.chip');if(!c)return;FC=c.dataset.c;
    $$('#fColl .chip').forEach(function(x){x.classList.toggle('on',x===c)});apply()};
  $('#fType').onclick=function(e){var c=e.target.closest('.chip');if(!c)return;FT=c.dataset.t;
    $$('#fType .chip').forEach(function(x){x.classList.toggle('on',x===c)});apply()};
  $('#fVid').onchange=function(){FV=this.value;apply()};
  var q=$('#q');
  q.addEventListener('input',debounce(function(){FQ=q.value;apply()},170));
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==q&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();q.focus();q.select()}});
  var sc=$('#scroll');
  sc.addEventListener('scroll',debounce(function(){
    if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-900)more()},120));
  $('#mason').addEventListener('click',function(e){
    var f=e.target.closest('.kf'); if(!f)return;
    var i=+f.dataset.i, x=FILT[i]; if(!x)return;
    lbOpen(FILT.map(function(y){return {img:y.img,cap:'<b>'+esc(y.t||'')+'</b> '+esc(y.desc||'')
      +(y.note?'<br><span style="opacity:.82">'+esc(y.note)+'</span>':'')
      +'<br><span style="opacity:.7">'+esc(y.title)+' · '+esc(y.upper)+'</span>'}}),i,x.title+' · '+(x.t||''));
  });
  apply();
}
window.addEventListener('DOMContentLoaded',boot);
</script>
