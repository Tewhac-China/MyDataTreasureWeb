<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>关键帧画廊 · 数据宝库</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#f8fafc; --panel3:#eef1f8;
  --ink:#131a2b; --ink2:#4b5567; --ink3:#8a93a6;
  --line:rgba(19,26,43,.10); --line2:rgba(19,26,43,.06);
  --accent:#4f46e5; --accent2:#6366f1; --accent-soft:rgba(99,102,241,.10);
  --opinion:#6366f1; --kepu:#10b981;
  --c-text:#f59e0b; --c-hybrid:#0ea5e9; --c-visual:#ec4899;
  --r:16px; --r-sm:10px;
  --sh1:0 1px 2px rgba(19,26,43,.06),0 1px 3px rgba(19,26,43,.04);
  --sh2:0 6px 24px -10px rgba(19,26,43,.20),0 2px 6px rgba(19,26,43,.05);
  --sh3:0 30px 70px -26px rgba(19,26,43,.42);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); color:var(--ink); background:var(--bg);
  background-image:
    radial-gradient(at 12% 4%,rgba(99,102,241,.10) 0,transparent 46%),
    radial-gradient(at 88% 0%,rgba(16,185,129,.08) 0,transparent 42%),
    radial-gradient(at 60% 100%,rgba(236,72,153,.06) 0,transparent 46%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.65;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit; color:inherit}
::selection{background:rgba(99,102,241,.22)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:rgba(19,26,43,.18);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(19,26,43,.32);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:60; display:flex; flex-wrap:nowrap; align-items:center; gap:14px;
  padding:10px 20px; background:rgba(255,255,255,.86); backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line); box-shadow:0 1px 0 rgba(255,255,255,.6) inset;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:.2px;white-space:nowrap}
.brand .gem{
  width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:14px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#ec4899); box-shadow:0 4px 12px -4px rgba(99,102,241,.7)
}
.brand small{font-weight:500;color:var(--ink3);font-size:12px;letter-spacing:.4px}
.tnav{display:flex;gap:2px;margin-left:6px;flex-wrap:nowrap;overflow:hidden}
.tnav a{padding:6px 11px;border-radius:9px;color:var(--ink2);font-size:13.5px;white-space:nowrap}
.tnav a:hover{background:var(--accent-soft);color:var(--accent);text-decoration:none}
.tnav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.spacer{flex:1 1 auto;min-width:6px}

/* ---------- 通用控件 ---------- */
.field{
  display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:6px 11px;box-shadow:var(--sh1);min-width:220px
}
.field input{border:0;outline:0;background:transparent;flex:1;min-width:40px;padding:1px 0}
.field input::placeholder{color:var(--ink3)}
.field .kbd{
  font-family:var(--mono);font-size:10.5px;color:var(--ink3);border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;background:var(--panel2)
}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer;white-space:nowrap
}
.chip:hover{border-color:rgba(99,102,241,.45);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.ghost{cursor:default}
.chip.ghost:hover{border-color:var(--line);color:var(--ink2)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink2);box-shadow:var(--sh1)
}
.btn:hover{border-color:rgba(99,102,241,.5);color:var(--accent);text-decoration:none;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#4f46e5,#6366f1);border-color:transparent;color:#fff}
.btn.primary:hover{color:#fff;box-shadow:0 10px 24px -10px rgba(79,70,229,.9)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;font-weight:600;line-height:1.7}
.tag.t-text{color:#8a5a00;background:rgba(245,158,11,.16)}
.tag.t-hybrid{color:#075985;background:rgba(14,165,233,.16)}
.tag.t-visual{color:#9d174d;background:rgba(236,72,153,.16)}
.tag.c-opinion{color:#3730a3;background:rgba(99,102,241,.15)}
.tag.c-kepu{color:#065f46;background:rgba(16,185,129,.16)}
.tag.c-archive{color:#92400e;background:rgba(245,158,11,.20)}
.tag.d-dual{color:#9a3412;background:rgba(251,146,60,.20)}
.muted{color:var(--ink3)}
.mono{font-family:var(--mono)}
.hl{background:linear-gradient(180deg,transparent 58%,rgba(250,204,21,.65) 58%);border-radius:2px}

/* ---------- 图表容器 ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:26px 20px 70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh2)}
.sect-title{display:flex;align-items:baseline;gap:10px;margin:34px 0 14px}
.sect-title h2{margin:0;font-size:19px;letter-spacing:.2px}
.sect-title p{margin:0;color:var(--ink3);font-size:13px}

/* ---------- 轻提示 ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:300;max-width:min(680px,92vw);
  background:rgba(17,22,38,.96);color:#eef1f8;border-radius:13px;padding:12px 16px;font-size:13.4px;line-height:1.7;
  box-shadow:var(--sh3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s
}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast code{font-family:var(--mono);font-size:12.4px;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:5px}
.toast b{color:#fff}

/* ---------- 灯箱 ---------- */
.lb{
  position:fixed;inset:0;z-index:200;display:none;background:rgba(8,11,20,.9);backdrop-filter:blur(6px);
  padding:34px 26px
}
.lb.on{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr auto;gap:12px}
.lb .lbtop{display:flex;align-items:center;gap:10px;color:#e7ebf5;font-size:13.5px}
.lb .lbtop .spacer{flex:1}
.lb img{max-width:100%;max-height:100%;margin:auto;display:block;border-radius:10px;box-shadow:var(--sh3);background:#000}
.lb .cap{color:#c9d2e3;font-size:13px;max-width:1100px;margin:0 auto;line-height:1.6}
.lb .cap b{color:#fff}
.lb .x,.lb .nav{
  border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;
  padding:5px 11px;cursor:pointer;font-size:13px
}
.lb .x:hover,.lb .nav:hover{background:rgba(255,255,255,.2)}
.lb .nav[disabled]{opacity:.35;cursor:not-allowed}

/* ---------- Markdown 正文 ---------- */
.md{font-size:15.6px;line-height:1.82;color:#1b2233;word-wrap:break-word}
.md h1{font-size:26px;line-height:1.35;margin:0 0 14px;letter-spacing:-.2px}
.md h2{
  font-size:18.5px;margin:34px 0 12px;padding-left:11px;border-left:4px solid var(--accent2);line-height:1.4
}
.md h3{font-size:16.4px;margin:26px 0 9px;color:#2b3550}
.md h4{font-size:15px;margin:20px 0 7px;color:#374160}
.md p{margin:0 0 14px}
.md ul,.md ol{margin:0 0 15px;padding-left:24px}
.md li{margin:5px 0}
.md li::marker{color:var(--accent2)}
.md strong{color:#111827;font-weight:700}
.md blockquote{
  margin:0 0 16px;padding:11px 15px;border-left:3px solid rgba(99,102,241,.5);border-radius:0 10px 10px 0;
  background:var(--accent-soft);color:#3c4560;font-size:14.2px;line-height:1.75
}
.md blockquote a{word-break:break-all}
.md code{font-family:var(--mono);font-size:13px;background:var(--panel3);padding:1.5px 5px;border-radius:5px}
.md hr{border:0;border-top:1px solid var(--line);margin:26px 0}
.md img{max-width:100%;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:zoom-in;display:block;margin:6px 0}
.md .tblwrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.md table{border-collapse:collapse;width:100%;font-size:13.6px;min-width:520px}
.md th,.md td{border-bottom:1px solid var(--line2);padding:9px 12px;text-align:left;vertical-align:top;line-height:1.7}
.md thead th{background:var(--panel2);font-weight:700;color:#2b3550;white-space:nowrap;position:sticky;top:0}
.md tbody tr:last-child td{border-bottom:0}
.md tbody tr:hover{background:rgba(99,102,241,.035)}
.md td img{min-width:190px;max-width:300px}

body{overflow:hidden}
.gal{display:grid;grid-template-rows:auto 1fr;height:calc(100vh - 49px)}
.gbar{
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.7);backdrop-filter:blur(10px)
}
.gbar .field{min-width:210px;padding:4px 10px}
.gbar .chip{font-size:12px;padding:2px 9px}
.gbar select{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:4px 8px;font-size:12.2px;
  color:var(--ink2);max-width:190px}
.gbar .cnt{font-size:12.4px;color:var(--ink3);white-space:nowrap}
.scroll{overflow:auto;padding:16px 18px 60px;min-height:0}
.mason{columns:6 226px;column-gap:12px}
.kf{
  break-inside:avoid;margin:0 0 12px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel);
  box-shadow:var(--sh1);cursor:zoom-in;position:relative;transition:transform .16s,box-shadow .16s,border-color .16s
}
.kf:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:rgba(99,102,241,.42)}
.kf img{width:100%;display:block;background:var(--panel3);min-height:110px}
.kf .ov{
  position:absolute;inset:0 0 auto 0;display:flex;gap:6px;align-items:center;padding:7px 9px;
  background:linear-gradient(180deg,rgba(8,11,20,.62),transparent);opacity:0;transition:opacity .18s
}
.kf:hover .ov{opacity:1}
.kf .ov .mono{font-size:11px;color:#fff;background:rgba(0,0,0,.45);padding:1px 7px;border-radius:6px}
.kf .ov .b{font-size:11px;color:#fff;background:rgba(99,102,241,.85);padding:1px 7px;border-radius:6px;font-weight:600}
.kf .c{padding:8px 10px 9px}
.kf .d{font-size:12.2px;color:var(--ink2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kf .n{font-size:11.4px;color:var(--ink3);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sentinel{padding:22px;text-align:center;color:var(--ink3);font-size:13px}
@media (max-width:900px){html,body{overflow:auto}.gal{height:auto}.scroll{overflow:visible;padding:12px 12px 60px}.mason{columns:2 140px}}
</style>
</head>

te":"农户田间配合收割与防护（口罩）","id":"BV1R7421d7rb","title":"豫西农民小麦收成情况考察报告","upper":"这是个令人疑惑的星球","coll":"opinion","type":"text"},{"img":"projects/bilibili-kb/raw/BV1R7421d7rb_f3.jpg","t":"07:19","desc":"实拍：远景麦田，一台收割机在金黄色麦田中作业，已收割与未收割区域形成明显界线，背景有村庄房屋与树木，字幕\"笔者采访过两家收割机农户皆是一男一女的组合搭配\"","note":"收割机农户男女搭档与跨省作业","id":"BV1R7421d7rb","title":"豫西农民小麦收成情况考察报告","upper":"这是个令人疑惑的星球","coll":"opinion","type":"text"},{"img":"projects/bilibili-kb/raw/BV1R7421d7rb_f4.jpg","t":"10:58","desc":"实拍：麦田中\"沃得\"收割机正在割麦，尾部扬起浓重麦尘，背景有孤树、电线杆与村庄，字幕\"这一点让收割机农户颇为头疼\"","note":"收割机农户面临的作业难题","id":"BV1R7421d7rb","title":"豫西农民小麦收成情况考察报告","upper":"这是个令人疑惑的星球","coll":"opinion","type":"text"},{"img":"projects/bilibili-kb/raw/BV1R7421d7rb_f5.jpg","t":"14:38","desc":"实拍：收割后的麦茬地近景，地面铺满金黄色麦秸与碎屑，散落砖块和杂草，字幕\"但也必须要做一些小事情\"","note":"收割后田间细碎劳作","id":"BV1R7421d7rb","title":"豫西农民小麦收成情况考察报告","upper":"这是个令人疑惑的星球","coll":"opinion","type":"text"},{"img":"projects/bilibili-kb/raw/BV1R7421d7rb_f6.jpg","t":"18:17","desc":"实拍：夜晚农家院门口，两名男子正在从蓝色三轮车上搬运白色袋装物资，两个孩子在旁观看，门内堆满黄色袋子，字幕\"夜深后在收割机农户离开前\"","note":"夜间农户互助与物资搬运","id":"BV1R7421d7rb","title":"豫西农民小麦收成情况考察报告","upper":"这是个令人疑惑的星球","coll":"opinion","type":"text"},{"img":"projects/bilibili-kb/raw/BV1LZ421j779_f1.jpg","t":"同倍率对比实证","desc":"古典双反相机（TLR）实物特写：黑色机身、顶部刻有「福」「马」二字（海鸥4系列）、双镜头结构清晰可见。左侧暖色台灯营造散景光斑。左上角文字标注「50mm f/5.6」。字幕：「一样距离拍肯定是的」","note":"**用实机演示\"同放大倍率对比\"原则**。50mm@f5.6在特定拍摄距离下与135mm镜头产生相同的主体放大率——只有在这种条件下比较虚化才有意义。海鸥双反=国产光学工业的象征物，雨果用它做教具增加亲切感","id":"BV1LZ421j779","title":"镜头研究报告-虚化（下）","upper":"雨果实验室","coll":"opinion","type":"hybrid"},{"img":"projects/bilibili-kb/raw/BV1LZ421j779_f2.jpg","t":"像散原理图解","desc":"左右分屏：左侧为泛黄纸质 vintage 光学手绘图（Petzval人像镜结构，标注L/V/P/O/G/T/b等光路节点）；右侧为现代3D渲染的**Petzval's Portrait lens**剖面模型。字幕：「用自己的名字命名」","note":"**漩涡焦外(旋焦)的光学根源 = 像散(astigmatism)**。Joseph Petzval在1840年设计的这支镜头是首个用数学方法计算的人像镜，其子午面/弧矢面光线无法汇聚于同一点→边缘光斑被压缩成漩涡状。以发明者命名=光学史上的殊荣，也解释了为何\"八羽怪\"(苏制Biotar仿品)至今仍被追捧","id":"BV1LZ421j779","title":"镜头研究报告-虚化（下）","upper":"雨果实验室","coll":"opinion","type":"hybrid"},{"img":"projects/bilibili-kb/raw/BV1LZ421j779_f3.jpg","t":"鱼鳞光斑实拍","desc":"夜景散焦特写：多个圆形光斑均呈现**鱼鳞状缺口**（边缘有规则性缺失，像被咬了一口的圆）。深色背景中光斑大小不一但形貌一致。字幕：「画面中很大一部分都有这种鱼鳞」","note":"**口径蚀(vignetting)的视觉签名**。鱼鳞光斑=光线在到达像面前被镜筒边缘物理遮挡。关键判别法：收小光圈后若鱼鳞消失→口径蚀；若仍在→像散。此帧是\"看光斑识镜头\"训练的第一课","id":"BV1LZ421j779","title":"镜头研究报告-虚化（下）","upper":"雨果实验室","coll":"opinion","type":"hybrid"},{"img":"projects/bilibili-kb/raw/BV1LZ421j779_f4.jpg","t":"光圈形状动画示意","desc":"扁平化相机图标动画：白顶灰身，中央光圈叶片环上环绕文字「bilibili」「hugolab」「3.5」「5.6」「一镜三生」。灰色背景","note":"**过渡动画：从具体镜头抽象到光圈参数**。\"一镜三生\"是雨果实验室的系列slogan（同一支镜头在不同光圈下呈现三种虚化性格）。动画简洁有效地将注意力引向下文关于光圈叶片形状对光斑影响的讨论","id":"BV1LZ421j779","title":"镜头研究报告-虚化（下）","upper":"雨果实验室","coll":"opinion","type":"hybrid"},{"img":"projects/bilibili-kb/raw/BV1LZ421j779_f5.jpg","t":"奶油虚化范本","desc":"荷花微距摄影：单朵粉色荷花花苞立于画面偏右，周围大片绿色荷叶漂浮水面。背景呈现极度柔和的**奶油般均匀虚化**（无任何光斑边界或形状痕迹）。自然光。字幕：「能不能得到像这样软的光斑呢」","note":"**变迹(apodization)柔焦效果的目标参照**。这种\"无特征\"的软虚化是索尼STF/富士DS滤镜追求的理想状态——点扩散函数被人为加上高斯软边缘，代价是损失1-2档通光量。荷花作为测试目标因其既有锐利主体(花瓣)又有大面积渐变背景(水面)，是评测虚化的经典题材","id":"BV1LZ421j779","title":"镜头研究报告-虚化（下）","upper":"雨果实验室","coll":"opinion","type":"hybrid"},{"img":"projects/bilibili-kb/raw/BV1LZ421j779_f6.jpg","t":"镜头成色自检","desc":"从镜头正前方极端近距离拍摄：可见多片镜片组、光圈叶片机械结构、镜片边缘蓝色镀膜反射。**镜片表面有明显霉斑/水渍痕迹**（白色斑点状附着物），透过镜头可模糊看到拍摄者手持手机的反光。字幕：「那确实不影响画质」","note":"**实用技巧：用光斑放大自检镜头瑕疵**。雨果演示的关键判断逻辑：若所有光斑都带有相同瑕疵→镜头内部霉/污（影响画质）；若仅单个光斑有痕→外部灰尘（不影响成像）。此帧中的霉斑属于\"全斑同瑕\"类型但结论是\"不影响\"——暗示轻微表面霉在缩小光圈后可能落在成像圈外","id":"BV1LZ421j779","title":"镜头研究报告-虚化（下）","upper":"雨果实验室","coll":"opinion","type":"hybrid"},{"img":"projects/bilibili-kb/raw/BV1mx4y1H7VA_f1.jpg","t":"课纲溯源","desc":"论坛现场——长发女性持麦克风发言（面前有平板），背景红桌布长桌+多位与会者（含右侧粉领带男士）；右下角「维为道来」logo；字幕「当然就是要回溯到陈水扁时代」","note":"**第一节论据画面**：通过论坛发言者引出课纲本土化起点（陈水扁时代），为\"岛内倾斜台独\"提供历史锚点","id":"BV1mx4y1H7VA","title":"台湾可能没有下一次“大选”了","upper":"张维为","coll":"opinion","type":"hybrid"},{"img":"projects/bilibili-kb/raw/BV1mx4y1H7VA_f2.jpg","t":"两会信号","desc":"人民大会堂外景——柱廊建筑+顶飘红旗+广场人群举手机拍摄；「维为道来」logo；字幕「你看李强总理的工作报告」","note":"**第二节核心证据**：两会现场实拍→政府工作报告 7uT_f2.jpg","t":"~10:00","desc":"真人舞台表演（非动画）：穿黑色礼服的男性在红色幕布舞台中央，单臂高举，姿态夸张戏剧化；立式麦克风在前；全暗背景聚光于人物","note":"**\"剧场性\"隐喻**：**引入真人舞台表演作为类比**——视频讨论动画中的\"表演性\"与\"剧场性\"，用真实演员的夸张肢体语言来对照动画角色的\"表演\"；红幕布=经典剧场符号","id":"BV1ES4y1D7uT","title":"漂流少年全解 下：谎言与重复","upper":"多边兽2","coll":"opinion","type":"text"},{"img":"projects/bilibili-kb/raw/BV1ES4y1D7uT_f3.jpg","t":"~18:00","desc":"动画截图（《漂流少年》本篇）：角色（疑似瑞穗或希）穿米色风衣+红色棒球帽，伸手向镜头外，表情渴望/坚定；深蓝星空+城市建筑剪影；字幕引用《花与爱丽丝杀人事件》(2015) + 「永远站在方生方死的青春这一边」","note":"**核心命题的画面化**：**\"方生方死\"（方生方死）=青春的本质——永远在生成与消亡之间**；伸出的手=向未知世界敞开的欲望；星空背景暗示\"广阔而稀薄\"的存在之轻","id":"BV1ES4y1D7uT","title":"漂流少年全解 下：谎言与重复","upper":"多边兽2","coll":"opinion","type":"text"},{"img":"projects/bilibili-kb/raw/BV1ES4y1D7uT_f4.jpg","t":"~25:00","desc":"影视截图（《蝇王》Lord of the Flies, 1990）：极暗近景，几乎全黑，仅能辨认一人面部轮廓局部（鼻/唇），暖色微光从一侧打来；字幕标注「《蝇王》(1990)」","note":"**文学参照的视觉锚点**：**《蝇王》=替罪羊机制的经典文本**——极暗画面象征文明崩塌后的原始恐惧；与《漂流少年》中霸凌/替罪羊主题形成互文；黑暗本身即是\"谎言覆盖真实\"的视觉隐喻","id":"BV1ES4y1D7uT","title":"漂流少年全解 下：谎言与重复","upper":"多边兽2","coll":"opinion","type":"text"},{"img":"projects/bilibili-kb/raw/BV1ES4y1D7uT_f5.jpg","t":"~35:00","desc":"动画截图（《漂流少年》本篇）：热带岛屿场景——绿山+棕榈树+蓝天，女孩（日瑞希？）穿水手服看手机，男孩（长良？）坐地，地上有一只巨大的蓝色螃蟹状生物；字幕「使她如飞蛾扑火般自发地前往广阔而稀薄的场所」","note":"**\"飞蛾扑火\"的具象场景**：**热带孤岛=漂流世界中的一个\"稀薄场所\"**——巨大螃蟹=这个世界的异质存在；女孩看手机=仍与旧世界保持连接（虚假的）；\"自发前往\"暗示某种不可抗拒的召唤/引力","id":"BV1ES4y1D7uT","title":"漂流少年全解 下：谎言与重复","upper":"多边兽2","coll":"opinion","type":"text"},{"img":"projects/bilibili-kb/raw/BV1ES4y1D7uT_f6.jpg","t":"~45:00","desc":"动画截图（《漂流少年》本篇）：雪景——角色（疑似希）戴深色帽子+红色手套，低头凝视手中物品（钥匙？），神情专注而忧伤；石墙+积雪背景；字幕提及「钥匙画家」「小津所饰演的'先验-他人'的帮助下」","note":"**电影理论引用的收束画面**：**\"钥匙画家\"（key animator）+ \"小津\"（Yasujiro Ozu）+ \"先验-他人\"（a priori - the Other）=三层理论叠加**——雪地=纯净/寒冷的分析场；手中的钥匙可能象征\"打开理解之门\"；红色手套是画面中唯一的暖色=残存的人性温度","id":"BV1ES4y1D7uT","title":"漂流少年全解 下：谎言与重复","upper":"多边兽2","coll":"opinion","type":"text"},{"img":"projects/bilibili-kb/raw/BV1F3411E7iz_f1.jpg","t":"开场定位","desc":"![](..\\raw\\BV1F3411E7iz_f1.jpg)","note":"《Sonny Boy》官方海报：黑底白字标题+日文副标题，画面为多名学生在铁丝网围栏旁（坐/站 aw/BV16c41157iK_f3.jpg","t":"~07:00","desc":"论文截图（§2.6 Proliferation of Weapons + Figure 4）：Figure 4 展示三个导致有害内容的提示词示例（堕胎相关医疗咨询）；黄色高亮 OCR——「etal biases, or hallucinations - has the potential to cast doubt on the whole information environment, threatening our ability to distinguish fact from fiction. These could disproportionately benefit those who stand to gain from widespread distrust. [54] The phenomenon scholars Chesney and Citron refer to as Liars Dividend in the context of deep fakes.[55]」；底部红字批注「就在 unconventional weapons，所以有信息真实性产生怀疑，或 disperse」","note":"**\"骗子红利\"的学术溯源**：从技术报告原文引出 **Liars Dividend（骗子红利）** 核心概念——**幻觉不只是技术缺陷，更会被恶意行为者利用来侵蚀整个信息环境的可信度**；Figure 4 的堕胎提示词示例展示红队测试的具体攻击面","id":"BV16c41157iK","title":"为什么人工智能会产生幻觉，如何消除？一起读两篇有关GPT-4的技术报告","upper":"复旦赵斌","coll":"opinion","type":"text"},{"img":"projects/bilibili-kb/raw/BV16c41157iK_f4.jpg","t":"~10:00","desc":"主讲人同框镜头，手势微变（手部在胸前区域），表情认真确认式；背景不变；字幕「相信大家都应该明白了这个问题」","note":"**承上启下的节奏点**：讲完问题本质后确认观众理解——**手势和表情传递\"这是一个严肃且已被充分论证的问题\"**，为后续解决方案铺垫","id":"BV16c41157iK","title":"为什么人工智能会产生幻觉，如何消除？一起读两篇有关GPT-4的技术报告","upper":"复旦赵斌","coll":"opinion","type":"text"},{"img":"projects/bilibili-kb/raw/BV16c41157iK_f5.jpg","t":"~13:00","desc":"论文截图（Confidence calibration 段落）：黄高亮 OCR——「Confidence calibration: Many of the models have trouble knowing when it should be confident and when it is just guessing...closed-domain hallucination and open-domain hallucination can be difficult to detect. Such hallucinations can be stated in a confident and persuasive manner...White hallucination is a good thing when generating creative content...reliance on factual claims made by a model with hallucinations can be costly, especially for use in high-stakes domains such as healthcare」；绿高亮标注缓解方向；右下主讲人画中画；字幕「这后面尝试解决幻觉问题」","note":"**解决方案的技术路线图**：置信度校准是核心——**模型最大的问题是\"不知道自己不知道\"**，却以自信口吻输出；白幻觉（white hallucination）在创意领域有用但在高风险领域（如医疗）致命；绿高亮暗示后续有具体缓解方法","id":"BV16c41157iK","title":"为什么人工智能会产生幻觉，如何消除？一起读两篇有关GPT-4的技术报告","upper":"复旦赵斌","coll":"opinion 模型拓扑和法线修改控制阴影；后来二游采用距离场面部阴影，让阴影始终受美术控制而非完全依赖真实光照。","id":"BV1UYjA6NExt","title":"二游角色建模还原原画有多难?","upper":"孙拓海Taku","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1UYjA6NExt_f4.jpg","t":"~7:20","desc":"《终末地》角色头顶头发特写：深色发丝上有一圈整齐明亮的环形高光（天使环），高光沿发丝方向分布，边缘锐利。<br>![](..\\raw\\BV1UYjA6NExt_f4.jpg)","note":"头发高光还原：使用球形法线让引擎按球形计算高光，配合各项异性材质与润色采样，得到原画般的环状、多彩高光。","id":"BV1UYjA6NExt","title":"二游角色建模还原原画有多难?","upper":"孙拓海Taku","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1UYjA6NExt_f5.jpg","t":"~9:10","desc":"3D 建模软件视图：一个简化的口腔/牙齿模型，上下颚、牙齿、舌头以低多边形形式呈现，周围有黄框标注。<br>![](..\\raw\\BV1UYjA6NExt_f5.jpg)","note":"表情还原：不同于仅切换贴图，终末地为口腔建立独立模型，并为不同角色定制牙齿，使大笑等表情更生动、更具角色个性。","id":"BV1UYjA6NExt","title":"二游角色建模还原原画有多难?","upper":"孙拓海Taku","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1UYjA6NExt_f6.jpg","t":"~11:00","desc":"《终末地》游戏场景：夕阳下刻有文字的石碑立于水边，远处是未来城市与飘动的红绸，画面兼具写实光影与二次元审美。<br>![](..\\raw\\BV1UYjA6NExt_f6.jpg)","note":"整体策略：脖子以下用 BPR（物理材质）强调体积与装备功能，脖子以上用 NPR（风格化）保留二次元五官，实现“写实主义二次元”。","id":"BV1UYjA6NExt","title":"二游角色建模还原原画有多难?","upper":"孙拓海Taku","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1bZTA61Eip_f1.jpg","t":"~0:44","desc":"飞书文档页面展示“AI 生图范式演进与里程碑论文解读”大纲，主图是 Autoencoder 结构示意图：输入 x 经神经网络编码器压缩到潜空间 z，再经解码器重建为 x̂；配文解释显变量与隐变量、潜空间思想。<br>![](..\\raw\\BV1bZTA61Eip_f1.jpg)","note":"引出 VAE 的源头：Autoencoder 把高维像素压缩到低维潜空间，为后续生成模型奠定“在潜空间操作”的核心思想。","id":"BV1bZTA61Eip","title":"AI 生图原理与里程碑论文解读｜从 VAE、GAN 到 Diffusion、自回归","upper":"堂吉诃德拉曼查的英豪","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1bZTA61Eip_f2.jpg","t":"~3:52","desc":"飞书文档讲解 ViT（Vision Transformer, 2020）论文，左侧列出论文信息，右侧是 Vision Transformer 架构图：图像被切分为 Patch，经 Linear Projection、Position Embedding 后进入标准 Transformer Encoder。<br>![](..\\raw\\BV1bZTA61Eip_f2.jpg)","note":"基础工作：ViT 首次证明 Transformer 可用于视觉任务，为后续扩散、自回归生图模型用 Transformer 做骨干打开可能性。","id":"BV1bZTA61Eip","title":"AI 生图原理与里程碑论文解读｜从 VAE、GAN 到 Diffusion、自回归","upper":"堂吉诃德拉曼查的英豪","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1bZTA61Eip_f3.jpg","t":"~12:52","desc":"扩散模型前向/反向过程示意图：左侧展示从清晰向日葵图像 x₀ 逐步加噪到纯高斯噪声 x_T；中间给出 q(x_t","note":"x₀) 等数学公式；右侧展示神经网络 εθ 从噪声中一步步去噪还原。<br>![](..\\raw\\BV1bZTA61Eip_f3.jpg)","id":"BV1bZTA61Eip","title":"AI 生图原理与里程碑论文解读｜从 VAE、GAN 到 Diffusion、自回归","upper":"堂吉诃德拉曼查的英豪","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1bZTA61Eip_f4.jpg","t":"~21:44","desc":"飞书文档讲解 DALL·E 2（2022）论文，标题为“Hierarchical Text-Conditional Image Generation with CLIP Latents”；正文列出 Prior、Decoder、Upsampler 三个组件，并强调“反转 CLIP”思想。<br>![](..\\raw\\BV1bZTA61Eip_f4.jpg)","note":"OpenAI 路线：DALL·E 2 先用 Prior 把文本向量导航到图像向量，再用扩散 Decoder 生图，显著提升图文对齐质量。","id":"BV1bZTA61Eip","title":"AI 生图原理与里程碑论文解读｜从 VAE、GAN 到 Diffusion、自回归","upper":"堂吉诃德拉曼查的英豪","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1bZTA61Eip_f5.jpg","t":"~34:02","desc":"论文原图展示 VQ-VAE 的层级编码器/解码器架构与多阶段图像生成：256×256 图像被压缩为 64×64 与 32×32 两层离散隐变量，再经 PixelCNN 先验生成。<br>![](..\\raw\\BV1bZTA61Eip_f5.jpg)","note":"自回归基础：VQ-VAE 通过向量量化把图像变成离散 token，使 Transformer 可像生成文本一样自回归地生成图像。","id":"BV1bZTA61Eip","title":"AI 生图原理与里程碑论文解读｜从 VAE、GAN 到 Diffusion、自回归","upper":"堂吉诃德拉曼查的英豪","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1bZTA61Eip_f6.jpg","t":"~48:24","desc":"飞书文档总结 OpenAI 技术演进路线：从 DALL·E 1 自回归，到 DALL·E 2 扩散，再到 GPT-4o 原生图像能力，并对比 Google 扩散（Imagen）与自回归（NaN/...）双轨并行策略。<br>![](..\\raw\\BV1bZTA61Eip_f6.jpg)","note":"产业视角：OpenAI 与 Google 在扩散、自回归两条路线间反复切换/并行下注，反映技术路线尚未完全收敛。","id":"BV1bZTA61Eip","title":"AI 生图原理与里程碑论文解读｜从 VAE、GAN 到 Diffusion、自回归","upper":"堂吉诃德拉曼查的英豪","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1qRDHBDErr_f1.jpg","t":"~0:40","desc":"实验者手持一枚圆柱形钕磁铁，背景为透明展示盒与中英双语字幕“这个磁铁本身就非常强”。<br>![](..\\raw\\BV1qRDHBDErr_f1.jpg)","note":"引入主题：普通永磁体磁场很强且无法像电磁铁那样断电关闭。","id":"BV1qRDHBDErr","title":"可开关的永久磁铁 | The Action Lab","upper":"一摩尔炸鸡翅","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1qRDHBDErr_f2.jpg","t":"~1:35","desc":"实验者将厚钢块靠近钕磁铁，磁性显影纸仍能透出部分磁力线，字幕解释钢会磁饱和。<br>![](..\\raw\\BV1qRDHBDErr_f2.jpg)","note":"说明用钢屏蔽的局限：钢可被磁饱和，无法完全阻断磁场。","id":"BV1qRDHBDErr","title":"可开关的永久磁铁 | The Action Lab","upper":"一摩尔炸鸡翅","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1qRDHBDErr_f3.jpg","t":"~3:10","desc":"加热后的钕磁铁放在生锈钢板上，周围散落细小磁性碎屑，字幕提及磁矩因热运动变得无序。<br>![](..\\raw\\BV1qRDHBDErr_f3.jpg)","note":"加热至居里温度以上会破坏永磁体的磁矩有序排列，使其退磁。","id":"BV1qRDHBDErr","title":"可开关的永久磁铁 | The Action Lab","upper":"一摩尔炸鸡翅","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1qRDHBDErr_f4.jpg","t":"~4:50","desc":"实验者操作黄色的磁力开关（mag square），拨到 On 档后吸起金属块。<br>![](..\\raw\\BV1qRDHBDErr_f4.jpg)","note":"展示真正的可开关永磁体：机械开关即可在“有磁”与“无磁”之间切换。","id":"BV1qRDHBDErr","title":"可开关的永久磁铁 | The Action Lab","upper":"一摩尔炸鸡翅","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1qRDHBDErr_f5.jpg","t":"~6:10","desc":"双手隔着白纸展示钢币被两侧小磁铁夹住的黑盒模型，字幕说明“黑盒子里面是什么”。<br>![](..\\raw\\BV1qRDHBDErr_f5.jpg)","note":"揭示原理：翻转其中一个永磁体方向，外部磁场相互抵消。","id":"BV1qRDHBDErr","title":"可开关的永久磁铁 | The Action Lab","upper":"一摩尔炸鸡翅","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1qRDHBDErr_f6.jpg","t":"~8:00","desc":"右侧为彩色磁场模拟图，对比圆柱形磁体在钢侧壁包围下的 On（磁场外漏）与 Off（磁场内部短路）状态。<br>![](..\\raw\\BV1qRDHBDErr_f6.jpg)","note":"工程化原理：用钢壳为磁通提供闭合捷径，旋转磁体即可控制磁场是否外漏。","id":"BV1qRDHBDErr","title":"可开关的永久磁铁 | The Action Lab","upper":"一摩尔炸鸡翅","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1ahjA6qEwc_f1.jpg","t":"~1:40","desc":"动画展示一颗三星显存芯片通过金色导线向 GPU（GB202-300-A1）传输“01010”二进制电压信号。<br>![](..\\raw\\BV1ahjA6qEwc_f1.jpg)","note":"引入带宽公式：带宽 = 频率 × 位宽，说明提升位宽是 HBM 提高速度的关键路径。","id":"BV1ahjA6qEwc","title":"用最好的动画为你讲解--HBM的原理","upper":"Redknot-乔红","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1ahjA6qEwc_f2.jpg","t":"~4:00","desc":"动画展示一片带有金色存储电路的硅片，字幕说明“这个硅片是非常脆的”。<br>![](..\\raw\\BV1ahjA6qEwc_f2.jpg)","note":"解释传统 GDDR 需要先封装在玻璃纤维基板上，而基板走线密度有限，无法满足 HBM 数千根导线的需求。","id":"BV1ahjA6qEwc","title":"用最好的动画为你讲解--HBM的原理","upper":"Redknot-乔红","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1ahjA6qEwc_f3.jpg","t":"~6:00","desc":"动画展示一块表面光滑如镜、带有平行金属走线的大号硅片，字幕称其为“负责牵线搭桥的大号硅片”。<br>![](..\\raw\\BV1ahjA6qEwc_f3.jpg)","note":"引出硅中介层：用硅片代替基板，可用光刻/刻蚀做出亚微米级线路，大幅提升走线密度。","id":"BV1ahjA6qEwc","title":"用最好的动画为你讲解--HBM的原理","upper":"Redknot-乔红","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1ahjA6qEwc_f4.jpg","t":"~8:30","desc":"动画展示黄色 SF₆ 气体注入工作腔室并腐蚀硅片，字幕解释六氟化硫在工作腔室后的行为。<br>![](..\\raw\\BV1ahjA6qEwc_f4.jpg)","note":"展示 TSV 硅通孔制造：深反应离子刻蚀（Bosch 工艺）交替腐蚀与保护，打出 5–10 微米直径的贯穿孔。","id":"BV1ahjA6qEwc","title":"用最好的动画为你讲解--HBM的原理","upper":"Redknot-乔红","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1ahjA6qEwc_f5.jpg","t":"~11:00","desc":"动画展示硅片表面整齐排列的金属微凸点（microbumps），字幕说明“可以将多个芯片对叠在一起”。<br>![](..\\raw\\BV1ahjA6qEwc_f5.jpg)","note":"说明堆叠工艺：通过微凸点焊接把多片存储裸片叠在一起，数据经铜柱向下传递至硅中介层。","id":"BV1ahjA6qEwc","title":"用最好的动画为你讲解--HBM的原理","upper":"Redknot-乔红","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1ahjA6qEwc_f6.jpg","t":"~14:30","desc":"画面叠加 NVIDIA GTC 台北 2026 演讲回放，显示服务器节点“1152 GB”与“¥2000000”字样。<br>![](..\\raw\\BV1ahjA6qEwc_f6.jpg)","note":"量化 HBM 价值：一个搭载四颗 GPU、总显存 1.15 TB 的服务器节点价值约 200 万元人民币，凸显 HBM 在 AI 基础设施中的核心地位。","id":"BV1ahjA6qEwc","title":"用最好的动画为你讲解--HBM的原理","upper":"Redknot-乔红","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1v2Ayz6EA4_f1.jpg","t":"约 00:00","desc":"![](..\\raw\\BV1v2Ayz6EA4_f1.jpg)","note":"演示者手持防窥膜盖在 RGB 子像素模型上，展示侧视被遮挡的效果，画面同时呈现 OLED 子像素网格与黑色挡墙结构","id":"BV1v2Ayz6EA4","title":"三星 S26 Ultra 防窥屏原理 韩博主详细讲解  FMP Flex Magic Pixel LEAD 2.0","upper":"明亮945","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1v2Ayz6EA4_f2.jpg","t":"约 06:30","desc":"![](..\\raw\\BV1v2Ayz6EA4_f2.jpg)","note":"演示者坐在桌前讲解，手中拿着手机样机，背景陈列着 Galaxy S 系列手机的展示盒与宣传物料","id":"BV1v2Ayz6EA4","title":"三星 S26 Ultra 防窥屏原理 韩博主详细讲解  FMP Flex Magic Pixel LEAD 2.0","upper":"明亮945","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1v2Ayz6EA4_f3.jpg","t":"约 13:00","desc":"![](..\\raw\\BV1v2Ayz6EA4_f3.jpg)","note":"演示者坐在桌前总结，桌面上摆放着像素模型与手机样机，背景为暗色陈列墙","id":"BV1v2Ayz6EA4","title":"三星 S26 Ultra 防窥屏原理 韩博主详细讲解  FMP Flex Magic Pixel LEAD 2.0","upper":"明亮945","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1TXFdzsEqo_f1.jpg","t":"~14:51","desc":"从iPod的缘起讲起：乔布斯找沃兹尼亚克四天完成游戏电路板（仅45个晶体管），初代iPod主打“听歌+小游戏”、刻意做减法并把歌单管理交给iTunes；初代电池仅630毫安时、续航约10小时、不可换电池，起售价399美元，比尔·盖茨试玩样机时露出又惊讶又疑惑的表情。画面可能展示初代iPod实物与乔布斯、沃兹的早期照片。<br>![](..\\raw\\BV1TXFdzsEqo_f1.jpg)","note":"初代iPod以“少而精”的取舍配合iTunes生态打开市场，电池与不可换设计使其历史意义大于商业价值。","id":"BV1TXFdzsEqo","title":"万字浅谈iPod全系：从颠覆历史，到成为历史","upper":"花生説","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1TXFdzsEqo_f2.jpg","t":"~29:42","desc":"讲述推动iPhone诞生的iTouch Phone：苹果与摩托罗拉合作，基于E398打造、仅顶部多一颗iTouch快捷键，界面卡顿、传歌极慢（180MB需20分钟）、播放列表最多识别100首；同时提到Apple产品线最“正统”，并承担起探索不同形态、侧面推动iPhone诞生的任务。画面可能展示iTouch Phone（摩托Rokr）与iPod系列产品矩阵。<br>![](..\\raw\\BV1TXFdzsEqo_f2.jpg)","note":"iTouch Phone暴露了手机内置iPod的局限，反而坚定了苹果自研iPhone的决心，Apple系列则持续探索形态。","id":"BV1TXFdzsEqo","title":"万字浅谈iPod全系：从颠覆历史，到成为历史","upper":"花生説","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1TXFdzsEqo_f3.jpg","t":"~44:33","desc":"聚焦iPod Nano系列的演进：Nano 3主打强悍、单代贡献约2500万台（零七至零八年Apple总销量达5483万台创纪录）；Nano 4加入加速度传感器可“甩动切歌”并支持耐克运动追踪；Nano 5装上30万像素摄像头、成为首台可买到的录像iPod，最高拍摄720×480视频，并提供9种颜色。画面可能展示Nano 3/4/5三代机型对比与摄像样张。<br>![](..\\raw\\BV1TXFdzsEqo_f3.jpg)","note":"Nano系列以不断迭代的形态与功能（甩动切歌、摄像）成为iPod家族销量主力，Nano 5被视为“最强一代”。","id":"BV1TXFdzsEqo","title":"万字浅谈iPod全系：从颠覆历史，到成为历史","upper":"花生説","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1TXFdzsEqo_f4.jpg","t":"~59:25","desc":"讲解iPod Shuffle系列：三代是家族最小、被称为“第二代口香糖”，正面无按键、靠耳机线控操作，并首次支持语音播报（无障碍）；四代又回归二代设计、整体更规整；该系列把3.5mm耳机孔与充电、传资料合一于夹子转轴，是“天才设计”。画面可能展示Shuffle各代机身与耳机线控特写。<br>![](..\\raw\\BV1TXFdzsEqo_f4.jpg)","note":"Shuffle以极致迷你与耳机线控、语音播报等巧思著称，接口合一设计体现苹果在微型化上的功力。","id":"BV1TXFdzsEqo","title":"万字浅谈iPod全系：从颠覆历史，到成为历史","upper":"花生説","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1TXFdzsEqo_f5.jpg","t":"~74:16","desc":"讲述iPod Classic：新的硬盘休眠技术让功耗降低约70%、更耐摔，并为早期iPhone积累省电经验；但作为“极致本地播放器”，它在2010年后被Spotify为代表的流媒体与智能手机取代，2014年停产，爱好者将其改装固态硬盘使续航翻5倍。画面可能展示Classic经典点击轮与改装透明壳。<br>![](..\\raw\\BV1TXFdzsEqo_f5.jpg)","note":"Classic因流媒体与智能手机兴起而退场，但其物理美感与点击轮至今仍是怀旧玩家心头好。","id":"BV1TXFdzsEqo","title":"万字浅谈iPod全系：从颠覆历史，到成为历史","upper":"花生説","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1TXFdzsEqo_f6.jpg","t":"~89:07","desc":"收尾于iPod Touch系列：Touch 4是廉价版iPhone、越狱折腾性价比高，推动Touch总销量超1亿台；Touch 5采用超薄铝合金机身、A5双核、500万像素带HDR与闪光灯的摄像头（有挂绳孔且仅此一代），但智能手机进步太快使其吸引力下降。画面可能展示Touch 5多彩机身与挂绳孔细节。<br>![](..\\raw\\BV1TXFdzsEqo_f6.jpg)","note":"iPod Touch作为“不能打电话的iPhone”走到家族巅峰后，终被智能手机的飞速进步淹没，iPod全系成为历史。","id":"BV1TXFdzsEqo","title":"万字浅谈iPod全系：从颠覆历史，到成为历史","upper":"花生説","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1rWqFB4EHR_f1.jpg","t":"~4:25","desc":"讲解LPP（激光等离子体）EUV光源中锡液滴的产生：高纯锡加热至约300℃形成熔融射流，经20-30微米喷嘴挤出后按瑞利-普拉托不稳定性断裂成均匀液滴，并用压电驱动器抑制卫星滴、闭环控制保证均匀性<br>![](..\\raw\\BV1rWqFB4EHR_f1.jpg)","note":"EUV光源的基石是稳定生成每秒5万次的均匀锡液滴，需纳米级振动与闭环控制抑制卫星滴。","id":"BV1rWqFB4EHR","title":"中国EUV光源每秒5万次精准猎杀的工程全解","upper":"落英行者","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1rWqFB4EHR_f2.jpg","t":"~8:49","desc":"介绍预脉冲把锡盘加热成等离子体黄金区间（电子温度约35万-58万开尔文、密度约10的20次方每立方厘米），主脉冲二氧化碳激光（10.6微米）穿透低密度边缘经逆轫致辐射高效耦合；并指出ASML采用德国通快高功率CO2激光<br>![](..\\raw\\BV1rWqFB4EHR_f2.jpg)","note":"主脉冲CO2激光在临界密度界面共振吸收、高效转化为13.5纳米EUV光，核心器件依赖通快高功率CO2激光。","id":"BV1rWqFB4EHR","title":"中国EUV光源每秒5万次精准猎杀的工程全解","upper":"落英行者","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1rWqFB4EHR_f3.jpg","t":"~13:14","desc":"讲解CO2激光的射频激励与放大链路（固态射频源、氮化镓放大、板条预放与主功放输出>100焦、50千赫兹），以及为维持衍射极限光束质量（M平方<1.2）所需的自适应光束控制（哈特曼波前传感、可变形镜、快速转向镜），并引出每秒5万次激光-锡滴协同打击的伺服系统<br>![](..\\raw\\BV1rWqFB4EHR_f3.jpg)","note":"为精准命中锡滴，CO2激光需极高光束质量与稳定功率，并依赖自适应光学实时校正波前与指向。","id":"BV1rWqFB4EHR","title":"中国EUV光源每秒5万次精准猎杀的工程全解","upper":"落英行者","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1rWqFB4EHR_f4.jpg","t":"~17:38","desc":"介绍普克尔斯盒（电光Q开关）以纳秒级开关精确整形预脉冲能量，主脉冲靠全数字化射频包络调制实现高功率无损耗脉冲控制；并用高速振镜（粗调）与压电快速转向镜（精瞄）以微米级精度、微秒级响应命中速度70米/秒的锡滴<br>![](..\\raw\\BV1rWqFB4EHR_f4.jpg)","note":"粗精两级光束偏转（高速振镜+快速转向镜）让30千瓦激光以微米精度命中运动锡滴。","id":"BV1rWqFB4EHR","title":"中国EUV光源每秒5万次精准猎杀的工程全解","upper":"落英行者","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1rWqFB4EHR_f5.jpg","t":"~22:03","desc":"将EUV光源与激光武器（辽源一号）对比：EUV在隔振超高真空中追求完美可重复控制（命中率>99.99%），激光武器在含湍流大气的开放对抗中靠自适应光学拦截（>90%）；并引出EUV等离子体产生的高速离子碎屑会嵌入收集镜、纳米颗粒沉积污染等碎屑管理难题<br>![](..\\raw\\BV1rWqFB4EHR_f5.jpg)","note":"EUV与激光武器同是对自然规律的工程驾驭，但EUV在封闭确定世界追求极限精度，并面临致命的碎屑污染。","id":"BV1rWqFB4EHR","title":"中国EUV光源每秒5万次精准猎杀的工程全解","upper":"落英行者","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1rWqFB4EHR_f6.jpg","t":"~26:27","desc":"讲解向等离子体腔注入氢气形成缓冲与化学自清洁（局部压力约10-100帕，主光路需<0.1帕），并在收集镜上镀惰性钌（Ru）保护膜（13.5纳米反射率约60%）防止碎屑与氧化，维持高反射率<br>![](..\\raw\\BV1rWqFB4EHR_f6.jpg)","note":"氢气缓冲腔内自清洁叠加钌保护膜，是防护EUV光学元件、维持反射率的关键手段。","id":"BV1rWqFB4EHR","title":"中国EUV光源每秒5万次精准猎杀的工程全解","upper":"落英行者","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1wbv2BXEv4_f1.jpg","t":"~4:28","desc":"介绍实验目标（测量样品表面不足100纳米的高度差）与装置：这是迈克逊干涉仪的变种，用待测样品取代一面平面镜；并讲解光源的空间相干性（发出平面波），用宽带波源辐射场模拟演示<br>![](..\\raw\\BV1wbv2BXEv4_f1.jpg)","note":"装置为迈克逊干涉仪变种，核心是用空间相干的宽带光源测量亚百纳米级台阶高度差。","id":"BV1wbv2BXEv4","title":"【中配】揭秘白光干涉测量技术","upper":"AI译片君","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1wbv2BXEv4_f2.jpg","t":"~8:56","desc":"展示待测样品与参考面（镀超薄铬膜的玻璃圆盘，反光率约25%），讲解需将两束光光程差控制在几微米内才能出现白光干涉条纹，并通过平移台微调使条纹显现、轻移即偏移<br>![](..\\raw\\BV1wbv2BXEv4_f2.jpg)","note":"用反光率相当的镀铬样品与参考镜配对，在光程差仅几微米时产生可观测的白光干涉条纹。","id":"BV1wbv2BXEv4","title":"【中配】揭秘白光干涉测量技术","upper":"AI译片君","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1wbv2BXEv4_f3.jpg","t":"~13:24","desc":"从原理深入：宽带辐射可视为无数单频波的线性叠加，宽频光经分束器分成两束、再汇合时在探测器上形成局部明暗；演示将波分半并引入时间差后叠加强度的变化<br>![](..\\raw\\BV1wbv2BXEv4_f3.jpg)","note":"宽带光干涉本质是多频率分量叠加，光程差极小时才出现自相干式的明暗增减。","id":"BV1wbv2BXEv4","title":"【中配】揭秘白光干涉测量技术","upper":"AI译片君","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1wbv2BXEv4_f4.jpg","t":"~17:51","desc":"讲解从干涉图样读取高度差：覆盖区与空白区条纹偏移对应微小高度差，按LED平均波长约500纳米、偏移1/4条纹间距算得台阶约63纳米；并指出真正的相干扫描干涉仪用压电致动器高精度扫描距离差而非数条纹<br>![](..\\raw\\BV1wbv2BXEv4_f4.jpg)","note":"白光干涉条纹的相对偏移可换算出台阶高度（本例约63纳米），而商用设备靠压电扫描精测距离差。","id":"BV1wbv2BXEv4","title":"【中配】揭秘白光干涉测量技术","upper":"AI译片君","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1wbv2BXEv4_f5.jpg","t":"~22:19","desc":"介绍商用相干扫描干涉显微镜（如30年历史的蔡司NewView 100）：迈克尔逊物镜把分光镜与参考镜集成其中，设备为全自动五轴、Z轴由压电平台驱动扫描，光源为普通白炽灯（光谱宽利于相干斑集中）<br>![](..\\raw\\BV1wbv2BXEv4_f5.jpg)","note":"商用相干扫描显微镜将干涉结构集成于物镜，并以压电平台在Z轴高精度扫描。","id":"BV1wbv2BXEv4","title":"【中配】揭秘白光干涉测量技术","upper":"AI译片君","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1wbv2BXEv4_f6.jpg","t":"~26:47","desc":"展示实测结果：平板玻璃台阶约59纳米与预设吻合，但低倍物镜横向分辨率有限，故高倍改用micro构型（物镜底端半透半反镜加内部参考镜）；并演示测量凹面球镜曲率与抛光花岗岩的矿物起伏<br>![](..\\raw\\BV1wbv2BXEv4_f6.jpg)","note":"实测台阶约59纳米吻合预期；高倍测量需micro构型物镜，并可测曲面曲率与材料表面起伏。","id":"BV1wbv2BXEv4","title":"【中配】揭秘白光干涉测量技术","upper":"AI译片君","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1sAvsBcE16_f1.jpg","t":"~2:00","desc":"复古风格的显微镜/动画画面，呈现黑色剪影状的微型齿轮与连杆机构，字幕强调“却能在宏观世界产生实际效果”。<br>![](..\\raw\\BV1sAvsBcE16_f1.jpg)","note":"点题：MEMS 是尺寸极小的机械电子集成系统，却能在宏观世界产生实际作用。","id":"BV1sAvsBcE16","title":"【中配】微观机械的奇妙世界","upper":"AI译片君","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1sAvsBcE16_f2.jpg","t":"~5:00","desc":"三维动画展示多层硅片经过蚀刻形成“?”形凹槽，字幕提及用光刻技术分阶段选择性轰击硼原子以控制抗蚀能力。<br>![](..\\raw\\BV1sAvsBcE16_f2.jpg)","note":"说明 MEMS 制造工艺与芯片类似，利用光刻和各项异性蚀刻在硅基板上构建三维结构。","id":"BV1sAvsBcE16","title":"【中配】微观机械的奇妙世界","upper":"AI译片君","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1sAvsBcE16_f3.jpg","t": 中国半导体之父【奔流· 张汝京】","upper":"大象放映室","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1SxsEzyEcC_f4.jpg","t":"~14:53","desc":"讲述中芯国际的飞速建设与逆周期扩张：2000年8月打下第一根桩，仅13个月八英寸产线投产（0.25微米）；在互联网泡沫破裂期逆势低价收购二手设备，用“铁皮屋办公室”等省钱妙招；通过分散外资股权（高盛、英飞凌、东芝等）筹集约14亿美元而不失控股权。画面可能展示中芯国际建厂速度与逆周期扩张示意图。<br>![](..\\raw\\BV1SxsEzyEcC_f4.jpg)","note":"中芯国际以极快建厂速度、逆周期扩张与省钱哲学迅速崛起，并以分散持股守住中方控制权。","id":"BV1SxsEzyEcC","title":"“大陆缺什么，我就去做什么。”中国半导体之父【奔流· 张汝京】","upper":"大象放映室","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1SxsEzyEcC_f5.jpg","t":"~18:36","desc":"讲述中芯国际与台积电的专利战：2003年台积电在加州起诉窃取商业机密，2005年和解赔付1.75亿美元并允许台积电检查技术；2006年再诉，北京高院反诉被驳回，2009年美国法院判决中芯再赔2亿美元、割让10%股权，并勒令张汝京辞职，45纳米攻关被迫暂停。画面可能展示诉讼报道与判决书相关新闻。<br>![](..\\raw\\BV1SxsEzyEcC_f5.jpg)","note":"两场惨烈专利战使中芯国际丧失扩张能力，张汝京被迫辞职离开亲手创立的公司。","id":"BV1SxsEzyEcC","title":"“大陆缺什么，我就去做什么。”中国半导体之父【奔流· 张汝京】","upper":"大象放映室","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1SxsEzyEcC_f6.jpg","t":"~22:19","desc":"讲述张汝京离开中芯后的再创业：2014年创办新升半导体攻坚300毫米大硅片，2016年产出国内首根300毫米单晶硅棒（纯度11N）；2018年在青岛创立新恩半导体探索CIM共享制造模式；2022年加入积塔半导体攻关车规芯片；与此同时中芯国际在梁孟松加入后298天攻克14纳米、良率95%，重回正轨。画面可能展示大硅片、车规芯片产线与中芯国际复兴报道。<br>![](..\\raw\\BV1SxsEzyEcC_f6.jpg)","note":"张汝京持续在硅片、共享制造、车规芯片等关键短板创业，中芯国际也在人才加盟后重振国产替代。","id":"BV1SxsEzyEcC","title":"“大陆缺什么，我就去做什么。”中国半导体之父【奔流· 张汝京】","upper":"大象放映室","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1dyW9zsEk1_f1.jpg","t":"~3:56","desc":"回顾Transformer诞生前夜：注意力机制长期只是RNN/CNN的辅助，因“逐字处理”的思维惯性与巨大计算量被人怀疑；2016年谷歌工程师在食堂闲聊时冒出“只靠注意力”的疯狂想法，乌兹（变形金刚铁粉）将其命名为Transformer，团队后来扩大到七人、并有传奇科学家加入。画面可能展示论文作者团队与变形金刚卡通插画。<br>![](..\\raw\\BV1dyW9zsEk1_f1.jpg)","note":"Transformer源于2016年谷歌食堂里“只靠注意力就够了”的灵感，由乌兹命名，打破注意力只能当辅助的成见。","id":"BV1dyW9zsEk1","title":"20分钟读懂AI神级论文《Attention Is All You Need》","upper":"李自然说","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1dyW9zsEk1_f2.jpg","t":"~7:52","desc":"讲解输入处理第一步——词向量：单词被映射进512维空间，含义相近的词彼此靠近；通过向量运算可体现语义关系（如“墨索里尼-意大利+德国”接近“希特勒”、“北京-中国+法国”接近“巴黎”），并以点积/夹角衡量相似度；随后讲到位置编码（token encoding）弥补Transformer无循环结构、不清楚词序的短板。画面可能展示二维词向量平面与向量类比示意图。<br>![](..\\raw\\BV1dyW9zsEk1_f2.jpg)","note":"Transformer先把词转为512维向量以做语义运算，再用位置编码补上词语顺序信息。","id":"BV1dyW9zsEk1","title":"20分钟读懂AI神级论文《Attention Is All You Need》","upper":"李自然说","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1dyW9zsEk1_f3.jpg","t":"~11:48","desc":"拆解注意力机制核心：每个词生成查询Q、键K、值V，用Q与其他词的K匹配、相似则分配更高注意力权重，再据此查看V使自身向量向相关语义“偏移”（如“他”通过“书”的V理解成“层次的著作”）；并引出多头注意力（Multi-head Attention）。画面可能展示Q/K/V匹配与向量偏移的示意图。<br>![](..\\raw\\BV1dyW9zsEk1_f3.jpg)","note":"自注意力通过Q/K/V匹配为每个词分配注意力权重并产生向量偏移，从而形成深层语义理解。","id":"BV1dyW9zsEk1","title":"20分钟读懂AI神级论文《Attention Is All You Need》","upper":"李自然说","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1dyW9zsEk1_f4.jpg","t":"~15:44","desc":"讲解Transformer编码器模块的剩余结构：残差连接把注意力算出的“偏量”加回原始输入，层归一化稳定数据分布便于收敛；位置前馈网络让每个词独立“消化”信息（先升到2048维、ReLU激活、再降回512维）；该模块在原文中堆叠6次。画面可能展示编码器层（注意力→残差/归一化→前馈→残差/归一化）结构图。<br>![](..\\raw\\BV1dyW9zsEk1_f4.jpg)","note":"编码器由注意力、残差连接、层归一化与前馈网络组成，并重复堆叠6层以逐层提炼信息。","id":"BV1dyW9zsEk1","title":"20分钟读懂AI神级论文《Attention Is All You Need》","upper":"李自然说","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1dyW9zsEk1_f5.jpg","t":"~19:40","desc":"讲解解码器如何逐词生成：以起始符start为Q预测出“I”，再把“I”作为新Q预测“Love”，依此生成“I Love You”，并以特殊终止符End结束；训练时用mask“盖住未来答案”防止作弊，输入相比标准答案右移一位（shift right）。画面可能展示解码器自回归生成“I Love You”的逐步流程图与mask示意。<br>![](..\\raw\\BV1dyW9zsEk1_f5.jpg)","note":"解码器以自回归方式逐词生成，并用mask屏蔽未来信息以保证训练有效。","id":"BV1dyW9zsEk1","title":"20分钟读懂AI神级论文《Attention Is All You Need》","upper":"李自然说","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1dyW9zsEk1_f6.jpg","t":"~23:36","desc":"收尾于注意力公式与论文幕后：给出Attention(Q,K,V)=softmax(QKᵀ/√d_k)V并解释缩放因子与加权融合；作者受歌曲（“你需要的是爱”）启发将论文命名为《Attention Is All You Need》（你需要的只是注意力）；论文投往NeurIPS（录用率约20%），三位评审中一人评价中等，结果略显冷清。画面可能展示注意力机制公式与NeurIPS论文海报。<br>![](..\\raw\\BV1dyW9zsEk1_f6.jpg)","note":"视频以注意力公式与论文命名轶事收尾，点出这篇神级论文当初在顶会评审中反响其实相当平淡。","id":"BV1dyW9zsEk1","title":"20分钟读懂AI神级论文《Attention Is All You Need》","upper":"李自然说","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1YBY5zbEwZ_f1.jpg","t":"~0:25","desc":"实验装置特写：灰色 3D 打印支架上固定着 XMC-2400 芯片与透明导管，导管末端有小风车，画面标注 Propeller、Airflow inlet、Airflow direction。<br>![](..\\raw\\BV1YBY5zbEwZ_f1.jpg)","note":"引入现象：指甲盖大小的 MEMS 制冷芯片能吹出足够强的气流推动叶轮，且可反向吸气让叶轮倒转。","id":"BV1YBY5zbEwZ","title":"微小芯片竟能强力吹风推动叶轮？揭秘神奇的制冷芯片","upper":"萌萌战队","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1YBY5zbEwZ_f2.jpg","t":"~1:00","desc":"河面上，戴斗笠的人站在小船上左右摇晃船身，字幕“这就是技术……”小船却逆流远离瀑布。<br>![](..\\raw\\BV1YBY5zbEwZ_f2.jpg)","note":"核心类比：左右不对称摆动可以产生定向推力，为理解薄膜不对称扑动产生定向气流做铺垫。","id":"BV1YBY5zbEwZ","title":"微小芯片竟能强力吹风推动叶轮？揭秘神奇的制冷芯片","upper":"萌萌战队","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1YBY5zbEwZ_f3.jpg","t":"~1:40","desc":"动画展示矩形单元中的两片薄膜，字幕“而膜片还原到平直时就是阀门关闭阻止空气回流”。<br>![](..\\raw\\BV1YBY5zbEwZ_f3.jpg)","note":"解释薄膜兼具“阀门”功能：摆动时打开吸入/排出空气，平直时关闭阻止回流。","id":"BV1YBY5zbEwZ","title":"微小芯片竟能强力吹风推动叶轮？揭秘神奇的制冷芯片","upper":"萌萌战队","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1YBY5zbEwZ_f4.jpg","t":"~2:15","desc":"动画展示两片薄膜从水平状态向上弯折，字幕“膜片需要从水平状态向上弯折”。<br>![](..\\raw\\BV1YBY5zbEwZ_f4.jpg)","note":"揭示定向排气关键：薄膜向上弯折后扑动，沿切线推动空气并借助离心力形成向上的排气流。","id":"BV1YBY5zbEwZ","title":"微小芯片竟能强力吹风推动叶轮？揭秘神奇的制冷芯片","upper":"萌萌战队","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1YBY5zbEwZ_f5.jpg","t":"~2:50","desc":"俯视动画展示多个薄膜单元以数 GHz 频率同步振动，字幕“那么当两个膜片以数 G 赫兹振动时”。<br>![](..\\raw\\BV1YBY5zbEwZ_f5.jpg)","note":"说明高频振动：超声波频率使芯片静音运行，并脉冲式地持续吸/排气。","id":"BV1YBY5zbEwZ","title":"微小芯片竟能强力吹风推动叶轮？揭秘神奇的制冷芯片","upper":"萌萌战队","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1YBY5zbEwZ_f6.jpg","t":"~3:25","desc":"芯片爆炸图：绿色底座上是排列成阵列的 8 个黄色发光吹风单元，字幕“芯片排气流的速度大致是膜片尖端速度的平方”。<br>![](..\\raw\\BV1YBY5zbEwZ_f6.jpg)","note":"总结结构：8 个单元集成在芯片中，排气流速与膜片尖端速度平方成正比，因此小功耗也能获得较大气流。","id":"BV1YBY5zbEwZ","title":"微小芯片竟能强力吹风推动叶轮？揭秘神奇的制冷芯片","upper":"萌萌战队","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Caazz2EYo_f1.jpg","t":"~0:56","desc":"回顾抗战前汉字美术字与现代西方Art Deco装饰艺术风格的融合，以及九一八事变后日本侵略者轰炸出版社、破坏古籍与铅字铜模，出版界遭受重创。画面可能展示抗战前的美术字设计稿与Art Deco风格示例。<br>![](..\\raw\\BV1Caazz2EYo_f1.jpg)","note":"抗战前汉字美术字在与西方现代美术对话中建立现代方法论，而九一八后出版印刷业遭日军严重破坏。","id":"BV1Caazz2EYo","title":"抗日战争时期的字体","upper":"oooooohmygosh","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1Caazz2EYo_f2.jpg","t":"~1:52","desc":"讲述美术字走出商业广告、以艺术表达参与抗战：大量鼓舞人心的口号标语与记录日军暴行的出版物出现，字体设计的核心诉求变为传达清晰、有力、坚定的声音。画面可能展示抗战时期的标语与出版物照片。<br>![](..\\raw\\BV1Caazz2EYo_f2.jpg)","note":"抗战时期字体设计以精神传达为首要目标，美术字成为鼓舞民心、记录暴行的有力工具。","id":"BV1Caazz2EYo","title":"抗日战争时期的字体","upper":"oooooohmygosh","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1Caazz2EYo_f3.jpg","t":"~2:48","desc":"讲钟灵在延安城墙书写“工人农民联合起来，争取抗日胜利”标语，为美观选用生僻字形，毛主席批评其“为老百姓写标语”不应这样写，要“看对象”。画面可能展示延安城墙标语或相关历史图片。<br>![](..\\raw\\BV1Caazz2EYo_f3.jpg)","note":"毛主席以钟灵的标语为例，强调宣传要看对象，美术字形式的探索须服从易读性与受众理解。","id":"BV1Caazz2EYo","title":"抗日战争时期的字体","upper":"oooooohmygosh","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1Caazz2EYo_f4.jpg","t":"~3:43","desc":"继续钟灵的故事：毛主席指出隶书、篆书、狂草等书法艺术应尊重传统写法，自己批评的只是“用不是地方”；书中也提出美术字形式变化须有边界，否则令人认不出本貌。画面可能展示相关美术字技法书页。<br>![](..\\raw\\BV1Caazz2EYo_f4.jpg)","note":"美术字在自由探索中逐渐觉醒“须有边界”的规范意识，形式变化不能脱离可识别性。","id":"BV1Caazz2EYo","title":"抗日战争时期的字体","upper":"oooooohmygosh","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1Caazz2EYo_f5.jpg","t":"~4:39","desc":"介绍当时宋体的三种分类：古宋体（灯笼体）、仿宋体（线装书用，秀丽）、大宋体（又称民主体，笔画粗、端庄、易读、铿锵有力）。画面可能展示三种宋体字样对比。<br>![](..\\raw\\BV1Caazz2EYo_f5.jpg)","note":"大宋体因易读且铿锵有力，成为团结人心的“旗帜”，让字体超越信息载体而凝聚民族意志。","id":"BV1Caazz2EYo","title":"抗日战争时期的字体","upper":"oooooohmygosh","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1Caazz2EYo_f6.jpg","t":"~5:35","desc":"讲述当时大宋体标语多靠手工：写字、剪下、贴到红布上，故笔画常互相连接；新中国成立后，当年受批评的钟灵用大宋体制作了高悬天安门“中华人民共和国万岁”等灯箱。画面可能展示手工标语制作与天安门灯箱。<br>![](..\\raw\\BV1Caazz2EYo_f6.jpg)","note":"在简陋工具下设计师凭经验建立方法论，抗战中发展出的字体知识传承至今，并登上新中国天安门。","id":"BV1Caazz2EYo","title":"抗日战争时期的字体","upper":"oooooohmygosh","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV16zehzdEDz_f1.jpg","t":"~1:54","desc":"引入主题：柔光屏与类纸膜都属于抗反射抗眩光技术，但类纸膜会因粗糙表面产生“闪点”彩色噪点，严重劣化显示效果。画面可能展示类纸膜与柔光屏的对比特写。<br>![](..\\raw\\BV16zehzdEDz_f1.jpg)","note":"类纸膜通过粗糙表面增大书写摩擦力，却带来明显闪点、损害画质，得不偿失。","id":"BV16zehzdEDz","title":"「柔光屏」还是「类纸膜」？终于有人说清楚了……","upper":"谐门东西","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV16zehzdEDz_f2.jpg","t":"~3:48","desc":"解释“闪点”的成因：屏幕像素光线在不规则磨砂表面发生随机折射、衍射与散射，像素密度越高、与磨砂微结构尺寸越接近，闪点越明显。画面可能展示显微镜下的闪点噪点。<br>![](..\\raw\\BV16zehzdEDz_f2.jpg)","note":"闪点源于像素结构与磨砂表面空间频率接近产生的类摩尔纹噪声，高PPI设备上更明显。","id":"BV16zehzdEDz","title":"「柔光屏」还是「类纸膜」？终于有人说清楚了……","upper":"谐门东西","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV16zehzdEDz_f3.jpg","t":"~5:42","desc":"揭晓苹果纳米纹理玻璃的原理：康宁专利与论文显示，用弱酸浸泡使金属离子交换、表面收缩开裂形成纳米纹理，再以碱液化学抛光使起伏平缓。画面可能展示康宁电镜成像图。<br>![](..\\raw\\BV16zehzdEDz_f3.jpg)","note":"苹果纳米纹理玻璃采用纯化学蚀刻，在避免深窄沟壑的前提下形成平缓纳米粗糙纹理以消除闪点。","id":"BV16zehzdEDz","title":"「柔光屏」还是「类纸膜」？终于有人说清楚了……","upper":"谐门东西","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV16zehzdEDz_f4.jpg","t":"~7:37","desc":"介绍华为Mate系列采用光刻法制造高精度纳米蚀刻柔光屏：用光刻图案保护、酸蚀刻出浅凹坑，通过控制曝光图案与蚀刻深度精确调控表面形貌。画面可能展示显微镜下的光刻纹理。<br>![](..\\raw\\BV16zehzdEDz_f4.jpg)","note":"华为用光刻法实现可精确设计的纳米纹理，能更好控制闪点，被视为国产厂商首次正面对标苹果纳米玻璃。","id":"BV16zehzdEDz","title":"「柔光屏」还是「类纸膜」？终于有人说清楚了……","upper":"谐门东西","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV16zehzdEDz_f5.jpg","t":"~9:31","desc":"进一步介绍更进阶方案：京东方专利的抗眩光夹层在像素与盖板间加入两种不同折射率透明材料构成的层（类似光纤）限制光线角度；联想拯救者超控板先后试遍多种技术。画面可能展示夹层结构示意图。<br>![](..\\raw\\BV16zehzdEDz_f5.jpg)","note":"除管控最外层形貌外，还可在像素出射角度上做文章，用抗眩光夹层限制光线偏折来抑制闪点。","id":"BV16zehzdEDz","title":"「柔光屏」还是「类纸膜」？终于有人说清楚了……","upper":"谐门东西","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV16zehzdEDz_f6.jpg","t":"~11:25","desc":"总结：柔光屏大幅提升抗眩光能力，收益大于微小画质损失；书写手感靠可换弹性笔尖弥补；华为平板与iPad Pro还将AR抗反射镀膜与柔光屏结合形成“连招”。画面可能展示柔光屏加AR镀膜对比。<br>![](..\\raw\\BV16zehzdEDz_f6.jpg)","note":"柔光屏值得重度用户选配，且与AR抗反射镀膜结合可进一步压制反射，书写体验由笔尖材质补足。","id":"BV16zehzdEDz","title":"「柔光屏」还是「类纸膜」？终于有人说清楚了……","upper":"谐门东西","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1bzgizZEsS_f1.jpg","t":"~0:41","desc":"开篇纠正误区：带ADHD学习不是因为懒惰、愚蠢或“坏掉了”，而是大脑天生渴望刺激、新鲜感与多巴胺，枯燥的学习无法提供这些，大脑就会“开小差”。画面可能展示“你不是懒，你只是需要刺激”之类的标题卡。<br>![](..\\raw\\BV1bzgizZEsS_f1.jpg)","note":"ADHD学习困难并非懒惰，而是大脑对刺激与多巴胺的渴求未被满足，需顺势而为而非对抗。","id":"BV1bzgizZEsS","title":"如何带着ADHD学习（即便无法静坐5分钟）【学习方法02】","upper":"喵的艺术","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1bzgizZEsS_f2.jpg","t":"~1:21","desc":"介绍第一套方法“化整为零”：放弃两小时长时段，改用“5-10-5法”——5分钟规划任务、10分钟高强度专注（手机开飞行模式、单任务）、5分钟用歌曲/活动/零食作为多巴胺奖励的休息。画面可能展示5-10-5时间块示意图。<br>![](..\\raw\\BV1bzgizZEsS_f2.jpg)","note":"用“5-10-5冲刺法”以短时段高强度学习替代马拉松式久坐，效率反而更高。","id":"BV1bzgizZEsS","title":"如何带着ADHD学习（即便无法静坐5分钟）【学习方法02】","upper":"喵的艺术","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1bzgizZEsS_f3.jpg","t":"~2:02","desc":"介绍第二套方法“变换学习地点”：每天同一张桌子会让大脑麻木，而从书桌到地板、阳台，甚至楼梯间切换位置能带来“情境新鲜感”；建议每20–30分钟换一次位置，或在家中布置2–3个学习角。画面可能展示多个学习场景拼接。<br>![](..\\raw\\BV1bzgizZEsS_f3.jpg)","note":"利用“情境新鲜感”，频繁更换学习位置可重新激活ADHD大脑的注意力。","id":"BV1bzgizZEsS","title":"如何带着ADHD学习（即便无法静坐5分钟）【学习方法02】","upper":"喵的艺术","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1bzgizZEsS_f4.jpg","t":"~2:42","desc":"介绍把学习“游戏化”：用计时器挑战限时、记积分与经验值、像设计社交网格一样给笔记配色、把卡片当成闯关，并用思维导图、涂鸦、流程图等视觉化方式取代被动阅读。画面可能展示游戏化学习清单与彩色笔记示例。<br>![](..\\raw\\BV1bzgizZEsS_f4.jpg)","note":"将学习设计成游戏（积分、XP、视觉化笔记）比被动阅读更能抓住ADHD大脑的注意力。","id":"BV1bzgizZEsS","title":"如何带着ADHD学习（即便无法静坐5分钟）【学习方法02】","upper":"喵的艺术","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1bzgizZEsS_f5.jpg","t":"~3:23","desc":"强调“经常动起来”：休息时做深蹲、使用减压玩具或压力球、用站立式书桌（或用书堆一个），因为身体活动能调节情绪、平复ADHD的混乱。画面可能展示边深蹲边学习或站立书桌的场景。<br>![](..\\raw\\BV1bzgizZEsS_f5.jpg)","note":"运动能调节情绪、安抚ADHD的内在混乱，学习中应穿插肢体活动而非强求静坐。","id":"BV1bzgizZEsS","title":"如何带着ADHD学习（即便无法静坐5分钟）【学习方法02】","upper":"喵的艺术","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1bzgizZEsS_f6.jpg","t":"~4:03","desc":"收尾于“一个标签页、一项任务、一个目标”：ADHD擅长多任务却难完成，需关闭多余页面专注单一事项；并总结——带ADHD学习不是更努力，而是顺着大脑特性更聪明地设计学习世界，把学习变成大脑想玩的“游戏”。画面可能展示“one tab, one task, one goal”标语卡。<br>![](..\\raw\\BV1bzgizZEsS_f6.jpg)","note":"用“单任务专注”原则收束，核心结论是带ADHD学习要顺应大脑、把学习设计成可投入的游戏而非硬逼自律。","id":"BV1bzgizZEsS","title":"如何带着ADHD学习（即便无法静坐5分钟）【学习方法02】","upper":"喵的艺术","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV13Bu3zbERh_f1.jpg","t":"~1:01","desc":"闲鱼交易聊天截图：页面显示价格¥180.00，买家与卖家协商地址、电话、定位，字幕显示'所以她给姐姐打电话确认一下我什么时候去买缝纫机能好一些'。<br>![](..\\raw\\BV13Bu3zbERh_f1.jpg)","note":"低价入手源头：二手平台议价、约时间取货，是整个修复故事的起点。","id":"BV13Bu3zbERh","title":"在某鱼买到一台蝴蝶牌缝纫机，1970年生产，经典中的经典。#缝纫机#70年代的回忆 #老式缝纫机保养 #机械原理 #老古董","upper":"ai益达i","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV13Bu3zbERh_f2.jpg","t":"~3:03","desc":"一只手捏着一块白色布料，布面有黑/白缝纫线迹，字幕'这缝纫机是真好使'。<br>![](..\\raw\\BV13Bu3zbERh_f2.jpg)","note":"修复后试缝效果展示，证明机械功能恢复、走线正常。","id":"BV13Bu3zbERh","title":"在某鱼买到一台蝴蝶牌缝纫机，1970年生产，经典中的经典。#缝纫机#70年代的回忆 #老式缝纫机保养 #机械原理 #老古董","upper":"ai益达i","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV13Bu3zbERh_f3.jpg","t":"~5:05","desc":"俯拍缝纫机木质台面与铸铁底座，手指向侧面的抽屉/收纳空间，字幕'可以装一些格尺橡皮'。<br>![](..\\raw\\BV13Bu3zbERh_f3.jpg)","note":"老式缝纫机桌的结构设计：木质台面+铸铁支架+脚踏传动+侧边储物抽屉。","id":"BV13Bu3zbERh","title":"在某鱼买到一台蝴蝶牌缝纫机，1970年生产，经典中的经典。#缝纫机#70年代的回忆 #老式缝纫机保养 #机械原理 #老古董","upper":"ai益达i","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV13Bu3zbERh_f4.jpg","t":"~7:07","desc":"黑色蝴蝶牌缝纫机机头特写，手持白色油壶往针杆区域滴油，字幕'针杆'。<br>![](..\\raw\\BV13Bu3zbERh_f4.jpg)","note":"机械保养核心步骤：给针杆、压脚杆等运动部位加注缝纫机油，恢复顺滑。","id":"BV13Bu3zbERh","title":"在某鱼买到一台蝴蝶牌缝纫机，1970年生产，经典中的经典。#缝纫机#70年代的回忆 #老式缝纫机保养 #机械原理 #老古董","upper":"ai益达i","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV13Bu3zbERh_f5.jpg","t":"~9:09","desc":"在缝纫机底部/支架处用活动扳手配合螺丝刀拧紧零部件，字幕提示'一字螺丝刀的拧紧力度不要 w\\BV1JfNqzKEyF_f5.jpg)","note":"总结玄戒 O1 的设计投入：四年半研发、500 多次版图迭代、2500 人团队。","id":"BV1JfNqzKEyF","title":"放大20万倍，这是3纳米芯片最深层的秘密【玄戒O1解剖报告】","upper":"谈三圈","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1JfNqzKEyF_f6.jpg","t":"~17:00","desc":"动画对比：芯片剖面与“2 微米 ≈ 杆菌”尺寸对照，字幕“我们切开的这 20 微米”。<br>![](..\\raw\\BV1JfNqzKEyF_f6.jpg)","note":"尺度震撼：仅 20 微米厚的切片内，浓缩了芯片产业四十年的技术积累。","id":"BV1JfNqzKEyF","title":"放大20万倍，这是3纳米芯片最深层的秘密【玄戒O1解剖报告】","upper":"谈三圈","coll":"kepu","type":"visual"},{"img":"projects/bilibili-kb/kepu/raw/BV1yB7aztECc_f1.jpg","t":"~4:29","desc":"介绍芯片开发层级（自研、完全外包的系统级方案被比作预制菜），并讲解ARM的四种授权模式——架构授权（自由度最高，仅苹果、高通、英伟达、华为海思等极少数采用）、IP授权、灵活订阅、计算子系统授权<br>![](..\\raw\\BV1yB7aztECc_f1.jpg)","note":"视频先铺垫芯片自研程度的层级与ARM授权体系，为揭晓玄戒O1的定位做铺垫。","id":"BV1yB7aztECc","title":"【全网最深度解读】小米玄戒O1：一场输不起的芯片战争","upper":"老石谈芯","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1yB7aztECc_f2.jpg","t":"~8:57","desc":"说明小米通过自研ISP等关键模块结合ARM公版CPU/GPU取得好结果，体现其在系统级与功能模块的自研掌控；并解读2025年1月美国BIS出口管制新规——小米不在白名单，但玄戒O1晶体管190亿（小于300亿上限）、封测交白名单企业，故能流片<br>![](..\\raw\\BV1yB7aztECc_f2.jpg)","note":"玄戒O1靠系统集成加自研模块策略跑通首颗大芯片，并借符合美出口管制阈值实现流片。","id":"BV1yB7aztECc","title":"【全网最深度解读】小米玄戒O1：一场输不起的芯片战争","upper":"老石谈芯","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1yB7aztECc_f3.jpg","t":"~13:26","desc":"讲解一颗SoC从需求定义（定下CPU主频、GPU与NPU算力等目标）到架构设计文档，再到前端设计（用硬件描述语言写RTL并大量仿真），最后后端设计（逻辑综合、物理设计、签核验证）的完整流程<br>![](..\\raw\\BV1yB7aztECc_f3.jpg)","note":"芯片设计遵循需求、架构、前端RTL、后端物理实现与签核的标准流程，玄戒O1亦按此推进。","id":"BV1yB7aztECc","title":"【全网最深度解读】小米玄戒O1：一场输不起的芯片战争","upper":"老石谈芯","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1yB7aztECc_f4.jpg","t":"~17:54","desc":"解读玄戒O1的CPU设计：四丛集十核（2颗X925超大核、4颗A725大核、2颗A725能效核、2颗A520小核）；对比骁龙8至尊版两丛集无能效核，小米因没有自研内核、且手机八成时间处中低负载，故选用低功耗大核加小核组合，代价是调度更复杂<br>![](..\\raw\\BV1yB7aztECc_f4.jpg)","note":"玄戒O1采用四丛集十核以兼顾中低负载能效，反映其尚无自研内核、须用ARM公版能效核的现实。","id":"BV1yB7aztECc","title":"【全网最深度解读】小米玄戒O1：一场输不起的芯片战争","upper":"老石谈芯","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1yB7aztECc_f5.jpg","t":"~22:23","desc":"梳理小米自研ISP演进（澎湃C1到C3），玄戒O1搭载第四代自研SP，采用三段式流水线（去马赛克修正、HDR融合降噪色调映射、电子防抖色彩增强）以降功耗；支持单摄2亿像素、三摄同拍，多帧HDR与AI降噪使夜景信噪比最高提升20倍<br>![](..\\raw\\BV1yB7aztECc_f5.jpg)","note":"玄戒O1集成的第四代自研ISP以三段流水与硬件AI单元显著提升影像与能效，是其差异化亮点。","id":"BV1yB7aztECc","title":"【全网最深度解读】小米玄戒O1：一场输不起的芯片战争","upper":"老石谈芯","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1yB7aztECc_f6.jpg","t":"~26:51","desc":"介绍玄戒O1提升主频的三种方法——重设计供电网络缩短关键路径、自研3纳米标准单元与计算单元、人工优化版图（耗时4个多月迭代）；并说明其在SoC级设计四种功耗模式（深度睡眠、息屏感知、后台、亮屏）以控功耗<br>![](..\\raw\\BV1yB7aztECc_f6.jpg)","note":"玄戒O1通过供电网络重设计、3纳米标准单元自研与人工版图优化拉高主频，并以多级功耗模式守住能效底线。","id":"BV1yB7aztECc","title":"【全网最深度解读】小米玄戒O1：一场输不起的芯片战争","upper":"老石谈芯","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1Ny7sz3Ewf_f1.jpg","t":"~2:07","desc":"开场点出中国最大群岛舟山由两千零八十五个山头孤悬海外组成，海水隔绝了交通、供电与水源；抛出中国不允许孤岛存在的主线，并预告将前往最北的嵊泗县，与美的空调一起完成一项神秘任务。<br>![](..\\raw\\BV1Ny7sz3Ewf_f1.jpg)","note":"舟山是被海水隔绝的最大群岛，本期主题是这场超级大连接。","id":"BV1Ny7sz3Ewf","title":"没路、没电、没水……又怎样？中国不允许孤岛存在！【浙江·舟山群岛篇】","upper":"星球研究所","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Ny7sz3Ewf_f2.jpg","t":"~4:15","desc":"展开公路连接：1999年舟山以当年财政收入二十多倍为赌注修建跨海公路，西堠门大桥以一千六百五十米跨度一跨而过、曾雄霸中国桥梁跨度榜首十年，连同金塘、岑港等桥形成约五十公里总长；此后余山、周岱等桥依次把诸岛相连，东海大桥更连起上海小洋山，逐步把群岛变成半岛；并预告未来杭州湾上将出现通行汽车与高铁的超级大通道。<br>![](..\\raw\\BV1Ny7sz3Ewf_f2.jpg)","note":"跨海大桥群把舟山诸岛连成半岛，西堠门大桥曾居中国跨度榜首。","id":"BV1Ny7sz3Ewf","title":"没路、没电、没水……又怎样？中国不允许孤岛存在！【浙江·舟山群岛篇】","upper":"星球研究所","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Ny7sz3Ewf_f3.jpg","t":"~6:22","desc":"介绍高铁连接：头顶五十多米处有万吨巨轮驶过，海底隧道由直径近十五米的定海号盾构机在北斗系统指引下同向掘进、精准对接，打通长达十六点一八公里的世界最长海底高铁隧道；并点出高速公路与高铁是主动脉，而渡轮才是连接百人以上居住岛的毛细血管。<br>![](..\\raw\\BV1Ny7sz3Ewf_f3.jpg)","note":"定海号盾构机打通世界最长海底高铁隧道，渡轮是群岛的毛细血管。","id":"BV1Ny7sz3Ewf","title":"没路、没电、没水……又怎样？中国不允许孤岛存在！【浙江·舟山群岛篇】","upper":"星球研究所","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Ny7sz3Ewf_f4.jpg","t":"~8:30","desc":"转向电力连接：在岛屿间狭窄通道利用最大四点五米每秒的强劲洋流建设潮流能发电，其连续平稳发电时长据称位列世界第一；更关键的是从宁波出发、绵延五十多公里、一跨两千六百五十六米的全国最大跨海联网工程，把舟山接入华东电网、供应全市近一半用电，再用五座换流站与两百八十三公里线路把各岛相连。<br>![](..\\raw\\BV1Ny7sz3Ewf_f4.jpg)","note":"潮流能发电加跨海联网工程，让舟山接入华东电网、用上近半外来电。","id":"BV1Ny7sz3Ewf","title":"没路、没电、没水……又怎样？中国不允许孤岛存在！【浙江·舟山群岛篇】","upper":"星球研究所","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Ny7sz3Ewf_f5.jpg","t":"~10:37","desc":"讲水源连接：尽管九成面积是海洋，舟山却是人均水资源仅约全国五分之一的淡水孤岛，2003年大旱曾以三十元一吨高价船运淡水；如今靠含七层反渗透膜的海水淡化厂提供七成工业用水，又建黄金湾水库并借两百三十多公里管线、六座泵站组成舟山大陆引水工程，每年调上亿吨淡水（相当于九个西湖），嵊泗更从上海跨山入海引水。<br>![](..\\raw\\BV1Ny7sz3Ewf_f5.jpg)","note":"海水淡化加跨海引水工程破解舟山的淡水孤岛困境。","id":"BV1Ny7sz3Ewf","title":"没路、没电、没水……又怎样？中国不允许孤岛存在！【浙江·舟山群岛篇】","upper":"星球研究所","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1Ny7sz3Ewf_f6.jpg","t":"~12:45","desc":"收尾升华：每座海岛县都被大陆之水覆盖，长江畔与东海之人从此共饮一江水；在这场超级大连接下，舟山拥有世界货物吞吐量最大的港口、第二个离岛型绿色石化基地与第一大渔场，梭子蟹、贻贝、对虾、鲳鱼等海产走向全球，同时仍保有水鸟栖息地、观音道场与百万舟山人的家园，千岛终不再孤寂。<br>![](..\\raw\\BV1Ny7sz3Ewf_f6.jpg)","note":"超级大连接让千岛不再孤寂，舟山由此连入世界。","id":"BV1Ny7sz3Ewf","title":"没路、没电、没水……又怎样？中国不允许孤岛存在！【浙江·舟山群岛篇】","upper":"星球研究所","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV13jGQz2EHR_f1.jpg","t":"~0:53","desc":"标题画面：黑底星空与地球弧线，大字'磁悬浮 不止地表飞行'，英文副标题'MAGLEV: BEYOND FLYING ON THE GROUND'，底部有新华社、仰望、星球研究所三方标识。<br>![](..\\raw\\BV13jGQz2EHR_f1.jpg)","note":"点明主题：磁悬浮不仅是高速列车，更代表一种'地表飞行'及跨领域技术平台。","id":"BV13jGQz2EHR","title":"地表最强飞行器来袭！","upper":"仰望汽车","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV13jGQz2EHR_f2.jpg","t":"~2:38","desc":"特写：戴蓝色手套的手正在旋转实验电源/电流源旋钮，设备上有红色指示灯和'CURRENT''OUTPUT'字样。<br>![](..\\raw\\BV13jGQz2EHR_f2.jpg)","note":"电磁铁/线圈的电流控制是磁悬浮核心：通过调节电流改变磁场强度，实现可控悬浮。","id":"BV13jGQz2EHR","title":"地表最强飞行器来袭！","upper":"仰望汽车","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV13jGQz2EHR_f3.jpg","t":"~4:23","desc":"航拍上海城市天际线日落景象，画面叠加中英文字幕'除了利用轨道上的移动磁场驱动列车'。<br>![](..\\raw\\BV13jGQz2EHR_f3.jpg)","note":"城市背景下引出直线电机推进原理：轨道上 硝胺，熟石灰更会加剧DNA损伤。<br>![](..\\raw\\BV1SNLzzjEWB_f3.jpg)","note":"粗纤维摩擦致黏膜纤维性变且不可逆，槟榔碱等化学成分诱导基因突变。","id":"BV1SNLzzjEWB","title":"槟榔产业：用生命代价铸压的染血勋章！","upper":"中国食品报融媒体","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1SNLzzjEWB_f4.jpg","t":"~7:14","desc":"用数据呈现危害规模：中国超九成槟榔产自海南、九成供湖南，湖南咀嚼率达38.4%且为口腔癌重灾区；湘雅医院等研究显示2006至2016年长沙五所医院口腔癌患者11882人中嚼槟榔者占69.2%，并预测2030年湖南相关患者累计超30万、全国超100万、医疗负担超2000亿元；嚼槟榔患癌风险为一般人群28倍，吸烟加嚼槟榔升至89倍、再加饮酒达123倍。<br>![](..\\raw\\BV1SNLzzjEWB_f4.jpg)","note":"湖南口腔癌与嚼槟榔高度相关，叠加吸烟饮酒风险最高达123倍。","id":"BV1SNLzzjEWB","title":"槟榔产业：用生命代价铸压的染血勋章！","upper":"中国食品报融媒体","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1SNLzzjEWB_f5.jpg","t":"~9:03","desc":"讲述患病后果：口腔癌多以手术切除治疗，晚期需“割脸”，舌癌半舌甚至全舌切除、牙龈癌切骨致面部塌陷；术后常取前臂皮或小腿骨修复，超半数患者术后复发死亡、五年生存率仅约50%；并以《槟榔王国中的割脸人》中刘桑国左脸被割除、失明且癌转移的个案警示，同时指出嚼槟榔对牙齿的影响是百分之百的（磨耗、染色、牙周病），且具成瘾性。<br>![](..\\raw\\BV1SNLzzjEWB_f5.jpg)","note":"口腔癌晚期需割脸、预后极差，且槟榔对牙齿损害与成瘾性近乎百分之百。","id":"BV1SNLzzjEWB","title":"槟榔产业：用生命代价铸压的染血勋章！","upper":"中国食品报融媒体","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1SNLzzjEWB_f6.jpg","t":"~10:51","desc":"揭示成瘾与监管拉锯：槟榔碱属中枢兴奋剂，单纯嚼食也有约七成人群出现物质依赖；所谓“枸杞养生槟榔”并未降低槟榔碱、不会减害；上世纪八十年代起医学界呼吁管控，简新春医生甚至收到八十万元买人头的死亡威胁；2021年广电总局叫停广告、2022年多地禁以食品名义销售，但海南、湖南产业链呼吁留空间；2020年产业产值已超七百亿元、海南二百三十万农民依赖此收入，这颗一类致癌物仍在民生与监管的夹缝中生长，终成“染血的勋章”。<br>![](..\\raw\\BV1SNLzzjEWB_f6.jpg)","note":"槟榔成瘾普遍、监管与产业拉锯，产值超七百亿却以健康为代价成染血勋章。","id":"BV1SNLzzjEWB","title":"槟榔产业：用生命代价铸压的染血勋章！","upper":"中国食品报融媒体","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1GgAmepEjQ_f1.jpg","t":"~1:36","desc":"开头以“五觉”调侃电脑娱乐：视觉听觉好懂，嗅觉指早期CRT开机散发的塑料与电路板混合味，味觉玩笑说有人舔过早期鼠标下的灰球，触觉即键鼠打游戏；点明本期讲视觉与听觉，即90年代电脑装了哪些播放器，并抛出“连AI也答不出90年代有啥播放器”的题眼。<br>![](..\\raw\\BV1GgAmepEjQ_f1.jpg)","note":"以五觉调侃电脑娱乐，引出本期主题——90年代播放器，连AI都答不出。","id":"BV1GgAmepEjQ","title":"AI答不出之“90年代都有什么播放器？”","upper":"流章点漆","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1GgAmepEjQ_f2.jpg","t":"~3:13","desc":"进入DOS时代（90–93年）：软盘太小放不下MP3，主要听CD、播WAV；DOS下播CD需先装光驱与鼠标驱动，播放器界面简陋、由点线色块构成，但可在后台播放，也有模仿碟机、能直接选曲的播放器；DOS下还能用Quick View等软件播放VCD所用的MPG视频。<br>![](..\\raw\\BV1GgAmepEjQ_f2.jpg)","note":"DOS时代以听CD为主、界面简陋，但已能后台播放并用Quick View看VCD。","id":"BV1GgAmepEjQ","title":"AI答不出之“90年代都有什么播放器？”","upper":"流章点漆","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1GgAmepEjQ_f3.jpg","t":"~4:49","desc":"进入Windows 3.1时代（93–95年）：图形界面让听歌看片更容易，系统内置媒体播放器；创新声霸卡驱动自带分CD/MIDI/WAV运行的拟物化播放器，OPTS卡也有集成程序；看视频以软解VCD的“性MPG Player”最知名，另有靠快捷键操作、被称为无界面操作系统的腾图影视97，以及超级解霸3.0的前身金山解霸2.0。<br>![](..\\raw\\BV1GgAmepEjQ_f3.jpg)","note":"Win3.1内置媒体播放器，软解VCD的MPG Player为王，腾图影视97主打快捷键。","id":"BV1GgAmepEjQ","title":"AI答不出之“90年代都有什么播放器？”","upper":"流章点漆","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1GgAmepEjQ_f4.jpg","t":"~6:26","desc":"讲到Windows 9x时代的音频播放器，最知名的是WinAMP：0.2 beta版仅是工具条、只能播MP3，0.97版接近主流但仍缺播放列表与均衡器，真正主流的2.24版才开始支持播CD与联网检索CD数据库下载歌曲信息；此外还有系统自带CD播放器、韩国全能型JET Audio，以及创新声卡驱动附带的播放器（ISA与PCI声卡界面不同）。<br>![](..\\raw\\BV1GgAmepEjQ_f4.jpg)","note":"Win9x音频以WinAMP为主，2.24版才完善CD播放与联网功能。","id":"BV1GgAmepEjQ","title":"AI答不出之“90年代都有什么播放器？”","upper":"流章点漆","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1GgAmepEjQ_f5.jpg","t":"~8:02","desc":"进入Windows 9x的视频与流媒体：此时播放器音视频界限已模糊、多为全能型；RealPlayer从5.2支持视频、提供新闻/体育等频道，6.0 JR改善窄带音质，8.0起什么都支持，Windows Media Player也能抓CD转MP3/WMA，但WMP因版权不支Real格式；超级解霸3.0（尚无“豪杰”二字）播VCD并号称有防卡读的Direct CD重放，5.5版附赠豪杰DVD试用版并支持MMX指令集。<br>![](..\\raw\\BV1GgAmepEjQ_f5.jpg)","note":"Win9x播放器趋向全能，RealPlayer与超级解霸3.0流行，WMP因版权不支Real。","id":"BV1GgAmepEjQ","title":"AI答不出之“90年代都有什么播放器？”","upper":"流章点漆","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1GgAmepEjQ_f6.jpg","t":"~9:39","desc":"收尾讲DVD播放：豪杰DVD试用版不支持导航菜单，真正看DVD多用98年诞生的PowerDVD 1.3（拟物化界面、能选菜单与花絮、实时切换字幕和音轨），且PowerDVD至今仍是蓝光原盘首选，而超级解霸、东方影都、金山解霸都已消失；最后呼应开头——90年代播放器连熟悉的版本都没赶上，这种问题问AI毫无用处，它答不出来。<br>![](..\\raw\\BV1GgAmepEjQ_f6.jpg)","note":"看DVD靠PowerDVD，诸多老播放器已消亡，呼应“AI答不出90年代播放器”的题眼。","id":"BV1GgAmepEjQ","title":"AI答不出之“90年代都有什么播放器？”","upper":"流章点漆","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1UgNdeGEK6_f1.jpg","t":"~0:34","desc":"解释星星“闪烁”的成因：夜空星光穿过地球大气层时，冷暖气流混合造成的湍流使其光学特性不断混乱变化，加上色散，恒星的亮度、位置甚至颜色都会改变，给地面望远镜观测暗淡天体带来困难。画面可能展示大气湍流导致星点抖动的示意动画。<br>![](..\\raw\\BV1UgNdeGEK6_f1.jpg)","note":"我们看到的星星闪烁其实是地球大气湍流造成的失真，并非恒星本来面目，这给天文观测带来困扰。","id":"BV1UgNdeGEK6","title":"为什么天文台需要激光发射器","upper":"九霄君_停更ing","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1UgNdeGEK6_f2.jpg","t":"~1:08","desc":"介绍消除大气折射的主流方案——自适应光学技术：原理是让望远镜镜面“再扭曲一次”以抵消失真；镜面由薄金属制成，背面装有磁铁矩阵，可极快且精确地改变镜面曲率来补偿大气扭曲。画面可能展示自适应光学镜面与磁铁矩阵结构图。<br>![](..\\raw\\BV1UgNdeGEK6_f2.jpg)","note":"自适应光学通过可变形镜面（薄金属+磁铁矩阵）实时改变曲率，反向补偿大气造成的失真。","id":"BV1UgNdeGEK6","title":"为什么天文台需要激光发射器","upper":"九霄君_停更ing","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1UgNdeGEK6_f3.jpg","t":"~1:42","desc":"说明自适应光学需要“导星”作为参照：选取一颗已知特性的恒星，计算机根据其被大气扭曲的图像自动调整镜面，使目标星光反射后得到近乎无失真图像；而所需扭曲会随观测时间、地点、大气状况而变。画面可能展示以导星校准望远镜镜面的流程图。<br>![](..\\raw\\BV1UgNdeGEK6_f3.jpg)","note":"自适应光学需以已知特性的“导星”为基准，由计算机实时计算并调整镜面形状。","id":"BV1UgNdeGEK6","title":"为什么天文台需要激光发射器","upper":"九霄君_停更ing","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1UgNdeGEK6_f4.jpg","t":"~2:15","desc":"回答“若观测天区没有合适导星怎么办”：这时就需要激光——向天空发射波长589纳米的激光，它能几乎无损耗穿透大气，直达约90公里高中间层的钠层。画面可能展示激光束射向高空钠层的实景或示意。<br>![](..\\raw\\BV1UgNdeGEK6_f4.jpg)","note":"当天区缺少天然导星时，天文台用589纳米激光在约90公里高的钠层“造”出一颗人造导星。","id":"BV1UgNdeGEK6","title":"为什么天文台需要激光发射器","upper":"九霄君_停更ing","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1UgNdeGEK6_f5.jpg","t":"~2:49","desc":"解释激光导星的生成机制：钠层富含钠原子（疑为流星体燃烧遗留），会吸收589纳米辐射使电子跃迁到激发态，随即回落基态并以相同波长向各方向发光，于是在90–100公里高空形成明亮发光点。画面可能展示钠原子受激与发光能级示意图。<br>![](..\\raw\\BV1UgNdeGEK6_f5.jpg)","note":"钠原子被589纳米激光激发后向四周发光，在钠层形成我们完全掌握参数的“激光导星”。","id":"BV1UgNdeGEK6","title":"为什么天文台需要激光发射器","upper":"九霄君_停更ing","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1UgNdeGEK6_f6.jpg","t":"~3:23","desc":"总结全景：激光导星发出的光同样会被大气扭曲，因此可像真实恒星一样用于校准自适应光学系统，消除真实天体图像的失真；我们看到望远镜射向天空的激光，正是制造导星、校准系统、让星星“不再闪烁”的过程。画面可能展示装配激光发射器的望远镜向夜空射出光束的实拍。<br>![](..\\raw\\BV1UgNdeGEK6_f6.jpg)","note":"望远镜发射激光是为了制造激光导星以校准自适应光学系统，从而把大气折射影响降到最低、获得清晰星像。","id":"BV1UgNdeGEK6","title":"为什么天文台需要激光发射器","upper":"九霄君_停更ing","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1dhNQe3Eob_f1.jpg","t":"~0:56","desc":"开篇引出安卓12的“莫奈主题引擎”——谷歌借画家莫奈之名做的一套主题系统：从壁纸提取主题色并生成配色，应用到主键、桌面部件、锁屏甚至开机动画，壁纸一变配色随之变；在 Material You 中它的正式名称是“动态色彩”，莫奈只是安卓中的代号。<br>![](..\\raw\\BV1dhNQe3Eob_f1.jpg)","note":"莫奈主题的核心是“从壁纸取色→生成系统级配色”，随壁纸动态变化。","id":"BV1dhNQe3Eob","title":"在安卓里追逐莫奈 【BUJI】","upper":"911BUJI","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1dhNQe3Eob_f2.jpg","t":"~1:51","desc":"解释命名缘由：莫奈爱画同一场景的“系列作品”（如《鲁昂大教堂》随光线、《干草堆》随季节变色），景物固定而色彩随条件动态转变；UI样式固定、颜色随壁纸变，正与之神似，并点出莫奈配色“秘诀在调色”、即便壁纸大红大紫也柔和。<br>![](..\\raw\\BV1dhNQe3Eob_f2.jpg)","note":"“莫奈”一名源于其系列画的动态色彩理念，与动态色彩机制异曲同工。","id":"BV1dhNQe3Eob","title":"在安卓里追逐莫奈 【BUJI】","upper":"911BUJI","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1dhNQe3Eob_f3.jpg","t":"~2:47","desc":"详述调色机制：先从壁纸提取高占比且鲜艳的颜色，把色度调到约36（已很柔和），再调制4种进一步降低色度的颜色，其中一种在色轮上偏移60°色相；共得5款主色，但文字、图标等前景元素仍缺合适颜色。<br>![](..\\raw\\BV1dhNQe3Eob_f3.jpg)","note":"莫奈通过压低色度+派生降饱和/偏色相的配色，把鲜艳壁纸处理成柔和风格。","id":"BV1dhNQe3Eob","title":"在安卓里追逐莫奈 【BUJI】","upper":"911BUJI","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1dhNQe3Eob_f4.jpg","t":"~3:42","desc":"转入前景可读性难题：彩色背景不能直接用黑/白文字（对比度不足），用对比色既丑又不利于色弱；工程师以莫奈《印象·日出》为例——去色后太阳猛然消失，说明应靠“明暗对比”而非颜色对比来保证可读。<br>![](..\\raw\\BV1dhNQe3Eob_f4.jpg)","note":"前景颜色须靠明暗（相对亮度）对比而非颜色对比，才兼顾可读性与无障碍。","id":"BV1dhNQe3Eob","title":"在安卓里追逐莫奈 【BUJI】","upper":"911BUJI","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1dhNQe3Eob_f5.jpg","t":"~4:38","desc":"谷歌对5色做“色调/亮度”调整，生成由暗到亮的5×12调色盘，前后景保持亮度差即可轻松保证可读；该亮度盘还带来更好的深色模式——反转选取就能同时拥有合适对比度与彩色，正如夜空并非纯黑。<br>![](..\\raw\\BV1dhNQe3Eob_f5.jpg)","note":"5×12亮度调色盘既解决可读性，又让深色模式也能保留丰富色彩。","id":"BV1dhNQe3Eob","title":"在安卓里追逐莫奈 【BUJI】","upper":"911BUJI","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1dhNQe3Eob_f6.jpg","t":"~5:33","desc":"介绍主题图标功能（自适应图标加纯色图层、与壁纸同色），但同色会抹杀图标辨识度，故抽屉保留原始彩色图标；结论：壁纸取色非安卓独有，但安卓的处理方式与覆盖程度更科学细腻，对得起“莫奈”之名。<br>![](..\\raw\\BV1dhNQe3Eob_f6.jpg)","note":"莫奈主题虽非独家，却以最科学细腻的处理成为安卓个性化设计的关键一环。","id":"BV1dhNQe3Eob","title":"在安卓里追逐莫奈 【BUJI】","upper":"911BUJI","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV148cNeQE3H_f1.jpg","t":"~0:44","desc":"白色真无线耳机被镊子夹持在画面右侧，左侧有一颗传统小型驻极体麦克风作为尺寸对比，背景可见几颗白色纽扣电池；中英字幕说明“即使这些最小的麦克风，对耳机来说仍然太大”。<br>![](..\\raw\\BV148cNeQE3H_f1.jpg)","note":"提出问题：耳机内部空间极小，传统驻极体麦克风仍无法满足尺寸要求，引出硅基MEMS方案。","id":"BV148cNeQE3H","title":"耳机中的微观奇迹","upper":"EngiVibe工程律动","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV148cNeQE3H_f2.jpg","t":"~2:12","desc":"光学显微镜下的MEMS麦克风表面：暖黄色调画面上布满规则排列的同心圆环/凹点阵列；中英字幕说明设备上至少有几层薄硅或二氧化硅。<br>![](..\\raw\\BV148cNeQE3H_f2.jpg)","note":"顶层振动膜的表面微结构：凹点阵列用于释放应力、调节刚度，是MEMS设计的典型特征。","id":"BV148cNeQE3H","title":"耳机中的微观奇迹","upper":"EngiVibe工程律动","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV148cNeQE3H_f3.jpg","t":"~3:40","desc":"扫描电镜（SEM）特写：中心是一个较大的圆形通孔（通向背腔），周围环绕着一圈圈规则的圆形凹点；字幕指出这些圆形阵列是凹点而非真正通孔。<br>![](..\\raw\\BV148cNeQE3H_f3.jpg)","note":"揭示麦克风核心结构：中心声孔让声波进入背腔，周围凹点是顶层膜的力学结构。","id":"BV148cNeQE3H","title":"耳机中的微观奇迹","upper":"EngiVibe工程律动","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV148cNeQE3H_f4.jpg","t":"~5:08","desc":"SEM照片：麦克风芯片边缘被敲开，在保持顶部表面相对完好的情况下暴露出截面，可见顶层带孔洞的薄膜、下方的深腔，以及连接到旁侧焊盘的金线键合。<br>![](..\\raw\\BV148cNeQE3H_f4.jpg)","note":"通过破坏性剖面展示多层堆叠：振动膜、空腔、基底与金线键合，验证MEMS电容式麦克风的立体结构。","id":"BV148cNeQE3H","title":"耳机中的微观奇迹","upper":"EngiVibe工程律动","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV148cNeQE3H_f5.jpg","t":"~6:36","desc":"侧视剖面特写：两层平行结构（顶部带凹点的膜与下方电极/基底）之间形成间隙，上方有弧形金线键合；字幕说明两层间距会随声波改变。<br>![](..\\raw\\BV148cNeQE3H_f5.jpg)","note":"工作原理可视化：声波使顶膜振动→极板间距变化→电容变化→经ASIC放大输出电信号。","id":"BV148cNeQE3H","title":"耳机中的微观奇迹","upper":"EngiVibe工程律动","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV148cNeQE3H_f6.jpg","t":"~8:04","desc":"示意图对比：左侧为各向同性刻蚀（Isotropic Etching）形成圆弧形凹槽，右侧为各向异性刻蚀（Anisotropic Etching）形成直壁深槽；中英字幕说明可在保持直壁轮廓的同时深刻蚀。<br>![](..\\raw\\BV148cNeQE3H_f6.jpg)","note":"制造工艺：深反应离子刻蚀（DRIE）能在硅片上刻出高深宽比的直壁结构，是MEMS麦克风背腔加工的关键技术。","id":"BV148cNeQE3H","title":"耳机中的微观奇迹","upper":"EngiVibe工程律动","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1gm6HYQEyT_f1.jpg","t":"~2:32","desc":"2012年，Yagami Taichi 为赢得网络争论，在2channel匿名板贴出大学录取通知书，却因曾是该板“最被讨厌用户”S级榜首而暴露；帖子发出仅24分钟就被认出大学，4小时内查出高中与含真实全名的社交账号，连“宿醉”推文都被举报未成年饮酒。<br>![](..\\raw\\BV1gm6HYQEyT_f1.jpg)","note":"一句虚荣的晒证引爆人肉：24分钟定校、4小时出真名，互联网记忆与仇恨远超想象。","id":"BV1gm6HYQEyT","title":"【中字】被整个互联网迫害的男人","upper":"科比-比恩-布菜恩特","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1gm6HYQEyT_f2.jpg","t":"~5:03","desc":"律师 Karasawa（唐泽）登场，借日本法律要求网站配合，公开提交上百次 IP 调取请求以追查诽谤、人肉 Yagami 的用户；2channel 上公开请求引发众怒，部分用户反而主动贴出自己 IP 加以嘲讽。<br>![](..\\raw\\BV1gm6HYQEyT_f2.jpg)","note":"Karasawa 用法律武器反诉，却因公开调取IP的强硬姿态与全网为敌。","id":"BV1gm6HYQEyT","title":"【中字】被整个互联网迫害的男人","upper":"科比-比恩-布菜恩特","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1gm6HYQEyT_f3.jpg","t":"~7:35","desc":"Karasawa 只要求下架描绘自己的游戏王卡片、不碰 Yagami，网站主烦不胜烦并放出“操纵谷歌搜索结果”的指南报复；与此同时对 Yagami 的骚扰升级——帖子被转发给亲友女友、住址被扒、父亲餐厅也被围。<br>![](..\\raw\\BV1gm6HYQEyT_f3.jpg)","note":"维权反噬：Karasawa 只删自己相关卡片，却间接让 Yagami 的现实生活被彻底攻陷。","id":"BV1gm6HYQEyT","title":"【中字】被整个互联网迫害的男人","upper":"科比-比恩-布菜恩特","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1gm6HYQEyT_f4.jpg","t":"~10:07","desc":"Karasawa 以富士 Tex 公司名义将2channel用户告上法庭，索赔4900万日元（远超可证损失）而被驳回；又给一名发威胁帖的17岁少年寄去错字连篇、索赔3万美元的律师函；其好斗姿态反而让“泽教”信徒崇拜更甚。<br>![](..\\raw\\BV1gm6HYQEyT_f4.jpg)","note":"天价索赔与律师函尽显好斗，却把舆论进一步推向对 Karasawa 的集体戏谑与神化。","id":"BV1gm6HYQEyT","title":"【中字】被整个互联网迫害的男人","upper":"科比-比恩-布菜恩特","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1gm6HYQEyT_f5.jpg","t":"~12:39","desc":"有人用勒索软件栽赃 Karasawa（受害者误以为是他而愤怒联系其律所），真凶为17岁黑客 Zero Chiyaki，其勒索所得反被其他黑客盗走；更早还有借AKB48遇袭、把谷歌地图“皇宫”改名为“Koshin总部”等方式抹黑他。<br>![](..\\raw\\BV1gm6HYQEyT_f5.jpg)","note":"网民开始系统性冒名嫁祸：从勒索软件到篡改地图，把 Karasawa 塑成一切恶行的“背锅侠”。","id":"BV1gm6HYQEyT","title":"【中字】被整个互联网迫害的男人","upper":"科比-比恩-布菜恩特","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1gm6HYQEyT_f6.jpg","t":"~15:10","desc":"狂热信徒 Ando Yuta 于2016年2月18日以 Karasawa 名义向日本47处政府建筑（含首相官邸、美使馆）发炸弹威胁，致40万学生停课；他被判缓刑后再度作案入狱至2021，并成为后世大量 Copycat 威胁（乃至去年1.5万所学校传真威胁）的模板。<br>![](..\\raw\\BV1gm6HYQEyT_f6.jpg)","note":"“泽教”骚扰从网络走向现实恐袭级犯罪，十余年来以 Karasawa 之名的炸弹威胁已成日本社会顽疾。","id":"BV1gm6HYQEyT","title":"【中字】被整个互联网迫害的男人","upper":"科比-比恩-布菜恩特","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1ZekVYLEbh_f1.jpg","t":"~1:01","desc":"开篇对比 Mate 70 RS 与系列其他版本的亮度实测：RS 手动1000尼特、HDR超1800尼特、全屏激发2000尼特、峰值近3500尼特；其余版本手动600、HDR1500、全屏1600、峰值2600尼特，且峰值只需20%窗口即可触发。<br>![](..\\raw\\BV1ZekVYLEbh_f1.jpg)","note":"RS 亮度全面领先，且20%窗口触发峰值的“含金量”高于需特殊模式的小窗口激发。","id":"BV1ZekVYLEbh","title":"Mate 70 的双层 OLED 有何不同 — Mate 70 系列屏测","upper":"Navis-慢点评测","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1ZekVYLEbh_f2.jpg","t":"~2:03","desc":"转入闪烁（频闪）测试，并点出双层 OLED 寿命相对更长；讲解低亮度做好频闪的前提——要么不让像素刷新频率占主导，要么刷新占空比不能太低。<br>![](..\\raw\\BV1ZekVYLEbh_f2.jpg)","note":"Mate 70 系列选择让1440Hz频率在低亮度完全占主导，从根源抑制频闪。","id":"BV1ZekVYLEbh","title":"Mate 70 的双层 OLED 有何不同 — Mate 70 系列屏测","upper":"Navis-慢点评测","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1ZekVYLEbh_f3.jpg","t":"~3:04","desc":"新增 RGB 像素响应速度测试：解释暗色模式上下滑动时白/灰边缘出现彩色拖影的原因——OLED 的 R、G、B 三色像素响应速度不一致。<br>![](..\\raw\\BV1ZekVYLEbh_f3.jpg)","note":"彩色拖影源于 RGB 像素响应速度差异，是 OLED 的固有特性。","id":"BV1ZekVYLEbh","title":"Mate 70 的双层 OLED 有何不同 — Mate 70 系列屏测","upper":"Navis-慢点评测","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV1ZekVYLEbh_f4.jpg","t":"~4:06","desc":"对比一帧内 RGB 时序响应：左侧竞品绿色像素比蓝 ](..\\raw\\BV1ynqAY2EKq_f3.jpg)","note":"白点假设与多通道色温传感器提供了比猜白平衡更客观的光谱测量，通道越多越准。","id":"BV1ynqAY2EKq","title":"【老戴】全网最详！华为Mate 70多光谱相机解读：模组拆解、原理解析、实拍样张","upper":"ZEALER官方频道","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1ynqAY2EKq_f4.jpg","t":"~8:34","desc":"说明多通道色温传感器虽普及（6/8/10通道）但仍受局限——只感知手机附近平均环境光，遇多光源即失效；而Mate 70多光谱摄像头属多光谱成像，一次拍摄得到光谱立方体（XY为空间、Z为每个像素的独立光谱），同时携带光谱与空间信息<br>![](..\\raw\\BV1ynqAY2EKq_f4.jpg)","note":"Mate 70多光谱摄像头区别于普通色温传感器，能逐像素获取独立光谱，构成光谱立方体。","id":"BV1ynqAY2EKq","title":"【老戴】全网最详！华为Mate 70多光谱相机解读：模组拆解、原理解析、实拍样张","upper":"ZEALER官方频道","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1ynqAY2EKq_f5.jpg","t":"~10:42","desc":"拆解Mate 70多光谱摄像头：传感器约2.8乘1.9毫米，滤光片为3乘3九色阵列（九个通道波段切片）；九个像素合为一个大像素，实际分辨率为物理的九分之一，以空间分辨率换取光谱通道；后端算法逆推前端最关键的波段<br>![](..\\raw\\BV1ynqAY2EKq_f5.jpg)","note":"该摄像头用3乘3九色滤光片、以九合一大像素换取九通道光谱采样，是一套前端到后端的系统工程。","id":"BV1ynqAY2EKq","title":"【老戴】全网最详！华为Mate 70多光谱相机解读：模组拆解、原理解析、实拍样张","upper":"ZEALER官方频道","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV1ynqAY2EKq_f6.jpg","t":"~12:51","desc":"展示实测：大面积纯黄地球仪（缺其他参考色）Mate 70仍能还原接近肉眼；左右3200K加6500K冷暖双光源下，Mate 70追求所见即所得、iPhone追求绝对白点；面对板光等人造光源及走动时光源变化，Mate 70动态平滑调节，整体白平衡策略更贴近人眼观感<br>![](..\\raw\\BV1ynqAY2EKq_f6.jpg)","note":"引入多光谱摄像头后，Mate 70白平衡不盲目找绝对白点，而是贴近人眼观感，在复杂光源下表现更自然。","id":"BV1ynqAY2EKq","title":"【老戴】全网最详！华为Mate 70多光谱相机解读：模组拆解、原理解析、实拍样张","upper":"ZEALER官方频道","coll":"kepu","type":"text"},{"img":"projects/bilibili-kb/kepu/raw/BV14VqAYHEAG_f1.jpg","t":"~0:44","desc":"B站页面截图：Irasutoya 插画小人官方账号“irasutoya插画小人”，展示多个短视频封面，如“窝囊费”“我的棺材板”“我老了就这样”等打工人主题表情包。<br>![](..\\raw\\BV14VqAYHEAG_f1.jpg)","note":"Irasutoya 已入驻 B站等中文社交平台，并精准产出契合中国上班族、学生党精神状态的“抽象”表情包。","id":"BV14VqAYHEAG","title":"随处可见的“日本小人”表情包，怎么成了国内年轻人的精神嘴替？","upper":"BB姬Studio","coll":"kepu","type":"hybrid"},{"img":"projects/bilibili-kb/kepu/raw/BV14VqAYHEAG_f2.jpg","t":"~2:00","desc":"网页截图：粉色日式素材站 girlysozai.com，顶部有搜索框与分类（人物、花、生物、食物等），页面下方展示“YURUNeko”系列可爱猫咪插画。<br>![](..\\raw\\BV14VqAYHEAG_f2
