<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观点知识库 · 网图浏览器</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --ink:#1e293b; --muted:#64748b; --line:#cbd5e1;
    --text:#3b6d11; --text-bg:#eaf3de; --visual:#854f0b; --visual-bg:#faeeeda;
    --hybrid:#3c3489; --hybrid-bg:#eeedfe; --accent:#185fa5;
    --sidew:360px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  header{position:relative;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:8px;align-items:center;flex-wrap:nowrap;white-space:nowrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  .stats{font-size:12px;color:var(--muted)}
  .search{flex:1;min-width:120px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .filters,.tools{display:inline-flex;gap:4px}
  .fbtn,.tbtn{font-size:12px;padding:4px 9px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;color:var(--muted)}
  .fbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tbtn:hover{background:#eef2f7}
  .tbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  button:focus-visible, input:focus-visible, a:focus-visible, .rel:focus-visible, .rel:focus{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
  .wrap{display:flex;height:calc(100vh - 58px);position:relative}
  #graph{flex:1;background:var(--bg);cursor:grab;min-width:0}
  #graph:active{cursor:grabbing}
  #graph g:hover > circle{ stroke:#0f172a; stroke-width:3; filter:drop-shadow(0 0 5px rgba(15,23,42,.4)); }
  #graph line.edge{ cursor:pointer; }
  #graph line.edge:hover{ stroke:#0f172a !important; stroke-width:2.6; }
  .side{width:var(--sidew);border-left:1px solid var(--line);background:var(--panel);padding:16px;overflow:auto;flex:0 0 auto}
  .side h2{font-size:15px;margin:0 0 8px;line-height:1.4}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-bottom:8px}
  .b-text{background:var(--text-bg);color:var(--text)}
  .b-visual{background:var(--visual-bg);color:var(--visual)}
  .b-hybrid{background:var(--hybrid-bg);color:var(--hybrid)}
  .b-status{padding:2px 8px;border-radius:999px;font-size:11px;margin-bottom:8px;margin-left:4px}
  .s-intro{background:#fef3c7;color:#92400e}
  .s-archived{background:#dcfce7;color:#166534}
  .s-pending{background:#e2e8f0;color:#475569}
  .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
  .summary{font-size:13px;line-height:1.7;margin-bottom:12px}
  .sec{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  .chip{display:inline-block;background:#eef2f7;color:#334155;font-size:12px;padding:3px 9px;border-radius:999px;margin:2px 4px 2px 0}
  .chip.rec{cursor:pointer}
  .chip.rec:hover{background:var(--accent);color:#fff}
  .kf{font-size:12px;color:var(--ink);margin:10px 0;display:flex;gap:8px;align-items:flex-start}
  .kfimg{width:104px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:0 0 auto;background:#eef2f7}
  .kfbody{flex:1;min-width:0;line-height:1.5}
  .kf b{color:var(--accent);font-weight:600}
  .kfnote{color:var(--muted);margin-top:3px;line-height:1.5}
  .rel{font-size:12px;padding:5px 8px;border-radius:6px;background:#f1f5f9;margin:3px 0;cursor:pointer}
  .rel:hover{background:#e2e8f0}
  .empty{color:var(--muted);font-size:13px}
  a{color:var(--accent)}
  .legend{position:absolute;left:14px;bottom:12px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--muted);z-index:5}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .matchbar{position:absolute;left:50%;transform:translateX(-50%);top:60px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 6px;display:none;gap:4px;z-index:45;box-shadow:0 6px 20px rgba(0,0,0,.12)}
  body[data-theme="dark"] .matchbar{background:#1e293b}
  /* ---- 详情头部 / 操作 ---- */
  .phead{display:flex;align-items:center;gap:2px;position:relative;margin-bottom:6px}
  .xbtn{position:absolute;right:-4px;top:-6px;border:none;background:transparent;font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
  .xbtn:hover{color:var(--ink)}
  .actbar{display:flex;align-items:center;gap:6px}
  .actbar .tbtn{font-size:11px;padding:3px 8px}
  /* ---- markdown 渲染 ---- */
  .md h1,.md h2,.md h3,.md h4{margin:10px 0 6px;line-height:1.3}
  .md h1{font-size:17px}.md h2{font-size:15px}.md h3{font-size:14px}
  .md p{margin:6px 0;line-height:1.7}
  .md blockquote{margin:8px 0;padding:6px 10px;border-left:3px solid var(--accent);background:#f1f5f9;color:var(--muted);border-radius:0 6px 6px 0}
  .md code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
  .md hr{border:none;border-top:1px solid var(--line);margin:10px 0}
  .md ul,.md ol{margin:6px 0;padding-left:20px;line-height:1.7}
  .md table.mdt{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}
  .md table.mdt th,.md table.mdt td{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top}
  .md table.mdt th{background:#f1f5f9}
  .md img{max-width:100%;border-radius:6px}
  .md table.mdt td img.kfcell{width:150px;max-width:150px;height:auto;display:block;border-radius:6px;border:1px solid var(--line);margin:0}
  .mdbox{max-height:300px;overflow:auto;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
  /* ---- 搜索下拉 ---- */
  .suggest{position:absolute;top:54px;left:18px;width:380px;max-height:340px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:40;display:none}
  .sitem{padding:8px 10px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px}
  .sitem:hover,.sitem.active{background:#eef2f7}
  .sitem.empty{color:var(--muted);cursor:default;display:block}
  .sitem .sm{color:var(--muted);font-size:11px;margin-left:auto}
  .typeDot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  /* ---- 列表视图 ---- */
  .listview{display:none;flex:1;overflow:auto;padding:14px 18px;background:var(--bg)}
  .listview table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .listview th,.listview td{border-bottom:1px solid var(--line);padding:8px 10px;font-size:13px;text-align:left;vertical-align:middle}
  .listview th{background:#f1f5f9;cursor:pointer;user-select:none;position:sticky;top:0}
  .listview th:hover{background:#e2e8f0}
  .listview tr{cursor:pointer}
  .listview tr:hover{background:#f8fafc}
  .listview tr.sel{background:#eef2f7}
  .lvbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  /* ---- 可拖拽分隔条 ---- */
  #resizer{width:6px;flex:0 0 auto;cursor:col-resize;background:transparent;position:relative;z-index:6}
  #resizer:hover,#resizer.drag{background:var(--line)}
  /* ---- 全屏阅读（原文展开 + 章节折叠） ---- */
  .reader{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:120;align-items:flex-start;justify-content:center;padding:3vh 0;overflow:auto}
  .reader.open{display:flex}
  .reader-box{width:min(920px,94vw);max-height:94vh;background:var(--panel);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .reader-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .reader-head h3{margin:0;font-size:15px;flex:1;line-height:1.4}
  .reader-body{flex:1;overflow:auto;padding:18px 22px}
  .reader-body h2,.reader-body h3{cursor:pointer;user-select:none}
  .reader-body h2::before,.reader-body h3::before{content:'▸ ';color:var(--muted);font-size:.8em}
  .reader-body h2.open::before,.reader-body h3.open::before{content:'▾ '}
  .reader-body .fold-body.collapsed{display:none}
  /* ---- 灵感发生器 ---- */
  .inspire{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:120;align-items:center;justify-content:center;padding:3vh}
  .inspire.open{display:flex}
  .inspire-box{width:min(560px,94vw);max-height:92vh;background:var(--panel);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .inspire-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .inspire-head h3{margin:0;font-size:15px;flex:1}
  .inspire-body{flex:1;overflow:auto;padding:18px}
  .icard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .icard .tt{font-size:16px;font-weight:600;margin:8px 0 6px;line-height:1.4}
  .trail{font-size:11px;color:var(--muted);margin:4px 0 10px;line-height:1.6;word-break:break-all;padding:6px 8px;background:var(--bg);border:1px dashed var(--line);border-radius:8px}
  .trail .crumb{color:#2563eb}
  .trail .crumb-sep{margin:0 4px;color:var(--muted)}
  .trail b{color:var(--text)}
  .icard .pt{font-size:13px;line-height:1.7;color:var(--ink)}
  .icard .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .icard .acts .tbtn{font-size:12px;padding:4px 12px}
  .kwrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
  .secbar{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
  /* ---- 深色主题 ---- */
  body[data-theme="dark"]{--bg:#0f172a;--panel:#1e293b;--ink:#e2e8f0;--muted:#94a3b8;--line:#334155;--text-bg:#16260e;--visual-bg:#2a210d;--hybrid-bg:#211f3a;--accent:#60a5fa}
  body[data-theme="dark"] .md blockquote,body[data-theme="dark"] .md code,body[data-theme="dark"] .listview th{background:#172033}
  body[data-theme="dark"] .search,body[data-theme="dark"] .fbtn,body[data-theme="dark"] .tbtn{background:#0f172a;color:#e2e8f0;border-color:#334155}
  body[data-theme="dark"] .side,body[data-theme="dark"] .listview table,body[data-theme="dark"] .suggest,body[data-theme="dark"] header{background:#1e293b}
  body[data-theme="dark"] .legend{background:rgba(30,41,59,.92)}
  body[data-theme="dark"] .rel{background:#172033}
  body[data-theme="dark"] .rel:hover{background:#0f172a}
  body[data-theme="dark"] .reader-box,body[data-theme="dark"] .inspire-box{background:#1e293b}
  body[data-theme="dark"] .icard{background:#0f172a}
</style>
</head>
<body>
<header>
  <h1>观点知识库 · 网图浏览器</h1>
  <span id="stats" class="stats"></span>
  <input id="search" class="search" placeholder="搜索标题 / UP主 / 概念，回车或点选聚焦…">
  <span class="filters" id="modeBar">
    <button data-m="kw" class="fbtn active">关键词</button>
    <button data-m="sem" class="fbtn">语义</button>
  </span>
  <span class="filters">
    <button data-t="all" class="fbtn active">全部</button>
    <button data-t="text" class="fbtn">文本</button>
    <button data-t="visual" class="fbtn">画面</button>
    <button data-t="hybrid" class="fbtn">混合</button>
  </span>
  <span class="tools">
    <button id="inspireBtn" class="tbtn" title="观点 / 灵感发生器">💡 灵感</button>
    <button id="entBtn" class="tbtn" title="概念浏览器">🏷 概念</button>
    <button id="view" class="tbtn" title="切换网图/列表">列表</button>
    <button id="theme" class="tbtn" title="深色/浅色">🌙</button>
    <button id="zin" class="tbtn" title="放大">＋</button>
    <button id="zout" class="tbtn" title="缩小">－</button>
    <button id="fit" class="tbtn" title="适应屏幕">适应</button>
    <button id="tgl" class="tbtn" title="显示/隐藏标签">标签</button>
    <button id="helpBtn" class="tbtn" title="快捷键与使用说明">?</button>
  </span>
</header>
<div class="wrap">
  <svg id="graph"><g id="viewport"></g></svg>
  <div id="listView" class="listview">
    <div class="lvbar"><span id="lvCount" class="stats"></span><button id="lvExport" class="tbtn">导出 CSV</button></div>
    <table id="lt"><thead><tr>
      <th data-k="title">标题 ⇅</th><th data-k="type">类型</th><th data-k="upper">UP主</th>
      <th data-k="duration">时长 ⇅</th><th data-k="status">状态</th><th data-k="links">关联 ⇅</th><th data-k="ents">概念数 ⇅</th>
    </tr></thead><tbody></tbody></table>
  </div>
  <div id="resizer" title="拖动调整面板宽度"></div>
  <div class="side" id="side"><div class="empty">点击左侧任意节点查看归档详情与自动联想的关联。</div></div>
  <div class="legend" id="legend">
    <div><i style="background:#639922"></i>文本型（口播/观点）</div>
    <div><i style="background:#ba7517"></i>画面型（演示/教程）</div>
    <div><i style="background:#534ab7"></i>混合型</div>
  </div>
</div>
<div id="suggest" class="suggest"></div>
<div id="matchBar" class="matchbar">
  <button id="isoBtn" class="tbtn">只看匹配</button>
  <button id="fitBtn" class="tbtn">聚焦命中</button>
  <button id="clrBtn" class="tbtn">清除</button>
</div>
<div id="readerPanel" class="reader">
  <div class="reader-box">
    <div class="reader-head">
      <h3 id="readerTitle"></h3>
      <button id="readerCopy" class="tbtn">复制</button>
      <button id="readerClose" class="xbtn">×</button>
    </div>
    <div id="readerBody" class="md reader-body"></div>
  </div>
</div>
<div id="kfPanel" class="reader">
  <div class="reader-box" style="width:min(720px,94vw)">
    <div class="reader-head"><h3 id="kfTitle">关键帧</h3><button id="kfClose" class="xbtn">×</button></div>
    <div class="reader-body" id="kfBody" style="text-align:center"></div>
  </div>
</div>
<div id="inspirePanel" class="inspire">
  <div class="inspire-box">
    <div class="inspire-head">
      <h3>💡 观点 / 灵感发生器</h3>
      <button id="inspireClose" class="xbtn">×</button>
    </div>
    <div class="inspire-body">
      <div id="icard" class="icard"></div>
      <div class="secbar"><span class="sec">随机灵感关键词</span><button id="kwRefresh" class="tbtn">换一批</button></div>
      <div id="kwpool" class="kwrow"></div>
      <div class="empty" style="font-size:12px">点关键词可在知识库中检索；点关联观点可跳转；「随机漫游」顺着关联链探索更多想法。</div>
    </div>
  </div>
</div>
<div id="entPanel" class="inspire">
  <div class="inspire-box">
    <div class="inspire-head">
      <h3>🏷 概念浏览器</h3>
      <button id="entClose" class="xbtn">×</button>
    </div>
    <div class="inspire-body">
      <input id="entSearch" class="search" placeholder="筛选概念（如：孤独、算法、认知）…">
      <div id="entList" style="margin-top:10px"></div>
      <div class="empty" style="font-size:12px">点击概念即在知识库中检索；概念按出现频次排序，数字为关联节点数。</div>
    </div>
  </div>
</div>
<div id="helpPanel" class="inspire">
  <div class="inspire-box">
    <div class="inspire-head">
      <h3>⌨️ 快捷键 & 使用说明</h3>
      <button id="helpClose" class="xbtn">×</button>
    </div>
    <div class="inspire-body md" id="helpBody"></div>
  </div>
</div>
<script>
let DATA = {nodes:[], edges:[]};
const svg = document.getElementById('graph');
const viewport = document.getElementById('viewport');
const side = document.getElementById('side');
const suggestEl = document.getElementById('suggest');
const listView = document.getElementById('listView');
const NS = 'http://www.w3.org/2000/svg';
let W = svg.clientWidth, H = svg.clientHeight;
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

const colorOf = t => t==='text' ? '#639922' : t==='visual' ? '#ba7517' : '#534ab7';
const edgeColor = k => k==='entity'?'#c026d3' : k==='share-ent'?'#db2777' : k==='reference'?'#185fa5' : k==='semantic'?'#0d9488' : k==='semantic-lsi'?'#d97706' : '#94a3b8';
const edgeLabel = k => ({'entity':'共享概念','share-ent':'共享实体','reference':'同一UP主','semantic':'标题相关','semantic-lsi':'语义相近'} )[k] || null;
const rOf = t => t==='visual' ? 16 : 14;
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dot = t => `<span class="typeDot" style="background:${colorOf(t)}"></span>`;
const statusLabel = s => s==='intro'?'仅简介·超长合集': s==='archived'?'已归档':'待归档';
const statusClass = s => s==='intro'?'s-intro': s==='archived'?'s-archived':'s-pending';
const typeLabel = t => t==='text'?'文本型': t==='visual'?'画面型':'混合型';

let nodes=[], links=[], selected=-1, matchIds=new Set(), activeType='all';
let showLabels=false, listActive=false, sortKey='title', sortDir=1, showDeg2=false, isolated=false, lastRows=[], lastQv=[], recents=[];
let compSize=[];   // 每个节点所属连通分量的大小（用于力导向分级锚定重力）
let view = {x:0, y:0, k:1};
let alpha = 1, running = false, dragging = false;
let linkCount = {}, suggestHits=[], activeSuggest=-1;
let searchMode='kw', semData=null, VIDX={}, semRank=[];

function applyView(){ viewport.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }

// ---------- Markdown 渲染器（自包含，无外部依赖） ----------
function md2html(src){
  if(!src) return '';
  const E = s => s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const inline = s => {
    s = E(s);
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m,a,u)=>`<img alt="${a}" src="${u}" style="max-width:100%;border-radius:6px;margin:6px 0">`);
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m,a,u)=>`<a href="${u}" target="_blank" rel="noopener">${a}</a>`);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    return s;
  };
  const lines = src.replace(/\r\n/g,'\n').split('\n');
  let html='', i=0;
  while(i<lines.length){
    let ln = lines[i];
    if(/^\s*$/.test(ln)){ i++; continue; }
    let m;
    // 标题：容忍 # 后无空格（##标题）；结尾可有 #（GitHub 风格闭合）
    if((m=ln.match(/^(#{1,6})\s*(.*?)\s*#*\s*$/))){ const lv=m[1].length; const t=m[2].trim(); html+=`<h${lv}>${inline(t)}</h${lv}>`; i++; continue; }
    // setext 标题：下一行是全 = 或 -（且不是表格分隔）
    if(i+1<lines.length && /^[=\-]{3,}\s*$/.test(lines[i+1]) && !/^\s*[-*+]\s+/.test(ln) && !ln.includes('|')){
      const isH1=/^=+\s*$/.test(lines[i+1]); html+=`<h${isH1?1:2}>${inline(ln)}</h${isH1?1:2}>`; i+=2; continue;
    }
    if(/^(\s*[-*_]){3,}\s*$/.test(ln) && !/^\s*[-*+]\s+/.test(ln)){ html+='<hr>'; i++; continue; }
    if(/^\s*>\s?/.test(ln)){
      const buf=[]; while(i<lines.length && /^\s*>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      html+=`<blockquote>${inline(buf.join('\n'))}</blockquote>`; continue;
    }
    if(ln.includes('|') && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].includes('-')){
      const head = ln.split('|').slice(1,-1).map(c=>c.trim());
      i+=2; const rows=[];
      while(i<lines.length && lines[i].includes('|') && !/^\s*$/.test(lines[i])){
        rows.push(lines[i].split('|').slice(1,-1).map(c=>c.trim())); i++;
      }
      html+=`<table class="mdt"><thead><tr>${head.map(h=>`<th>${inline(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      continue;
    }
    if(/^\s*[-*+]\s+/.test(ln)){
      const buf=[]; while(i<lines.length && /^\s*[-*+]\s+/.test(lines[i])){ buf.push(lines[i].replace(/^\s*[-*+]\s+/,'')); i++; }
      html+='<ul>'+buf.map(b=>`<li>${inline(b)}</li>`).join('')+'</ul>'; continue;
    }
    if(/^\s*\d+\.\s+/.test(ln)){
      const buf=[]; while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ buf.push(lines[i].replace(/^\s*\d+\.\s+/,'')); i++; }
      html+='<ol>'+buf.map(b=>`<li>${inline(b)}</li>`).join('')+'</ol>'; continue;
    }
    const buf=[ln]; i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6})/.test(lines[i]) && !/^\s*>\s?/.test(lines[i]) && !/^\s*[-*+]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) && !/^(\s*[-*_]){3,}\s*$/.test(lines[i])){
      buf.push(lines[i]); i++;
    }
    html+=`<p>${inline(buf.join(' '))}</p>`;
  }
  return html;
}
function safeMd(src, fallback){
  try { const h = md2html(src); return (h && h.trim()) ? h : (fallback||''); }
  catch(e){ return fallback || '<div class="empty">内容渲染出错</div>'; }
}

function build(){
  const N = DATA.nodes.length;
  const R0 = Math.max(120, Math.sqrt(N) * 46);
  nodes = DATA.nodes.map((n,i)=>{
    const ang = i * 2.399963;
    const rad = R0 * (0.25 + 0.75 * (i / Math.max(1,N-1)));
    return {...n, _ci:i, x:Math.cos(ang)*rad, y:Math.sin(ang)*rad, vx:0, vy:0, colR:rOf(n.type)+34};
  });
  semData = DATA.semantic || null;
  if(semData && semData.node_latent){
    VIDX = {}; (semData.vocab||[]).forEach((w,i)=>VIDX[w]=i);
    nodes.forEach((n,i)=>{ n._latent = semData.node_latent[i]; });
  } else {
    const sb = document.querySelector('#modeBar [data-m="sem"]'); if(sb) sb.style.display='none';
  }
  const idx = Object.fromEntries(nodes.map((n,i)=>[n.id,i]));
  links = DATA.edges.filter(e=>idx[e.source]!=null && idx[e.target]!=null)
            .map(e=>({s:idx[e.source], t:idx[e.target], kind:e.kind, label:e.label}));
  linkCount = {};
  links.forEach(l=>{ const a=nodes[l.s].id,b=nodes[l.t].id; linkCount[a]=(linkCount[a]||0)+1; linkCount[b]=(linkCount[b]||0)+1; });
  // ---- 计算连通分量大小（用于分级锚定重力：孤立/小组件强引力归位，大组件弱引力保形）----
  const parent = nodes.map((_,i)=>i);
  const findRoot = x => { while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
  links.forEach(l=>{ const a=findRoot(l.s), b=findRoot(l.t); if(a!==b) parent[a]=b; });
  const compCnt = {};
  nodes.forEach((_,i)=>{ const r=findRoot(i); compCnt[r]=(compCnt[r]||0)+1; });
  compSize = nodes.map((_,i)=>compCnt[findRoot(i)] || 1);
  draw();
  nodes.forEach(n=>{
    let lw = 80;
    try { lw = n.label.getComputedTextLength ? n.label.getComputedTextLength() : 80; } catch(e){}
    n.colR = rOf(n.type) + 8 + Math.min(lw/2, 70) + Math.min(7,(linkCount[n.id]||0)*0.7);
  });
  alpha = 1;
  for(let i=0;i<460;i++){ simStep(alpha); alpha *= 0.992; if(alpha < 0.006) break; }
  renderPositions();
  fitToScreen();
  // 入场动画：极轻量缓动（已用锚定重力收敛，不会有散点飞出/抖动）
  alpha = 0.06;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) alpha=0;
  if(!running && alpha>0) requestAnimationFrame(tick);
  const cnt={text:0,visual:0,hybrid:0}; nodes.forEach(n=>cnt[n.type]++);
  document.getElementById('stats').textContent = `${nodes.length} 节点 · ${links.length} 边`;
  legendEl.innerHTML = typeLegendHTML();
}


function draw(){
  while(viewport.firstChild) viewport.removeChild(viewport.firstChild);
  links.forEach(l=>{
    const ln=document.createElementNS(NS,'line');
    ln.setAttribute('stroke', edgeColor(l.kind));
    ln.setAttribute('stroke-width', l.kind==='reference'?1.6:1);
    ln.dataset.s=l.s; ln.dataset.t=l.t; ln.classList.add('edge');
    ln.style.opacity = 0.6;
    const tl=document.createElementNS(NS,'title'); tl.textContent=l.label||'关联'; ln.appendChild(tl);
    viewport.appendChild(ln); l.el=ln;
  });
  nodes.forEach((n,i)=>{
    const g=document.createElementNS(NS,'g'); g.style.cursor='pointer'; g.dataset.i=i;
    const c=document.createElementNS(NS,'circle');
    const rr = rOf(n.type) + Math.min(7, (linkCount[n.id]||0)*0.7);
    c.setAttribute('r',rr); c.setAttribute('fill',colorOf(n.type));
    c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width',2);
    const t=document.createElementNS(NS,'text');
    t.setAttribute('text-anchor','middle'); t.setAttribute('y', rOf(n.type)+13);
    t.setAttribute('font-size','10'); t.setAttribute('fill','#334155');

    t.style.display = showLabels ? '' : 'none';   // 默认隐藏标签，避免 172 个标签重叠成一团
    g.appendChild(c); g.appendChild(t);
    g.addEventListener('click',()=>{ if(justDragged){ justDragged=false; return; } select(i); });
    g.addEventListener('dblclick',e=>{ e.stopPropagation(); showDeg2=true; paintNeighborhood(i,2); });
    g.addEventListener('mousedown',e=>drag(e,i));
    // 悬停时显示该节点标签（默认标签隐藏时），移出后若非选中/相邻则再隐藏
    g.addEventListener('mouseenter',()=>{ if(!showLabels && i!==selected && !isNeighbor(i)) t.style.display=''; });
    g.addEventListener('mouseleave',()=>{ if(!showLabels && i!==selected && !isNeighbor(i)) t.style.display='none'; });
    viewport.appendChild(g); n.el=g; n.circle=c; n.label=t;
  });
  applyTypeFilter();
}

function neighborhood(i, maxd){
  const dist={}; dist[i]=0; let frontier=[i];
  for(let d=1; d<=maxd; d++){
    const next=[];
    frontier.forEach(c=> links.filter(l=>l.s===c||l.t===c).forEach(l=>{
      const o=l.s===c?l.t:l.s; if(dist[o]===undefined){ dist[o]=d; next.push(o); }
    }));
    frontier=next;
  }
  return dist;
}
function paintNeighborhood(i, maxd){
  const dist=neighborhood(i,maxd);
  nodes.forEach((n,j)=>{
    const d=dist[j];
    if(d===undefined){ n.el.style.opacity=0.12; }
    else if(d===0){ n.el.style.opacity=1; n.circle.setAttribute('stroke','#0f172a'); n.circle.setAttribute('stroke-width',3); }
    else if(d===1){ n.el.style.opacity=1; n.circle.setAttribute('stroke','#f59e0b'); n.circle.setAttribute('stroke-width',2.5); }
    else { n.el.style.opacity=0.85; n.circle.setAttribute('stroke','#38bdf8'); n.circle.setAttribute('stroke-width',2); }
  });
  links.forEach(l=>{ const a=dist[l.s], b=dist[l.t]; l.el.style.opacity = (a!==undefined&&b!==undefined)?0.9:0.05; });
}
function recommend(n){
  const s1=new Set(n.entities||[]);
  const idxN=nodes.findIndex(x=>x.id===n.id);
  const direct=new Set(links.filter(l=>l.s===idxN||l.t===idxN).map(l=> l.s===idxN?nodes[l.t].id:nodes[l.s].id));
  const cand=nodes.filter(m=> m.id!==n.id && !direct.has(m.id));
  const scored=cand.map(m=>({id:m.id,title:m.title,s:(m.entities||[]).filter(e=>s1.has(e)).length}));
  scored.sort((a,b)=> b.s-a.s || (linkCount[b.id]||0)-(linkCount[a.id]||0));
  let top=scored.filter(r=>r.s>0).slice(0,6);
  if(!top.length) top=scored.slice(0,6);
  return top;
}
function semNeighbors(nodeId, k){
  k=k||5;
  const n=nodes.find(x=>x.id===nodeId); if(!n||!n._latent) return [];
  const v=n._latent;
  return nodes.filter(m=>m.id!==nodeId && m._latent)
    .map(m=>{ let s=0; const w=m._latent; for(let d=0;d<v.length;d++) s+=v[d]*w[d]; return {id:m.id,title:m.title,s}; })
    .sort((a,b)=>b.s-a.s).slice(0,k);
}

function copyText(txt, btn){

function fallbackCopy(txt,done){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} document.body.removeChild(ta); }

function centerOn(i){
  const n=nodes[i]; if(!n) return;

// ---- 力导向：斥力 + 连线 + 碰撞约束（解重叠）+ 质心回中 + 分级锚定重力 ----
// 关键修复：原版居中力 0.0006 过弱、斥力 5200 过强，导致 53 个孤立节点 + 60 个散件被斥力推飞到屏幕外。
// 现改为：每步把整图质心平移回原点（防整体漂移）；按连通分量大小施加分级重力——
//   大组件弱引力(保形)，孤立/小组件强引力(归位)，散点不再飞散。
function simStep(a){
  const rep = 4500, kf = 0.06, G_BIG = 0.03, G_SMALL = 0.13, SMALL_THRESH = 6;
  // 质心回中：把整张图的质心平移到原点，避免整体漂移
  let cx=0, cy=0;
  for(const n of nodes){ cx+=n.x; cy+=n.y; }
  cx/=nodes.length; cy/=nodes.length;
  for(const n of nodes){ n.x-=cx; n.y-=cy; }
  // 分级锚定重力（拉向原点 = 当前质心）
  for(const n of nodes){
    const g = (compSize[n._ci] <= SMALL_THRESH) ? G_SMALL : G_BIG;
    n.vx += (-n.x)*g*a; n.vy += (-n.y)*g*a;
  }
  for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
    const A=nodes[i],B=nodes[j]; let dx=A.x-B.x, dy=A.y-B.y;
    let d=Math.hypot(dx,dy)||0.01; const f=rep/(d*d)*a;
    const fx=dx/d*f, fy=dy/d*f; A.vx+=fx; A.vy+=fy; B.vx-=fx; B.vy-=fy;
  }
  for(const l of links){ const A=nodes[l.s],B=nodes[l.t];
    let dx=B.x-A.x, dy=B.y-A.y; let d=Math.hypot(dx,dy)||0.01;
    const f=(d-150)*kf*a; A.vx+=dx/d*f; A.vy+=dy/d*f; B.vx-=dx/d*f; B.vy-=dy/d*f;
  }
  for(const n of nodes){ if(n===dragNode){ n.vx=0; n.vy=0; continue; } n.vx*=0.85; n.vy*=0.85; n.x+=n.vx; n.y+=n.vy; }
  for(let it=0; it<2; it++) for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
    if(nodes[i]===dragNode || nodes[j]===dragNode) continue;
    const A=nodes[i],B=nodes[j]; let dx=B.x-A.x, dy=B.y-A.y;
    let d=Math.hypot(dx,dy)||0.01; const min=A.colR+B.colR;
    if(d<min){ const push=(min-d)/2, ux=dx/d, uy=dy/d;
      A.x-=ux*push; A.y-=uy*push; B.x+=ux*push; B.y+=uy*push; }
  }
}
function render(){ renderPositions(); }
function renderPositions(){
  links.forEach(l=>{ const A=nodes[l.s],B=nodes[l.t];
    l.el.setAttribute('x1',A.x); l.el.setAttribute('y1',A.y);
    l.el.setAttribute('x2',B.x); l.el.setAttribute('y2',B.y); });
  nodes.forEach(n=>{ n.el.setAttribute('transform',`translate(${n.x},${n.y})`); });
}
function tick(){
  if(alpha < 0.005 && !dragging){ running=false; renderPositions(); fitToScreen(); return; }
  running=true;
  simStep(alpha); alpha *= 0.99; renderPositions();
  requestAnimationFrame(tick);
}
function fitToScreen(){
  if(!nodes.length) return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const n of nodes){ minX=Math.min(minX,n.x-n.colR); minY=Math.min(minY,n.y-n.colR);
    maxX=Math.max(maxX,n.x+n.colR); maxY=Math.max(maxY,n.y+n.colR); }
  const bw=Math.max(1,maxX-minX), bh=Math.max(1,maxY-minY), pad=50;
  const k=Math.min((W-pad*2)/bw, (H-pad*2)/bh, 2.0);
  view.k=Math.max(0.12,k);
  view.x = W/2 - ((minX+maxX)/2)*view.k;
  view.y = H/2 - ((minY+maxY)/2)*view.k;

let dragNode=null, justDragged=false;
function drag(e,i){
  e.stopPropagation();
  justDragged=false;   // 关键修复：每次按下都重置，避免上一次拖拽把“下一次点击”误吞
  const r=svg.getBoundingClientRect();
  const sx=e.clientX, sy=e.clientY; let moved=false;
  const move=ev=>{
    if(!moved && Math.hypot(ev.clientX-sx, ev.clientY-sy) < 4) return;
    if(!moved){ moved=true; dragging=true; dragNode=nodes[i]; alpha=Math.max(alpha,0.35); if(!running) requestAnimationFrame(tick); }
    const wx=(ev.clientX-r.left-view.x)/view.k, wy=(ev.clientY-r.top-view.y)/view.k;
    nodes[i].x=wx; nodes[i].y=wy; nodes[i].vx=0; nodes[i].vy=0;
  };
  const up=()=>{ if(moved){ dragging=false; dragNode=null; justDragged=true; } window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
  window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
}

svg.addEventListener('wheel', e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const f=e.deltaY<0 ? 1.12 : 1/1.12;
  const nk=Math.max(0.12, Math.min(6, view.k*f));
  view.x = mx - (mx-view.x)*(nk/view.k);
  view.y = my - (my-view.y)*(nk/view.k);
  view.k = nk; applyView();
}, {passive:false});

});
window.addEventListener('mouseup', ()=>{ if(panning && !panMoved) deselect(); panning=false; });
function zoomBy(f){ const mx=W/2, my=H/2, nk=Math.max(0.12,Math.min(6,view.k*f));
  view.x=mx-(mx-view.x)*(nk/view.k); view.y=my-(my-view.y)*(nk/view.k); view.k=nk; applyView(); }

function stateHash(){

}

function restoreState(){

function searchUpdate(){

function fuzzySugg(q){
  q=q.toLowerCase(); if(q.length<2) return [];
  const set=new Set(); for(let i=0;i<q.length-1;i++) set.add(q.substr(i,2));
  return nodes.map(n=>{
    const t=(n.title||'').toLowerCase();
    let score=0;
    if(t.includes(q)) score+=5;
    if(q.length>2 && (n.summary||'').toLowerCase().includes(q)) score+=2;
    const tg=[]; for(let i=0;i<t.length-1;i++) tg.push(t.substr(i,2));
    score += tg.filter(g=>set.has(g)).length;
    return {id:n.id, score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,5).map(x=>nodes.find(n=>n.id===x.id));
}
function kwSearch(q){
  clearHL();
  const hits = nodes.filter(n => (n.title+'').toLowerCase().includes(q) || (n.upper+'').toLowerCase().includes(q)
    || (n.entities||[]).some(en=>en.toLowerCase().includes(q)) || (n.summary||'').toLowerCase().includes(q));
  suggestHits = hits; activeSuggest=-1;
  if(hits.length){
    suggestEl.innerHTML = hits.slice(0,12).map(h=>`<div class="sitem" data-id="${esc(h.id)}">${dot(h.type)} <b>${esc(h.title)}</b><span class="sm">${esc(h.upper)}</span></div>`).join('');
    suggestEl.querySelectorAll('.sitem').forEach(el=>el.onclick=()=>{ const n=nodes.find(x=>x.id===el.dataset.id); if(n) pickResult(nodes.findIndex(x=>x.id===n.id)); });
    suggestEl.style.display='block';
  } else {
    const sug = fuzzySugg(q);
    if(sug.length){
      suggestEl.innerHTML = '<div class="sitem empty">无精确匹配 · 你是指？</div>' + sug.map(h=>`<div class="sitem" data-id="${esc(h.id)}">${dot(h.type)} <b>${esc(h.title)}</b><span class="sm">${esc(h.upper)}</span></div>`).join('');
      suggestEl.querySelectorAll('.sitem[data-id]').forEach(el=>el.onclick=()=>{ const n=nodes.find(x=>x.id===el.dataset.id); if(n) pickResult(nodes.findIndex(x=>x.id===n.id)); });
    } else {
      suggestEl.innerHTML='<div class="sitem empty">无匹配 · <a href="#" id="sugEntKw">浏览全部概念 🏷</a>，或切到「语义」模式</div>';
      const se=document.getElementById('sugEntKw'); if(se) se.onclick=(e)=>{ e.preventDefault(); openEnt(); suggestEl.style.display='none'; };
    }
    suggestEl.style.display='block';
  }
  if(listActive) renderList();
}
function semTok(q){
  q=(q||'').toLowerCase(); const t=[];
  const runs=q.match(/[\u4e00-\u9fff]+/g)||[];
  for(const run of runs){ for(const ch of run) t.push(ch); for(let i=0;i<run.length-1;i++) t.push(run.substr(i,2)); }
  const asc=q.match(/[a-z0-9]+/g)||[];
  for(const w of asc) t.push(w);
  return t;
}
function semanticSearch(q){
  if(!semData || !semData.node_latent || !semData.vocab || !semData.comp){
    kwSearch(q); return;
  }
  const toks=semTok(q); const V=semData.vocab.length, k=semData.k;
  const qv=new Float64Array(V); const cnt={};
  for(const t of toks) if(t in VIDX) cnt[t]=(cnt[t]||0)+1;
  let norm=0;
  for(const t in cnt){ const j=VIDX[t]; const tf=1+Math.log(cnt[t]); const val=tf*semData.idf[j]; qv[j]=val; norm+=val*val; }
  if(norm===0){ suggestEl.innerHTML='<div class="sitem empty">语义库未收录这些词 · <a href="#" id="sugEntSem">浏览全部概念 🏷</a> 或换个说法</div>'; suggestEl.style.display='block'; clearHL(); semRank=[]; if(listActive) renderList();
    const se=document.getElementById('sugEntSem'); if(se) se.onclick=(e)=>{ e.preventDefault(); openEnt(); suggestEl.style.display='none'; }; return; }
  norm=Math.sqrt(norm);
  for(let j=0;j<V;j++) qv[j]/=norm;
  lastQv = Object.keys(cnt).map(t=>({tok:t, w:qv[VIDX[t]]||0}));
  const ql=new Float64Array(k);
  for(const t in cnt){ const j=VIDX[t], base=j*k, val=qv[j]; for(let d=0;d<k;d++) ql[d]+=val*semData.comp[base+d]; }
  for(let d=0;d<k;d++) ql[d]/=semData.sv[d];
  let qn=0; for(let d=0;d<k;d++) qn+=ql[d]*ql[d]; qn=Math.sqrt(qn)||1;
  for(let d=0;d<k;d++) ql[d]/=qn;
  const scored=nodes.map(n=>{ const v=n._latent; if(!v) return {id:n.id,score:0}; let s=0; for(let d=0;d<k;d++) s+=ql[d]*v[d]; return {id:n.id,score:s}; })
    .filter(x=>x.score>0.03).sort((a,b)=>b.score-a.score);
  semRank=scored;
  suggestHits=scored.slice(0,12); activeSuggest=-1;
  if(scored.length){
    suggestEl.innerHTML=scored.slice(0,12).map(h=>{ const n=nodes.find(x=>x.id===h.id); const pct=Math.max(0,Math.min(99,Math.round(h.score*100))); return `<div class="sitem" data-id="${esc(h.id)}">${dot(n.type)} <b>${esc(h.title)}</b><span class="sm">匹配 ${pct}%</span></div>`; }).join('');
    suggestEl.querySelectorAll('.sitem').forEach(el=>el.onclick=()=>{ const n=nodes.find(x=>x.id===el.dataset.id); if(n) pickResult(nodes.findIndex(x=>x.id===n.id)); });
    suggestEl.style.display='block';
  } else { suggestEl.innerHTML='<div class="sitem empty">无语义匹配 · <a href="#" id="sugEntSem2">浏览全部概念 🏷</a> 或换个说法</div>'; suggestEl.style.display='block'; clearHL();
    const se=document.getElementById('sugEntSem2'); if(se) se.onclick=(e)=>{ e.preventDefault(); openEnt(); suggestEl.style.display='none'; }; }
  markMatches(scored.slice(0,15).map(x=>x.id));
  if(listActive) renderList();
}
function hlSuggest(){ suggestEl.querySelectorAll('.sitem').forEach((el,idx)=>el.classList.toggle('active', idx===activeSuggest)); }
function semTopTerms(nodeId, kk){
  kk=kk||4;
  if(!semData || !lastQv.length) return [];
  const n=nodes.find(x=>x.id===nodeId); if(!n||!n._latent) return [];
  const v=n._latent, comp=semData.comp, K=semData.k;
  return lastQv.map(({tok,w})=>{
    const j=VIDX[tok]; if(j==null) return {tok,w:0};
    let dot=0; const base=j*K; for(let d=0;d<K;d++) dot+=comp[base+d]*v[d];
    return {tok, w:w*dot};
  }).filter(x=>x.w>0).sort((a,b)=>b.w-a.w).slice(0,kk).map(x=>x.tok);
}

function markMatches(ids){

    const on = matchIds.has(n.id);

    n.circle.setAttribute('stroke', on?'#f59e0b':'#fff');

function clearHL(){

const matchBar=document.getElementById('matchBar');
function fitToMatches(){
  if(!matchIds.size) return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  nodes.forEach(n=>{ if(matchIds.has(n.id)){ minX=Math.min(minX,n.x-n.colR);minY=Math.min(minY,n.y-n.colR);maxX=Math.max(maxX,n.x+n.colR);maxY=Math.max(maxY,n.y+n.colR);} });
  if(minX===Infinity) return;
  const bw=Math.max(1,maxX-minX),bh=Math.max(1,maxY-minY),pad=60;
  const k=Math.min((W-pad*2)/bw,(H-pad*2)/bh,2.0);
  view.k=Math.max(0.12,k);
  view.x=W/2-((minX+maxX)/2)*view.k; view.y=H/2-((minY+maxY)/2)*view.k; applyView();
}

function durSec(s){ const m=(s||'').match(/(\d+)m/), sec=(s||'').match(/(\d+)s/); return (m?+m[1]:0)*60 + (sec?+sec[1]:0); }
function renderList(){
  const q = searchEl.value.trim();

    if(activeType!=='all' && n.type!==activeType) return false;
    if(searchMode==='kw'){
      if(q && !((n.title+'').toLowerCase().includes(q) || (n.upper+'').toLowerCase().includes(q) || (n.entities||[]).some(e=>e.toLowerCase().includes(q)) || (n.summary||'').toLowerCase().includes(q))) return false;
    } else if(searchMode==='sem'){

  });

    if(searchMode==='sem' && semRank.length){
      const sa=semRank.find(x=>x.id===a.id), sb=semRank.find(x=>x.id===b.id);
      return (sb?sb.score:-1)-(sa?sa.score:-1);
    }
    let va,vb;
    if(sortKey==='duration'){ va=durSec(a.duration); vb=durSec(b.duration); }

    else if(sortKey==='ents'){ va=(a.entities||[]).length; vb=(b.entities||[]).length; }
    else { va=(a[sortKey]||'').toString(); vb=(b[sortKey]||'').toString(); }
    if(va<vb) return -1*sortDir; if(va>vb) return 1*sortDir; return 0;
  });
  const tb = listView.querySelector('tbody');

const readerPanel=document.getElementById('readerPanel');

let curReaderNode=null;
function foldify(root){
  const hs=Array.from(root.querySelectorAll('h2,h3'));
  hs.forEach(h=>{
    // 先收集 h 之后、下一个同级标题之前的全部兄弟（在插入 box 之前收集，避免 self-append）
    const toMove=[];
    let sib=h.nextElementSibling;
    while(sib && !/^H[123]$/.test(sib.tagName)){ toMove.push(sib); sib=sib.nextElementSibling; }
    const box=document.createElement('div'); box.className='fold-body';
    h.after(box);                       // 把折叠容器插到 h 后面
    toMove.forEach(el=>box.appendChild(el));   // 整批搬入，不会把 box 自己 append 给自己
    h.onclick=()=>{ box.classList.toggle('collapsed'); h.classList.toggle('open'); };
  });
}
function openReader(n){

  readerTitle.textContent=n.title||'(无标题)';
  // 先显示面板，再渲染正文：避免 md2html 异常导致面板永不弹出
  readerPanel.classList.add('open');
  readerPanel.style.display='flex';
  try{
    readerBody.innerHTML = n.md ? md2html(n.md) : '<div class="empty">(该节点暂无原文)</div>';
    foldify(readerBody);
    enhanceKeyframeTable(readerBody, n);
  }catch(err){
    readerBody.innerHTML = '<div class="empty">原文渲染出错：'+(err&&err.message?err.message:err)+'</div>';
  }
}
function closeReader(){
  readerPanel.classList.remove('open');
  readerPanel.style.display='none';
}
document.getElementById('readerClose').onclick=closeReader;
readerPanel.addEventListener('click', e=>{ if(e.target===readerPanel) closeReader(); });
document.getElementById('readerCopy').onclick=(e)=>{ if(curReaderNode) copyText(curReaderNode.md, e.target); };

// 在「展开原文」面板的关键帧表格中注入关键帧图片（列「画面」），点击放大
function enhanceKeyframeTable(body, n){
  if(!n.keyframes || !n.keyframes.length) return;
  const heads=[...body.querySelectorAll('h2,h3')].filter(h=>/关键帧/.test(h.textContent));
  for(const h of heads){
    const next=h.nextElementSibling;
    if(next && next.classList && next.classList.contains('fold-body')){
      const tbl=next.querySelector('table.mdt');
      if(tbl){ injectKfImages(tbl, n); return; }
    } else {
      let el=next;
      while(el && el.tagName!=='TABLE') el=el.nextElementSibling;
      if(el && el.classList.contains('mdt')){ injectKfImages(el, n); return; }
    }
  }
}
function injectKfImages(table, n){
  const head=table.querySelector('thead tr');
  if(head) head.insertAdjacentHTML('beforeend','<th>画面</th>');
  const rows=[...table.querySelectorAll('tbody tr')];
  rows.forEach((tr,k)=>{
    const kf=n.keyframes[k];
    if(!kf) return;
    const td=document.createElement('td');
    const img=document.createElement('img');
    img.className='kfcell';
    img.src=kf.img;
    img.loading='lazy';
    img.title='点击放大';
    img.style.cursor='pointer';
    img.onerror=()=>{ img.style.display='none'; };
    img.onclick=()=>openKf(kf);
    td.appendChild(img);
    tr.appendChild(td);
  });
}

// ===== 关键帧放大灯箱 =====
const kfPanel=document.getElementById('kfPanel');
function openKf(k){
  if(!k) return;
  document.getElementById('kfTitle').textContent = k.t || '关键帧';
  const note = (k.note && k.note!=='—') ? '\n\n> '+k.note : '';
  document.getElementById('kfBody').innerHTML = `<img src="${esc(k.img)}" style="max-width:100%;max-height:60vh;border-radius:8px" onerror="this.style.display='none'"><div class="md" style="text-align:left;margin-top:10px">${safeMd((k.desc||'')+note,'')}</div>`;
  kfPanel.classList.add('open'); kfPanel.style.display='flex';
}
document.getElementById('kfClose').onclick=()=>{ kfPanel.classList.remove('open'); kfPanel.style.display='none'; };
kfPanel.addEventListener('click', e=>{ if(e.target===kfPanel){ kfPanel.classList.remove('open'); kfPanel.style.display='none'; } });

// ===== 灵感 / 观点发生器 =====
const inspirePanel=document.getElementById('inspirePanel');
const icard=document.getElementById('icard');
const kwpool=document.getElementById('kwpool');
let inspireNode=null;
let roamTrail=[];   // 漫游轨迹（节点 id 顺序），用于面包屑
function firstN(s,k){ s=(s||'').trim(); if(s.length<=k) return s; var cut=s.slice(0,k); var i=Math.max(cut.lastIndexOf('。'),cut.lastIndexOf('！'),cut.lastIndexOf('？'),cut.lastIndexOf('.'),cut.lastIndexOf('!')); if(i>20) return s.slice(0,i+1); return s.slice(0,k)+'…'; }
function drawInspireCard(force, recordTrail){
  const pool=nodes.filter(n=> n.status==='archived' && n.summary && n.summary.replace(/[\s…]/g,'').length>8);
  const src=pool.length?pool:nodes;
  const n = force || src[Math.floor(Math.random()*src.length)];
  // recordTrail=true：沿网络漫游，记录轨迹；否则（换一张/定位跳转）重置轨迹
  if(recordTrail){
    if(inspireNode && inspireNode.id!==n.id) roamTrail.push(inspireNode.id);
    if(roamTrail.length>8) roamTrail.shift();
  } else {
    roamTrail=[];
  }
  inspireNode=n;
  const ni=nodes.findIndex(x=>x.id===n.id);
  const neigh=links.filter(l=>l.s===ni||l.t===ni).map(l=> l.s===ni?nodes[l.t]:nodes[l.s]);
  const relHtml = neigh.length? neigh.slice(0,6).map(m=>`<span class="chip" style="cursor:pointer" data-id="${esc(m.id)}">${esc(m.title)}</span>`).join('') : '<span class="empty">暂无关联</span>';
  const entHtml = (n.entities&&n.entities.length)? n.entities.slice(0,12).map(e=>`<span class="chip kw" data-k="${esc(e)}" style="cursor:pointer">${esc(e)}</span>`).join('') : '';
  // 漫游轨迹面包屑：让“随机漫游”与“换一张”明显区分
  let trailHtml='';
  if(roamTrail.length){
    const crumbs=roamTrail.slice(-4).map(id=>{ const t=nodes.find(x=>x.id===id); return t?`<span class="crumb">${esc(t.title.length>10?t.title.slice(0,9)+'…':t.title)}</span>`:''; }).join('<span class="crumb-sep">←</span>');
    trailHtml=`<div class="trail">🌐 漫游路径：${crumbs}<span class="crumb-sep">←</span><b>${esc(n.title.length>10?n.title.slice(0,9)+'…':n.title)}</b></div>`;
  }
  icard.innerHTML = `
    <div class="badge ${n.type==='text'?'b-text':n.type==='visual'?'b-visual':'b-hybrid'}">${typeLabel(n.type)}</div>
    <div class="tt">${esc(n.title)}</div>
    <div class="meta">${esc(n.upper)} · ${esc(n.duration)}</div>
    ${trailHtml}
    <div class="pt">${esc(firstN(n.summary,160))}</div>
    ${entHtml?`<div class="sec">概念线索</div><div class="kwrow">${entHtml}</div>`:''}
    <div class="sec">关联观点（${neigh.length}）</div>
    <div class="kwrow">${relHtml}</div>
    <div class="acts">
      <button class="tbtn" id="iRead">看原文</button>
      <button class="tbtn" id="iLocate">在网图定位</button>
      <button class="tbtn" id="iRoam">随机漫游 →</button>
      <button class="tbtn" id="iNext">换一张</button>
    </div>`;
  document.getElementById('iRead').onclick=()=>{ openReader(n); inspirePanel.classList.remove('open'); };
  document.getElementById('iLocate').onclick=()=>{ const j=nodes.findIndex(x=>x.id===n.id); select(j); centerOn(j); inspirePanel.classList.remove('open'); };
  document.getElementById('iRoam').onclick=()=>{
    const ni2=nodes.findIndex(x=>x.id===n.id);
    const nb=links.filter(l=>l.s===ni2||l.t===ni2).map(l=> l.s===ni2?nodes[l.t]:nodes[l.s]);
    if(nb.length){
      const nx=nb[Math.floor(Math.random()*nb.length)];
      drawInspireCard(nx, true);   // 真正沿关联网络漫游，并记录轨迹
    } else {
      // 该节点无关联：随机跳一张并提示，避免“点了没反应”
      drawInspireCard(undefined, false);
      const tb=icard.querySelector('.trail'); if(tb) tb.innerHTML='🌐 该节点暂无关联，已随机跳到另一观点';
    }
  };
  document.getElementById('iNext').onclick=()=>drawInspireCard();  // 换一张：重置漫游轨迹
  icard.querySelectorAll('.chip.kw').forEach(el=>el.onclick=()=>{ doSearchKw(el.dataset.k); inspirePanel.classList.remove('open'); });
  icard.querySelectorAll('.chip[data-id]').forEach(el=>el.onclick=()=>{ const j=nodes.findIndex(x=>x.id===el.dataset.id); if(j>=0){ select(j); centerOn(j); } inspirePanel.classList.remove('open'); });
}
function randomKW(){
  const set=new Set();
  nodes.forEach(n=> (n.entities||[]).forEach(e=>{ if(e && e.length>=2) set.add(e); }));
  const arr=Array.from(set), pick=[];
  for(let i=0;i<Math.min(10,arr.length);i++){ const k=Math.floor(Math.random()*arr.length); pick.push(arr.splice(k,1)[0]); }
  kwpool.innerHTML = pick.length? pick.map(e=>`<span class="chip kw" data-k="${esc(e)}" style="cursor:pointer">${esc(e)}</span>`).join('') : '<span class="empty">暂无概念</span>';
  kwpool.querySelectorAll('.chip.kw').forEach(el=>el.onclick=()=>{ doSearchKw(el.dataset.k); inspirePanel.classList.remove('open'); });
}
function doSearchKw(kw){
  searchMode='kw';
  document.querySelectorAll('#modeBar .fbtn').forEach(x=>x.classList.toggle('active', x.dataset.m==='kw'));
  searchEl.value=kw; searchUpdate();
}
function openInspire(){ drawInspireCard(); randomKW(); inspirePanel.classList.add('open'); }
document.getElementById('inspireBtn').onclick=openInspire;
document.getElementById('inspireClose').onclick=()=>inspirePanel.classList.remove('open');
inspirePanel.addEventListener('click', e=>{ if(e.target===inspirePanel) inspirePanel.classList.remove('open'); });
document.getElementById('kwRefresh').onclick=randomKW;

// ===== 概念浏览器（全量实体频序检索） =====
const entPanel=document.getElementById('entPanel');
const entList=document.getElementById('entList');
const entSearch=document.getElementById('entSearch');
let entFreq=[];
function computeEntFreq(){
  const m={};
  nodes.forEach(n=>(n.entities||[]).forEach(e=>{ if(e&&e.length>=2) m[e]=(m[e]||0)+1; }));
  return Object.entries(m).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
}
function renderEntList(q){
  const arr = q ? entFreq.filter(([e])=>e.toLowerCase().includes(q.toLowerCase())) : entFreq;
  entList.innerHTML = arr.length
    ? arr.map(([e,c])=>`<div class="rel" data-k="${esc(e)}" style="display:flex;justify-content:space-between;align-items:center"><span>${esc(e)}</span><span class="sm">${c}</span></div>`).join('')
    : '<div class="empty">无匹配概念</div>';
  entList.querySelectorAll('.rel').forEach(el=>el.onclick=()=>{ doSearchKw(el.dataset.k); entPanel.classList.remove('open'); });
}
function openEnt(){ entFreq=computeEntFreq(); entSearch.value=''; renderEntList(''); entPanel.classList.add('open'); }
document.getElementById('entBtn').onclick=openEnt;
document.getElementById('entClose').onclick=()=>entPanel.classList.remove('open');
entPanel.addEventListener('click', e=>{ if(e.target===entPanel) entPanel.classList.remove('open'); });
entSearch.addEventListener('input', ()=>renderEntList(entSearch.value.trim()));

// Esc 关闭弹层 / 全局快捷键
const helpPanel=document.getElementById('helpPanel');
const helpBody=document.getElementById('helpBody');
const HELP_MD=`## 快捷键
- **/** 聚焦搜索框
- **g** 切换 网图 / 列表
- **t** 切换 深色 / 浅色
- **f** 适应屏幕
- **r** 打开灵感发生器
- **← → ↑ ↓** 在节点间移动选择（自动居中）
- **Enter** 打开当前节点原文阅读
- **Esc** 关闭弹层 / 下拉

## 检索
- 顶部「关键词 / 语义」切换：关键词按标题·UP主·概念·摘要匹配；语义用自然语言描述观点，按 LSI 主题相似度排序。
- 详情面板中的概念 chip、概念浏览器（🏷）均可一键检索。

## 探索
- 点击节点：高亮其直接关联与连线，右侧显示详情、关键帧、概念与联想。
- 💡 灵感：随机观点 + 关联漫游，沿关联网络顺藤摸瓜。
- 滚轮缩放、拖空白平移、拖动节点重排。`;
function openHelp(){ helpBody.innerHTML=md2html(HELP_MD); helpPanel.classList.add('open'); }
document.getElementById('helpBtn').onclick=openHelp;
document.getElementById('helpClose').onclick=()=>helpPanel.classList.remove('open');
helpPanel.addEventListener('click', e=>{ if(e.target===helpPanel) helpPanel.classList.remove('open'); });
let navCursor=-1;
function navList(){
  if(listActive) return Array.from(listView.querySelectorAll('tr[data-i]')).map(tr=>+tr.dataset.i);
  return nodes.map((n,i)=>i).filter(i=> nodes[i].el.style.display!=='none');
}
function navStep(dir){
  const list=navList(); if(!list.length) return;
  if(navCursor<0 || !list.includes(navCursor)) navCursor=list[0];
  else { let idx=list.indexOf(navCursor); idx=(idx+dir+list.length)%list.length; navCursor=list[idx]; }
  select(navCursor); centerOn(navCursor);
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(readerPanel.classList.contains('open')) closeReader();
    if(inspirePanel.classList.contains('open')) inspirePanel.classList.remove('open');
    if(entPanel.classList.contains('open')) entPanel.classList.remove('open');
    if(helpPanel.classList.contains('open')) helpPanel.classList.remove('open');
    if(kfPanel.classList.contains('open')){ kfPanel.classList.remove('open'); kfPanel.style.display='none'; }
    return;
  }
  const ae=document.activeElement;
  if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')) return;
  if(e.key==='/'){ e.preventDefault(); searchEl.focus(); searchEl.select(); return; }
  if(e.key==='?'){ e.preventDefault(); openHelp(); return; }
  if(e.key==='g'){ e.preventDefault(); toggleView(!listActive); return; }
  if(e.key==='t'){ e.preventDefault(); document.getElementById('theme').click(); return; }
  if(e.key==='f'){ e.preventDefault(); document.getElementById('fit').click(); return; }
  if(e.key==='r'){ e.preventDefault(); openInspire(); return; }
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); navStep(1); return; }
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); navStep(-1); return; }
  if(e.key==='Enter'){ if(selected>=0) openReader(nodes[selected]); return; }
});

fetch('data.json').then(r=>r.json()).then(d=>{DATA=d; build(); restoreState();}).catch(err=>{
  side.innerHTML='<div class="empty">未找到 data.json。<br>请先运行归档流水线（scan_favorites → classify_meta → archive_batch → build_graph）生成节点数据，再重新打开本页面。</div>';
});
window.addEventListener('resize',()=>{ W=svg.clientWidth; H=svg.clientHeight; svg.setAttribute('viewBox',`0 0 ${W} ${H}`); fitToScreen(); });
</script>
